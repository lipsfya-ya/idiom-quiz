["情感心理類"]}, {"i": "萍水相逢", "d": "比喻兩個人本來不相識，因機緣巧合偶然相逢，同時亦指交情尚屬微淺。", "c": ["情感心理類"]}, {"i": "萬丈高樓平地起", "d": "比喻萬事萬物都是從基礎做起，由小到大，由低到高，逐漸發展而成。", "c": ["生活器物類"]}, {"i": "萬事俱備，只欠東風", "d": "比喻辦一件事，一切都準備好了，就缺最後的關鍵條件。", "c": ["文學典故修辭類"]}, {"i": "萬家燈火", "d": "形容城市繁華的夜景。", "c": ["天文氣象時間類"]}, {"i": "萬箭穿心", "d": "好像一萬枝箭穿透心中。形容極端的痛苦。", "c": ["戰爭軍事類"]}, {"i": "萬籟俱寂", "d": "萬物無聲，一片寂靜。", "c": ["身體感官類"]}, {"i": "萬紫千紅", "d": "形容百花盛開，色彩絢麗的景象。亦用於比喻事物豐富而多采多姿。", "c": ["景物環境類"]}, {"i": "落花流水", "d": "形容暮春殘敗的景象，亦用來形容零落殘敗，雜亂的景象。", "c": ["植物花木類"]}, {"i": "落落大方", "d": "舉止自然坦率，毫無扭捏作態、矯揉造作。", "c": ["品格修養類"]}, {"i": "落葉歸根", "d": "比喻久居異地之人返回家鄉。", "c": ["景物環境類"]}, {"i": "蒲柳之姿", "d": "比喻身體衰弱。", "c": ["文學典故修辭類", "植物花木類"]}, {"i": "蒸蒸日上", "d": "一天一天興盛發展，形容事物不斷地進步發展。", "c": ["生活器物類"]}, {"i": "蓬戶甕牖", "d": "形容簡陋的居處。亦借指貧寒之家。", "c": ["景物環境類"]}, {"i": "蓬門篳戶", "d": "形容貧苦人家簡陋的居室。", "c": ["景物環境類"]}, {"i": "蕙心紈質", "d": "比喻女子芳潔的心地、高雅的品德。", "c": ["品格修養類"]}, {"i": "蕙質蘭心", "d": "比喻女子芳潔的心地、高雅的品德。", "c": ["人物形象類", "植物花木類"]}, {"i": "蕭規曹隨", "d": "比喻後人依循前人所訂的規章辦事。", "c": ["文學典故修辭類"]}, {"i": "薪火相傳", "d": "比喻師生授受不絕，或種族、血統、文化精神的傳承，綿延不盡。", "c": ["學習教育類"]}, {"i": "藍田生玉", "d": "比喻名門出俊秀子弟。藍田，山名，位於陝西省藍田縣東南，相傳此山出美玉。", "c": ["顏色類"]}, {"i": "藕斷絲連", "d": "蓮藕斷了，藕絲仍相連。比喻表面關係斷絕，實際仍有牽連。多指男女間情意未絕。", "c": ["植物花木類"]}, {"i": "虎尾春冰", "d": "比喻處於極端危險的環境。", "c": ["天文氣象時間類"]}, {"i": "虎父無犬子", "d": "比喻上一代強，下一代也不弱。", "c": ["情感心理類"]}, {"i": "虎背熊腰", "d": "形容人的體型魁偉。", "c": ["身體感官類"]}, {"i": "虛懷若谷", "d": "形容為人謙虛，能接納他人的意見。", "c": ["品格修養類", "情感心理類", "文學典故修辭類"]}, {"i": "蚍蚍蜉蜉撼樹", "d": "比喻不自量力。", "c": ["動物類"]}, {"i": "蚍蜉撼樹", "d": "指大螞蟻妄圖以自我之力去搖動大樹。比喻不自量力。", "c": ["動物類", "植物花木類"]}, {"i": "蛛絲馬跡", "d": "蛛網的細絲與馬蹄的痕跡。比喻可供尋查推求的細微線索。", "c": ["動物類"]}, {"i": "蜂屯蟻聚", "d": "比喻如同蜂蟻聚集般紛紜雜亂。", "c": ["動物類"]}, {"i": "蜂擁而上", "d": "比喻如蜂般簇擁上來。", "c": ["其他", "動物類"]}, {"i": "蜂擁而至", "d": "比喻如蜂般擁進來。", "c": ["動物類"]}, {"i": "蜻蜓點水", "d": "蜻蜓以尾點水而產卵，輕觸即起。(1)形容著力少或費時短。(2)比喻膚淺而不深入。", "c": ["動物類"]}, {"i": "融會貫通", "d": "形容將各種相關的知識或事物加以融合、貫穿，進而獲得全面通徹的領會。", "c": ["學習教育類"]}, {"i": "螳臂當車", "d": "指螳螂立於車道中，舉起雙臂，妄想要阻擋車子前進。比喻不自量力。", "c": ["動物類"]}, {"i": "螳螂捕蟬，黃雀再後", "d": "比喻眼光短淺，只貪圖眼前的利益而忽略背後隱藏的危險。", "c": ["顏色類"]}, {"i": "蟪蛄不知春秋", "d": "蟪蛄夏生秋死，所以不知春秋。比喻生命短促或見識短淺。", "c": ["天文氣象時間類"]}, {"i": "蠅營狗苟", "d": "比喻四處鑽營，只為謀利；不顧廉恥，但求偷生的生活態度。", "c": ["動物類"]}, {"i": "蠅頭小利", "d": "比喻如蠅頭般微小的利益。", "c": ["動物類"]}, {"i": "蠶食鯨吞", "d": "像蠶吃桑葉般的和緩，或像鯨吞食物般的猛烈。比喻不同的侵略併吞方式。", "c": ["動物類"]}, {"i": "行將就木", "d": "比喻年紀已大，壽命將盡。", "c": ["植物花木類"]}, {"i": "街談巷議", "d": "大街小巷中的談說議論。", "c": ["人際溝通表達類"]}, {"i": "衣缽相傳", "d": "指師父傳法給弟子，弟子也得到師父禪法的精華。泛指思想、技術、學術等的傳授。", "c": ["生活器物類"]}, {"i": "衣錦還鄉", "d": "身穿錦鏽的衣服返回故鄉。形容人功成名就後榮歸故鄉。衣，音ㄧˋ，動詞，穿著的意思。", "c": ["景物環境類"]}, {"i": "衣食父母", "d": "泛指供給生活所需的人。", "c": ["情感心理類"]}, {"i": "表壯不如裡壯", "d": "比喻丈夫有才能還不如妻子有賢德。", "c": ["文學典故修辭類"]}, {"i": "表裡不一", "d": "內外不一致，指思想和言行不一致。", "c": ["文學典故修辭類"]}, {"i": "袍澤之誼", "d": "指軍隊中同事的交情、友誼。", "c": ["情感心理類"]}, {"i": "袖手旁觀", "d": "形容置身事外，不予過問。", "c": ["身體感官類"]}, {"i": "裡應外合", "d": "外面圍攻，裡面接應。裡外相互配合。", "c": ["文學典故修辭類"]}, {"i": "見機行事", "d": "視情況變化而採因應之道。", "c": ["處境際遇做事態度類"]}, {"i": "見義勇為", "d": "遇到合乎正義的事，就應該奮勇的去做。", "c": ["品格修養類", "文學典故修辭類"]}, {"i": "見風轉舵", "d": "比喻隨機應變，視情況而行動。", "c": ["處境際遇做事態度類"]}, {"i": "解弦更張", "d": "比喻重新變更法度或計畫。", "c": ["生活器物類"]}, {"i": "解甲歸田", "d": "脫下鎧甲，回家種田。指軍人退伍後回鄉務農。", "c": ["景物環境類"]}, {"i": "觥籌交錯", "d": "酒器和酒籌錯雜相交。比喻暢飲。", "c": ["生活器物類"]}, {"i": "觸景生情", "d": "看見眼前景象而引發內心種種情緒。", "c": ["回憶往事類"]}, {"i": "觸目成誦", "d": "看過一遍即能誦讀出來。形容記憶力很強。", "c": ["回憶往事類"]}, {"i": "觸類旁通", "d": "對已知事物的認識與理解，進而通達對其他類似事物的認知。", "c": ["學習教育類"]}, {"i": "言不由衷", "d": "形容言詞與心意相違背。泛指心口不一，虛應敷衍。", "c": ["人際溝通表達類"]}, {"i": "言之無物", "d": "文章或言論的內容空洞。", "c": ["人際溝通表達類"]}, {"i": "言傳身教", "d": "用言語和行動來教示他人。", "c": ["學習教育類"]}, {"i": "言寡尤，行寡悔", "d": "說話很少錯誤，做事很少悔恨。形容言談舉止小心謹慎。", "c": ["情感心理類"]}, {"i": "言必信，行必果", "d": "講話有信用，做事堅決果斷。", "c": ["品格修養類", "植物花木類"]}, {"i": "言簡意賅", "d": "言辭簡練，意思完備。", "c": ["人際溝通表達類"]}, {"i": "言而無信", "d": "說話不講信用。", "c": ["品格修養類"]}, {"i": "討價還價", "d": "○1買賣時，賣方索價，買方還價，以達到各自的理想價錢。○2談判或協商時，雙方爭論各自所提的條件。", "c": ["生活器物類"]}, {"i": "記憶猶新", "d": "對接觸過的人或事，還記得很清楚，就像最近才發生的一樣。", "c": ["回憶往事類"]}, {"i": "詩朋酒友", "d": "一起吟詩作對、飲酒取樂的朋友。", "c": ["情感心理類"]}, {"i": "話中有話", "d": "言語中含有其他的意思。", "c": ["人際溝通表達類"]}, {"i": "語無倫次", "d": "說話顛三倒四，毫無條理。", "c": ["人際溝通表達類"]}, {"i": "誠心誠意", "d": "真摯誠懇。", "c": ["品格修養類"]}, {"i": "說黑道白", "d": "信口亂說，妄加批評。", "c": ["顏色類"]}, {"i": "調虎離山", "d": "比喻用計誘使對方離開他的據點，以便趁機行事，達成目的。", "c": ["戰爭軍事類"]}, {"i": "談情說愛", "d": "男女雙方傾訴愛慕之意。", "c": ["情感心理類"]}, {"i": "談笑風生", "d": "談笑之際興致高昂，言辭風趣。", "c": ["人際溝通表達類"]}, {"i": "謙沖自牧", "d": "為人處事謙和退讓，以修養自我的德性。", "c": ["品格修養類", "情感心理類"]}, {"i": "謝天謝地", "d": "感激慶幸的話。", "c": ["情感心理類"]}, {"i": "謹言慎行", "d": "指言談小心，行事謹慎。", "c": ["品格修養類"]}, {"i": "譁眾取寵", "d": "用迎合眾人喜好的言語行動，博取他人對自己的喜愛。", "c": ["人際溝通表達類"]}, {"i": "變幻莫測", "d": "事物變化多端，難以預測。", "c": ["處境際遇做事態度類"]}, {"i": "讚不絕口", "d": "口中不停的稱讚。", "c": ["人際溝通表達類"]}, {"i": "豁達大度", "d": "形容心胸寬闊、度量宏大，能容人。", "c": ["品格修養類"]}, {"i": "貌合神離", "d": "表面上彼此很切合，實際上心思不一樣。", "c": ["情感心理類"]}, {"i": "負荊請罪", "d": "比喻主動向對方承認錯誤，請求責罰和原諒。", "c": ["文學典故修辭類"]}, {"i": "貨真價實", "d": "貨品真確而價格實在，或泛指事物真實不假。", "c": ["生活器物類"]}, {"i": "貪多務得", "d": "求知時，期望能多有所得。後亦用於指慾望很大，貪得無厭。", "c": ["學習教育類"]}, {"i": "貪贓枉法", "d": "指貪汙受賄，破壞法紀。", "c": ["處境際遇做事態度類"]}, {"i": "責無旁貸", "d": "自己應盡的責任，沒有理由推卸。", "c": ["處境際遇做事態度類"]}, {"i": "買櫝還珠", "d": "比喻捨本逐末，取捨失當。典出韓非子外儲說左上。", "c": ["文學典故修辭類", "生活器物類"]}, {"i": "賠了夫人又折兵", "d": "比喻不但沒有占到便宜，反而吃大虧。", "c": ["文學典故修辭類"]}, {"i": "赤手空拳", "d": "指手中空無一物。亦用於形容沒有一點憑藉。", "c": ["身體感官類"]}, {"i": "赤膽忠心", "d": "形容極為忠誠不二。", "c": ["顏色類"]}, {"i": "走馬看花", "d": "比喻粗略、匆促地觀看，不能仔細深入了解事物。", "c": ["身體感官類"]}, {"i": "超群絕倫", "d": "形容才能出眾。", "c": ["文學典故修辭類"]}, {"i": "躍然紙上", "d": "形容描繪的對象非常生動逼真。", "c": ["學習教育類"]}, {"i": "身不由己", "d": "身體不能由自己支配。表示本身失去自主的能力。", "c": ["處境際遇做事態度類"]}, {"i": "身先士卒", "d": "①作戰時將帥奮勇殺敵於士兵之前。②比喻領導、帶頭走在眾人之前。", "c": ["品格修養類"]}, {"i": "身無長物", "d": "比喻節儉或貧困。", "c": ["文學典故修辭類"]}, {"i": "車載斗量", "d": "用車裝，拿斗量。形容數量很多，不可勝數。", "c": ["文學典故修辭類"]}, {"i": "輕裘緩帶", "d": "形容態度閒適從容。", "c": ["天文氣象時間類"]}, {"i": "輕諾寡信", "d": "輕易答應別人的請求，卻很少實踐諾言。", "c": ["品格修養類"]}, {"i": "轟轟烈烈", "d": "形容聲勢浩大，足以震撼人心。", "c": ["文學典故修辭類"]}, {"i": "辯才無礙", "d": "能言善道。", "c": ["人際溝通表達類"]}, {"i": "近墨者黑", "d": "指稱環境會影響和改變人的習性。", "c": ["顏色類"]}, {"i": "近水樓臺", "d": "指因接近某些人或事物而得到優先方便獲利的機會。", "c": ["生活器物類"]}, {"i": "近鄉情怯", "d": "久別故鄉，再重返家園時，所產生的一種既期待又畏懼的心情。", "c": ["景物環境類"]}, {"i": "追悔不及", "d": "悔恨過去的事，卻已無法挽回了。", "c": ["回憶往事類"]}, {"i": "逍遙法外", "d": "犯罪者逃避了應受的法律制裁，仍自由自在。", "c": ["處境際遇做事態度類"]}, {"i": "通時達變", "d": "指不墨守常規，根據實際情況作適當的處置。", "c": ["天文氣象時間類"]}, {"i": "造福桑梓", "d": "為鄉里百姓謀求幸福。", "c": ["植物花木類"]}, {"i": "進退維谷", "d": "形容前進後退都無路可走的困窘處境。", "c": ["文學典故修辭類"]}, {"i": "遊手好閒", "d": "遊蕩貪玩，無所事事的樣子。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "運籌帷幄", "d": "比喻謀劃策略。", "c": ["戰爭軍事類"]}, {"i": "過五關，斬六將", "d": "比喻突破重重難關。", "c": ["文學典故修辭類"]}, {"i": "過猶不及", "d": "做事過分就好比做得不夠一樣，皆不妥當。指事情要做得恰到好處。", "c": ["文學典故修辭類"]}, {"i": "過目不忘", "d": "形容記憶力很強，看過後不易忘記。", "c": ["回憶往事類"]}, {"i": "過眼雲煙", "d": "比喻事物消逝極快，不留痕跡。", "c": ["回憶往事類"]}, {"i": "道聽塗說", "d": "在路上聽到一些沒有根據的話，不加求證就又在路途中說給其他的人聽。", "c": ["人際溝通表達類", "文學典故修辭類"]}, {"i": "違法亂紀", "d": "違反法律，擾亂綱紀。", "c": ["處境際遇做事態度類"]}, {"i": "遠交近攻", "d": "親睦遠國，攻伐近鄰的外交手段。", "c": ["戰爭軍事類"]}, {"i": "遺世絕俗", "d": "脫離俗世而獨自生存。", "c": ["品格修養類"]}, {"i": "遺臭萬年", "d": "指惡名永傳後世，為人所唾棄。", "c": ["身體感官類"]}, {"i": "避世離俗", "d": "避開塵世隱居起來，以擺脫世俗的一切牽絆。", "c": ["品格修養類"]}, {"i": "邯鄲學步", "d": "比喻模仿不成，反而失去自我。典出莊子秋水。邯鄲，音ㄏㄢˊㄉㄢ。", "c": ["學習教育類", "文學典故修辭類"]}, {"i": "鄭重其事", "d": "處理事物的態度嚴肅認真。", "c": ["處境際遇做事態度類"]}, {"i": "酒介齊眉", "d": "祝人夫婦長壽之辭。", "c": ["生活器物類"]}, {"i": "酒囊飯袋", "d": "譏稱只會吃喝，而不會辦事的無能之人。", "c": ["生活器物類"]}, {"i": "酒池肉林", "d": "以酒為地，懸肉為林。用以形容酒肉之多。後用來比喻生活極端奢侈縱慾，毫無節制。", "c": ["文學典故修辭類", "生活器物類"]}, {"i": "酒肉朋友", "d": "只知聚在一起吃喝玩樂，而不能相互砥礪、患難與共的朋友。", "c": ["生活器物類"]}, {"i": "酒過三巡", "d": "巡，遍。宴會中向同桌之人敬酒一遍為一巡，酒過三巡指敬酒三遍，意謂宴會已進行一段時間。", "c": ["生活器物類"]}, {"i": "酒酣耳熱", "d": "形容酒喝得意興正濃的暢快神態。", "c": ["生活器物類"]}, {"i": "酒醉飯飽", "d": "形容吃喝非常痛快而滿足。", "c": ["生活器物類"]}, {"i": "酸甜苦辣", "d": "各種味道。也用來比喻生活中如意、失意等種種遭遇。", "c": ["身體感官類"]}, {"i": "里仁為美", "d": "選擇住處應挑有仁風的地方。後指敦親睦鄰。", "c": ["文學典故修辭類"]}, {"i": "重溫舊夢", "d": "(1)回憶或重新經歷往日的情景。(2)與失和或失去連絡的舊故，再次聚首，重修舊好。", "c": ["回憶往事類"]}, {"i": "量時度力", "d": "衡量時機，估計能力。形容做事態度謹慎有計畫。量，音ㄌㄧㄤˋ。度，音ㄉㄨㄛˋ。", "c": ["品格修養類"]}, {"i": "金石絲竹", "d": "泛指各種樂器，或指各種音樂。", "c": ["生活器物類"]}, {"i": "金碧輝煌", "d": "形容裝飾華彩絢爛。多指宮殿等建築物。", "c": ["景物環境類"]}, {"i": "金聲玉振", "d": "比喻才德兼備，學識淵博。", "c": ["身體感官類"]}, {"i": "金蘭之交", "d": "情意相投的好朋友。", "c": ["情感心理類", "植物花木類"]}, {"i": "金蟬脫殼", "d": "金蟬蛻變於脫去外殼。比喻利用假象藉以脫身。", "c": ["動物類", "戰爭軍事類"]}, {"i": "金鼓齊鳴", "d": "形容軍威壯盛或戰況激烈。", "c": ["生活器物類"]}, {"i": "釜底抽薪", "d": "指從鍋底抽掉柴火。比喻從根本上解決問題。後亦用來比喻從源頭斷絕。", "c": ["戰爭軍事類", "生活器物類"]}, {"i": "釜底游魚", "d": "比喻處於危亡困境中的人。也作「釜中之魚」。", "c": ["動物類"]}, {"i": "鉅細靡遺", "d": "重要的或不重要的都不會遺漏。比喻做事很仔細。", "c": ["文學典故修辭類"]}, {"i": "銀鉤鐵畫", "d": "形容書畫筆法剛勁有活力。", "c": ["學習教育類"]}, {"i": "銘感五內", "d": "五內，五臟。比喻非常感激。", "c": ["情感心理類"]}, {"i": "銷聲匿跡", "d": "隱藏形跡，不公開出現。", "c": ["身體感官類"]}, {"i": "鋃鐺入獄", "d": "即被捕、坐牢的意思。", "c": ["其他"]}, {"i": "錦繡河山", "d": "形容國土山河像精美的絲織品一樣美好。", "c": ["景物環境類"]}, {"i": "鍥而不捨", "d": "鍥，鏤刻。捨，捨棄、停止。鍥而不捨指不斷刻下去而不停止。比喻堅持到底，奮勉不懈。", "c": ["品格修養類", "處境際遇做事態度類"]}, {"i": "鏡花水月", "d": "鏡中的花，水裡的月。比喻空幻不實在。", "c": ["天文氣象時間類", "植物花木類"]}, {"i": "鐘鳴鼎食", "d": "古代富貴人家吃飯時，擊鐘為號，列鼎而食。形容富貴之家的奢侈豪華。", "c": ["生活器物類"]}, {"i": "鐵杵磨針", "d": "比喻人有恆心和耐力，則做事一定能成功。", "c": ["品格修養類", "處境際遇做事態度類"]}, {"i": "鐵樹開花", "d": "比喻事物罕見或極難實現。鐵樹，指蘇鐵，原產於熱帶，不常開花。", "c": ["植物花木類"]}, {"i": "鐵面無私", "d": "公正嚴明而不偏私。", "c": ["品格修養類"]}, {"i": "鑽牛角尖", "d": "比喻人固執而不知變通，費力的研究無用或無法解決的問題。", "c": ["動物類"]}, {"i": "鑿壁偷光", "d": "本指漢代匡衡鑿穿牆壁，藉由鄰家燭光照讀的故事。後比喻刻苦勤學。", "c": ["學習教育類"]}, {"i": "門可羅雀", "d": "形容做官的人從擁有權勢到離開政治中心後門庭冷落、賓客稀少的景況。", "c": ["其他"]}, {"i": "門庭若市", "d": "比喻上門來的人很多。", "c": ["文學典故修辭類"]}, {"i": "閉月羞花", "d": "形容女子容貌姣好，足使花、月為之退掩、失色。", "c": ["天文氣象時間類", "植物花木類"]}, {"i": "開花結果", "d": "作物成熟，可以收穫。引申指付出辛勞有所回報。", "c": ["植物花木類"]}, {"i": "開誠布公", "d": "敞開胸懷，提出公正客觀的見解。比喻誠意待人，坦白無私。", "c": ["品格修養類"]}, {"i": "閒情逸致", "d": "閒適安逸的情趣。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "閒雲野鶴", "d": "比喻來去自如，無所羈絆的人。", "c": ["動物類", "天文氣象時間類"]}, {"i": "陰溝裡翻船", "d": "事情的演變出乎意料之外。", "c": ["生活器物類"]}, {"i": "陰錯陽差", "d": "比喻各種偶然的因素湊在一起所造成的誤會或錯誤。", "c": ["文學典故修辭類", "處境際遇做事態度類"]}, {"i": "陳規陋習", "d": "陳舊的規章，不良的習俗。", "c": ["景物環境類"]}, {"i": "陳陳相因", "d": "舊穀一年一年地累積堆陳。後用來比喻因襲舊例，缺乏創新。", "c": ["文學典故修辭類"]}, {"i": "陽春白雪", "d": "較為深奧難懂的音樂。後用來比喻精深高雅的文學藝術作品。", "c": ["天文氣象時間類"]}, {"i": "隨心所欲", "d": "完全順隨自己的心意去做事。", "c": ["處境際遇做事態度類"]}, {"i": "隨機應變", "d": "隨著時機和情況的變化而靈活應付。", "c": ["處境際遇做事態度類"]}, {"i": "隨波逐流", "d": "比喻人沒有確定的方向和目標，只依從環境潮流行事。", "c": ["處境際遇做事態度類"]}, {"i": "隨遇而安", "d": "指能安於所處的環境。後亦比喻安於現狀，不思長進。", "c": ["處境際遇做事態度類"]}, {"i": "雁杳魚沉", "d": "比喻音訊全無。", "c": ["品格修養類"]}, {"i": "集思廣益", "d": "集結眾人的智慧，廣泛吸收有益的意見。", "c": ["學習教育類"]}, {"i": "雍容文雅", "d": "神態自若，舉止儒雅。", "c": ["品格修養類"]}, {"i": "雍容華貴", "d": "溫和大方，端莊華麗。", "c": ["植物花木類"]}, {"i": "雍容閒雅", "d": "神態自若，舉止儒雅。", "c": ["天文氣象時間類"]}, {"i": "雕梁畫棟", "d": "有彩繪雕刻的梁柱。用來形容建築物的富麗堂皇。", "c": ["學習教育類", "景物環境類"]}, {"i": "雕蟲小技", "d": "比喻微不足道的技能。", "c": ["動物類"]}, {"i": "雞犬不寧", "d": "比喻被嚴重騷擾。", "c": ["動物類"]}, {"i": "雞犬桑麻", "d": "形容鄉野田園生活。", "c": ["植物花木類"]}, {"i": "雞皮鶴髮", "d": "白髮皺皮。形容老人的形貌。", "c": ["動物類"]}, {"i": "雞鳴狗盜", "d": "比喻有某種卑下技能的人，或指卑微的技能。亦用於形容卑劣低下的人或事。", "c": ["動物類", "文學典故修辭類"]}, {"i": "離情別緒", "d": "離別時的情緒。", "c": ["品格修養類"]}, {"i": "雨後春筍", "d": "比喻事物在某一時期新生之後大量湧現，迅速發展。", "c": ["天文氣象時間類"]}, {"i": "雨過天青", "d": "比喻情況由壞轉好。", "c": ["天文氣象時間類"]}, {"i": "雨露均霑", "d": "比喻恩澤或利益平均分配。", "c": ["天文氣象時間類"]}, {"i": "雪上加霜", "d": "比喻禍患接踵而至，使傷害加重。", "c": ["天文氣象時間類"]}, {"i": "雪中送炭", "d": "比喻在人艱困危急之時，給予適時的援助。", "c": ["天文氣象時間類"]}, {"i": "雪泥鴻爪", "d": "比喻往事所遺留的痕跡。", "c": ["回憶往事類"]}, {"i": "電光石火", "d": "閃電呈現的亮光，火石擊發的火光。比喻轉瞬間即逝。", "c": ["天文氣象時間類"]}, {"i": "震耳欲聾", "d": "形容聲音很大，幾乎要將耳朵震聾。", "c": ["身體感官類"]}, {"i": "霧裡看花", "d": "形容視界模糊，看不清楚。比喻看不清楚事情的真相。", "c": ["天文氣象時間類", "身體感官類"]}, {"i": "霸陵折柳", "d": "指送客作別。", "c": ["植物花木類"]}, {"i": "青出於藍", "d": "比喻弟子勝於老師，或後輩優於前輩。", "c": ["顏色類"]}, {"i": "青山綠水", "d": "常用以形容風景的秀麗。", "c": ["顏色類"]}, {"i": "青梅竹馬", "d": "比喻從小就相識的同伴。", "c": ["情感心理類", "植物花木類"]}, {"i": "青紅皂白", "d": "指各種不同的顏色。比喻事情的是非情由。", "c": ["顏色類"]}, {"i": "青黃不接", "d": "指作物還沒成熟，存糧又已吃完。比喻有所匱乏，一時難以接濟。", "c": ["顏色類"]}, {"i": "面如冠玉", "d": "形容男子面貌俊美，有如鑲飾在帽上的美玉。", "c": ["人物形象類"]}, {"i": "面如土色", "d": "臉色像泥土一樣。形容驚恐到了極點。", "c": ["顏色類"]}, {"i": "面目全非", "d": "完全不是原先的樣子。形容變化很大。", "c": ["身體感官類"]}, {"i": "面紅耳赤", "d": "形容因高溫、羞愧、焦急或發怒時而臉上、耳朵發紅的樣子。", "c": ["情感心理類", "顏色類"]}, {"i": "面黃肌瘦", "d": "形容人消瘦、營養不良的樣子。", "c": ["顏色類"]}, {"i": "鞠躬盡瘁", "d": "意謂恭謹戒慎，不辭勞病地貢獻心力。", "c": ["文學典故修辭類"]}, {"i": "韋編三絕", "d": "比喻讀書勤奮，刻苦治學。", "c": ["學習教育類", "文學典故修辭類"]}, {"i": "音容宛在", "d": "人的聲音與容貌彷若在眼前，多用於弔唁之詞。", "c": ["身體感官類"]}, {"i": "韶光似箭", "d": "形容時光像箭一樣飛逝不再。", "c": ["天文氣象時間類"]}, {"i": "響遏行雲", "d": "形容聲音響亮高妙，能止住行雲。", "c": ["身體感官類"]}, {"i": "順水推舟", "d": "比喻順應情勢行事。", "c": ["生活器物類"]}, {"i": "順藤摸瓜", "d": "順著瓜藤可以摸到瓜。比喻沿著線索追究，可以得到結果。", "c": ["植物花木類"]}, {"i": "頤指氣使", "d": "形容以高傲的態度指使屬下。", "c": ["情感心理類", "身體感官類"]}, {"i": "頭昏眼花", "d": "頭腦昏沉，視覺模糊。", "c": ["身體感官類"]}, {"i": "頭頭是道", "d": "形容言語清楚明白，有條理。", "c": ["人際溝通表達類"]}, {"i": "額手稱慶", "d": "表示慶賀、高興。", "c": ["身體感官類"]}, {"i": "顛三倒四", "d": "形容混亂沒有條理或神志不清、翻來覆去。", "c": ["人際溝通表達類"]}, {"i": "顧復之恩", "d": "比喻父母養育的恩德。", "c": ["情感心理類"]}, {"i": "顧此失彼", "d": "指做事時不能全面兼顧。", "c": ["文學典故修辭類"]}, {"i": "風光旖旎", "d": "形容景色柔和美好。", "c": ["景物環境類"]}, {"i": "風光明媚", "d": "景色鮮明悅目。", "c": ["景物環境類"]}, {"i": "風塵僕僕", "d": "形容奔波忙碌，旅途勞累。", "c": ["情感心理類"]}, {"i": "風度翩翩", "d": "形容一個人文采風流，舉止瀟灑。", "c": ["人物形象類", "品格修養類"]}, {"i": "風樹之悲", "d": "比喻父母親亡故，兒女不得奉養的悲傷。", "c": ["情感心理類"]}, {"i": "風流倜儻", "d": "英俊瀟灑，不拘禮法。", "c": ["人物形象類"]}, {"i": "風清月皎", "d": "微風清涼，月色皎潔。形容夜色幽美宜人。", "c": ["景物環境類"]}, {"i": "風聲鶴唳", "d": "戰敗逃跑時聽到風聲和鶴鳴，都以為追兵來了。形容驚慌疑懼，自相驚擾。", "c": ["動物類", "身體感官類"]}, {"i": "風調雨順", "d": "風雨及時而適量。比喻豐年安樂，天下太平的景象。", "c": ["天文氣象時間類"]}, {"i": "風雨如晦", "d": "風雨交加，天色昏暗，猶如黑夜。比喻處於險惡環境中也不改變其操守。", "c": ["天文氣象時間類"]}, {"i": "風雨無阻", "d": "颳風下雨也阻擋不住。比喻決心堅定。", "c": ["天文氣象時間類", "處境際遇做事態度類"]}, {"i": "風雨飄搖", "d": "比喻時局動蕩不安，極不穩定。", "c": ["天文氣象時間類"]}, {"i": "風靡一時", "d": "形容某種事物於一時之間極為流行，就像草木順風而倒的樣子。", "c": ["天文氣象時間類"]}, {"i": "風馬牛不相及", "d": "比喻事物之間彼此毫不相干。", "c": ["動物類"]}, {"i": "風馳電掣", "d": "形容速度極快。", "c": ["天文氣象時間類"]}, {"i": "飛蛾撲火", "d": "飛蛾撲到火上。比喻自尋死路、自取滅亡。", "c": ["動物類"]}, {"i": "食不果腹", "d": "吃不飽。形容生活貧窮困苦。", "c": ["植物花木類"]}, {"i": "食前方丈", "d": "吃飯的食物擺滿一丈見方那麼廣。形容生活非常奢侈。", "c": ["生活器物類"]}, {"i": "食玉炊桂", "d": "食物比玉還珍貴，柴薪價錢比桂樹更高。形容物價昂貴，生活艱難。", "c": ["生活器物類"]}, {"i": "食言而肥", "d": "比喻經常說話不守信用。", "c": ["品格修養類"]}, {"i": "食髓知味", "d": "比喻人得到一次好處後便貪得無厭。", "c": ["生活器物類"]}, {"i": "飢不擇食", "d": "比喻急迫時不作選擇、挑剔。", "c": ["生活器物類"]}, {"i": "飯來張口，衣來伸手", "d": "形容人只知吃飯穿衣而不勞動。引喻閒適、懶散的生活。", "c": ["情感心理類"]}, {"i": "飲水食菽", "d": "形容生活清苦，飲食粗簡。", "c": ["生活器物類"]}, {"i": "飲酒作樂", "d": "喝酒享樂。", "c": ["生活器物類"]}, {"i": "飽經風霜", "d": "形容歷經許多艱辛困苦。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "飽食終日", "d": "整天吃得飽飽的，不做任何事。比喻無所事事。", "c": ["情感心理類"]}, {"i": "養生送死", "d": "指子女對父母生前的奉養和死後的殯葬。", "c": ["情感心理類"]}, {"i": "餘音繞梁", "d": "形容歌聲或音樂美妙感人，餘味不絕。", "c": ["身體感官類"]}, {"i": "饞涎欲滴", "d": "形容貪食的樣子。", "c": ["其他"]}, {"i": "首屈一指", "d": "用以表示第一或最優秀。", "c": ["處境際遇做事態度類", "身體感官類"]}, {"i": "首鼠兩端", "d": "形容猶豫不決的樣子。", "c": ["文學典故修辭類"]}, {"i": "馬不停蹄", "d": "形容忙碌不休。", "c": ["處境際遇做事態度類"]}, {"i": "馬馬虎虎", "d": "勉強將就，敷衍了事。", "c": ["處境際遇做事態度類"]}, {"i": "馳名中外", "d": "名聲遠播於國內和國外。", "c": ["其他"]}, {"i": "駑馬十駕", "d": "比喻才智平庸的人，若能努力不懈，也能趕得上聰明的人。", "c": ["品格修養類"]}, {"i": "驚天動地", "d": "形容聲勢驚人。", "c": ["文學典故修辭類"]}, {"i": "驚弓之鳥", "d": "比喻曾受打擊或驚嚇，心有餘悸，稍微有動靜就害怕的人。", "c": ["動物類", "戰爭軍事類"]}, {"i": "骨肉至親", "d": "像骨和肉連接在一起的親屬。指有血緣關係的親屬。", "c": ["情感心理類"]}, {"i": "高山景行", "d": "比喻行事光明磊落。後稱頌人德行高尚。", "c": ["品格修養類"]}, {"i": "高抬貴手", "d": "請求寬容饒恕的客套話。", "c": ["身體感官類"]}, {"i": "高樓大廈", "d": "高大堂皇的建築物。", "c": ["景物環境類"]}, {"i": "高臥東山", "d": "晉人謝安隱居東山，不肯出任官職的故事。後比喻隱居不仕。", "c": ["品格修養類"]}, {"i": "高談闊論", "d": "比喻暢快而無拘束地談論。或沒有實質內容，空泛而漫無邊際地談論。", "c": ["人際溝通表達類"]}, {"i": "高蹈遠舉", "d": "隱居避世。", "c": ["品格修養類"]}, {"i": "高風亮節", "d": "形容人的品格高尚，氣節堅貞。", "c": ["品格修養類"]}, {"i": "髮指眥眥裂", "d": "形容極度忿怒。", "c": ["身體感官類"]}, {"i": "鬼使神差拆", "d": "比喻被莫名力量驅使而不由自主。", "c": ["處境際遇做事態度類"]}, {"i": "鬼哭神號", "d": "形容悲慘恐怖的聲音。", "c": ["身體感官類"]}, {"i": "魂牽夢縈", "d": "形容十分掛念、思念的樣子。", "c": ["回憶往事類"]}, {"i": "魏紫姚黃", "d": "宋代洛陽兩種名貴的牡丹品種。魏紫，千葉肉紅花，出於五代魏仁溥家；姚黃，千葉黃花，出於民間姚氏家。後為牡丹的通稱或泛指名貴的花卉。", "c": ["植物花木類"]}, {"i": "魚游釜中", "d": "比喻身處險境，危在旦夕。也作「魚遊釜底」。", "c": ["動物類"]}, {"i": "魚潰鳥散", "d": "如群聚魚鳥般潰散逃離。形容人因受驚擾而紛紛走避奔竄。也作「魚驚鳥散」。", "c": ["動物類"]}, {"i": "魚目混珠", "d": "比喻以假亂真。", "c": ["動物類", "生活器物類"]}, {"i": "魚米之鄉", "d": "近水而盛產魚、米的地帶。泛指物產富庶之地。", "c": ["動物類"]}, {"i": "魚肉鄉民", "d": "比喻恣意欺凌百姓，剝取民膏民脂。", "c": ["動物類"]}, {"i": "魚貫而入", "d": "如游魚首尾相接，一個挨著一個陸續進入。", "c": ["動物類"]}, {"i": "魚躍龍門", "d": "相傳鯉魚躍過龍門之後，即可化身為龍，騰飛升天。後用以比喻登上高位。", "c": ["動物類"]}, {"i": "鯉魚跳龍門", "d": "比喻人發跡後飛黃騰達，身價百倍。", "c": ["動物類"]}, {"i": "鱗次櫛比", "d": "像魚鱗和梳齒那樣相次排列。形容建築物排列的密集。", "c": ["景物環境類"]}, {"i": "鳥之將死，其鳴也哀", "d": "鳥將死亡，其鳴聲是十分悲傷淒涼的。比喻人若將死亡，則所說的話是良善而有價值的。", "c": ["動物類"]}, {"i": "鳥散魚潰", "d": "比喻人紛亂逃離，如魚、鳥般潰散。", "c": ["動物類"]}, {"i": "鳥盡弓藏", "d": "飛鳥射盡之後，就將弓箭收藏起來。比喻事成之後，有功之人卻遭到殺戮或疏遠的命運。", "c": ["動物類", "戰爭軍事類"]}, {"i": "鳥語花香", "d": "鳥兒唱歌，花朵飄香。形容景色的美好。", "c": ["動物類", "身體感官類"]}, {"i": "鴉雀無聲", "d": "形容非常寂靜。", "c": ["身體感官類"]}, {"i": "鶴立雞群", "d": "鶴站在雞群之中，非常凸出。比喻人的儀表才能超群脫俗。", "c": ["動物類", "品格修養類"]}, {"i": "鶴長鳧短", "d": "鶴的腿長，鳧的腿短。比喻凡事應順其自然，不宜隨意損益、改變。鳧，音ㄈㄨˊ。", "c": ["動物類"]}, {"i": "鶴骨松姿", "d": "形容人身體清瘦，外表、氣質有仙風道骨之貌。", "c": ["動物類"]}, {"i": "鶼鰈情深", "d": "比喻夫婦愛情深厚，相處融洽。", "c": ["情感心理類"]}, {"i": "鸚鵡學舌", "d": "比喻人云亦云，搬嘴弄舌。", "c": ["學習教育類"]}, {"i": "鸚鵡能言，不離飛鳥", "d": "比喻人很難改變他原始的身分。", "c": ["動物類"]}, {"i": "鸞鳳和鳴", "d": "比喻夫妻倆感情和諧。", "c": ["情感心理類"]}, {"i": "黃口小兒", "d": "幼兒。比喻淺薄幼稚的人。", "c": ["人物形象類"]}, {"i": "黃昏時分", "d": "太陽將落的時候。", "c": ["天文氣象時間類"]}, {"i": "黃粱一夢", "d": "比喻榮華富貴如夢一般，短促而虛幻。亦比喻欲望落空。", "c": ["顏色類"]}, {"i": "黃花閨女", "d": "稱未出嫁的少女。", "c": ["植物花木類"]}, {"i": "黃道吉日", "d": "泛指適宜辦事的好日子。", "c": ["顏色類"]}, {"i": "黃鐘大呂", "d": "形容音樂或文辭正大、莊嚴而高妙。", "c": ["生活器物類"]}, {"i": "黃鐘毀棄", "d": "比喻賢才不被重用。", "c": ["生活器物類"]}, {"i": "黑白分明", "d": "(1)黑色、白色區分明顯。(2)比喻是非善惡分明。", "c": ["顏色類"]}, {"i": "黔驢技窮", "d": "比喻人拙劣的技能已經用完，再也無計可施了。典出柳宗元三戒。黔，音ㄑㄧㄢˊ。", "c": ["文學典故修辭類"]}, {"i": "默默無聞", "d": "平凡、沒有名氣。", "c": ["其他"]}, {"i": "鼓樂喧天", "d": "形容奏樂的聲音非常響亮熱鬧。", "c": ["生活器物類"]}, {"i": "鼓舌如簧", "d": "形容能說善道或連續說話不停止。", "c": ["身體感官類"]}, {"i": "齒頰生香", "d": "比喻美好的詩文意味深長，令人讀後津津有味。", "c": ["身體感官類"]}, {"i": "齒頰留香", "d": "形容食物味道鮮美，令人回味無窮。", "c": ["身體感官類"]}, {"i": "龜年鶴壽", "d": "龜、鶴均為長壽的動物。比喻人長壽。", "c": ["動物類"]}];
var EXAM_BANK = [{"id": "exam1", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "傷痕累累／遍體鱗傷", "B": "兩敗俱傷／玉石俱焚", "C": "傷風敗俗／高風亮節", "D": "救死扶傷／懸壺濟世"}, "answer": "C", "explanation": "（1.(A)相似。傷痕累累：受傷後所留下的痕跡很多／遍體鱗傷：滿身都是傷痕(B)相似。兩敗俱傷：雙方互相爭鬥，同受損害／玉石俱焚：指不論賢愚、善惡、好壞，同時受害，盡皆毀滅(D)相似。救死扶傷：搶救垂死的人，照顧傷患／懸壺濟世：行醫救人(C)相反。傷風敗俗：敗壞社會風俗習慣／高風亮節：形容人的品格高尚，氣節堅貞）", "categories": ["其他", "品格修養類", "文學典故修辭類", "生活器物類"]}, {"id": "exam2", "stem": "「敵人侵略我國，我們當然要奮起抵抗，豈能□□□□？」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "坐吃山空", "B": "坐以待斃", "C": "困獸猶鬥", "D": "困心衡慮"}, "answer": "B", "explanation": "（2.(A)比喻只消費而不事生產，以致把家產吃盡用光(B)形容面臨危難，不積極奮發，坐等失敗。與文意相符，故選。(C)比喻人在絕境中仍奮力抵抗，不肯降服(D)比喻處心積慮，費盡心思）", "categories": ["情感心理類", "處境際遇做事態度類"]}, {"id": "exam3", "stem": "下列選項「」中成語何者應用最正確？", "options": {"A": "他絕不會「白吃白喝」的送禮，一定是有事相求", "B": "你吃飯付錢是天經地義，難道還想「平白無故」？", "C": "用心經營就是夫妻間能「白髮紅顏」的主要原因", "D": "人生如「白駒過隙」，當及時把握而不浪費光陰"}, "answer": "D", "explanation": "（3.(A)吃喝食品不給錢。這裡宜用「平白無故」(B)無緣無故。這裡宜用「白吃白喝」(C)形容老人容光煥發的樣子或指年歲差距很大的夫妻。這裡宜用「白頭偕老」(D)比喻時間過得很快）", "categories": ["天文氣象時間類", "顏色類"]}, {"id": "exam4", "stem": "「開國先烈的□□□□，將永遠令人緬懷。」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "金玉滿堂", "B": "敝帚千金", "C": "豐功偉業", "D": "豐功厚利"}, "answer": "C", "explanation": "（4.(A)形容極為富有(B)比喻東西雖不值錢，卻因為是自己的，仍覺得很珍貴(C)偉大的功績、事業。符合文意，故選。(D)功績大，所得到的利益也多）", "categories": []}, {"id": "exam5", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "恍如隔世／滄海桑田", "B": "恍然大悟／豁然開朗", "C": "毛骨悚然／不寒而慄", "D": "幡然悔悟／執迷不悟"}, "answer": "D", "explanation": "（5.(A)相似。恍如隔世：形容人事、景物變遷，彷彿隔了一個世代／滄海桑田：比喻世事無常，變化很快(B)相似。恍然大悟：心裡忽然明白／豁然開朗：形容領悟了解(C)相似。毛骨悚然：形容極端驚懼害怕／不寒而慄：形容內心恐懼至極(D)相反。幡然悔悟：澈底的悔改、醒悟／執迷不悟：堅持錯誤的觀念而不醒悟）", "categories": ["情感心理類", "植物花木類"]}, {"id": "exam6", "stem": "「喜上眉梢」與「眉飛色舞」的關係就如同「迫在眉睫」與下列何者的關係？", "options": {"A": "目不交睫", "B": "目不見睫", "C": "當務之急", "D": "從容不迫"}, "answer": "C", "explanation": "（6.「喜上眉梢」與「眉飛色舞」屬於相似關係，「迫在眉睫」與「當務之急」也是相似關係，故選(C)。(A)比喻心情不安不能入眠或工作緊張勞碌。與題幹無明顯關係(B)比喻人無自知之明，不能看見自己的過失。與題幹無明顯關係(D)沉著鎮定不慌張。與題幹為相反關係）", "categories": ["情感心理類", "文學典故修辭類"]}, {"id": "exam7", "stem": "「早知是為人作嫁，就不必如此□□□□的到處張羅了！」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "大費周章", "B": "大材小用", "C": "大驚小怪", "D": "大智若愚"}, "answer": "A", "explanation": "（7.(A)事情麻煩瑣碎，必須耗費許多時間和精力來處理。符合文意，故選。(B)把大材料用在小地方。比喻才能的浪費或人事安排不當(C)形容為一些不足為奇的小事而過分聲張、驚怪(D)具有極高智慧的人往往表面上看起來似乎很平庸）", "categories": []}, {"id": "exam8", "stem": "「牽腸掛肚」與「魂牽夢縈」的關係就如同「肝腸寸斷」與下列何者的關係？", "options": {"A": "如喪考妣", "B": "心花怒放", "C": "滿面春風", "D": "躊躇滿志"}, "answer": "A", "explanation": "（8.「牽腸掛肚」與「魂牽夢縈」屬於相似關係，「肝腸寸斷」與「如喪考妣」也是相似關係，故選(A)好像死了父母一般。比喻悲痛至極(B)形容心情像盛開的花朵般舒暢快活(C)形容滿臉笑容，心情喜悅(D)自得的樣子）", "categories": ["回憶往事類", "天文氣象時間類", "情感心理類", "文學典故修辭類"]}, {"id": "exam9", "stem": "「他對自己受到不公正的待遇而□□□□。」根據文意脈絡，缺空處最不適宜填入下列何者？", "options": {"A": "忿忿不平", "B": "勃然變色", "C": "大發雷霆", "D": "沾沾自喜"}, "answer": "D", "explanation": "（9.(A)因非常不滿而憤怒(B)形容人因發怒生氣而臉色大變(C)大發脾氣。比喻非常生氣(D)形容自得自滿的樣子。不符文意，故選）", "categories": ["天文氣象時間類", "情感心理類"]}, {"id": "exam10", "stem": "下列哪種情形最適合用「百感交集」來形容？", "options": {"A": "考運極佳的小芳，沒什麼準備卻拔得頭籌", "B": "多年後與同學相聚，大家與當初不盡相同", "C": "年幼就失去父母，如今又遭逢車禍的小華", "D": "主播非常專業地報導這起擄人勒贖的案子"}, "answer": "B", "explanation": "（10.百感交集：各種感受混雜在一起。比喻思緒混亂，感情複雜(A)應為喜悅的情緒(C)應為悲傷的情緒(D)應偏向不具個人感情）", "categories": ["情感心理類"]}, {"id": "exam11", "stem": "「我現在□□□□，一時之間無法做出決定。」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "心如刀割", "B": "心亂如麻", "C": "心心相印", "D": "心有靈犀"}, "answer": "B", "explanation": "（11.(A)內心痛苦像被刀割一樣(B)心緒紛雜如亂麻般毫無頭緒(C)比喻彼此心意互通(D)比喻情意相通，意念相契合）", "categories": []}, {"id": "exam12", "stem": "「火冒三丈」與下列何者的涵義最接近？", "options": {"A": "火傘高張", "B": "砲火連天", "C": "滿腔怒火", "D": "火上加油"}, "answer": "C", "explanation": "（12.(A)比喻烈日當空(B)戰場上炮彈火焰充滿著天空，形容戰爭的激烈(C)與題幹皆形容非常生氣，故選。(D)比喻使事態更加擴張或惡化）", "categories": ["天文氣象時間類", "生活器物類"]}, {"id": "exam13", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "心不在焉／心有鴻鵠", "B": "心猿意馬／專心致志", "C": "別具匠心／拾人牙慧", "D": "漫不經心／刻骨銘心"}, "answer": "A", "explanation": "（13.(A)相似。心不在焉：心思心神不集中／心有鴻鵠：形容學習、工作不專心(B)相反。心猿意馬：形容心意不定，不能自持／專心致志：專一心思，貫徹意志(C)相反。別具匠心：另有一種巧妙的心思。多指文學、藝術、技藝等方面創造性的構思／拾人牙慧：比喻蹈襲他人的言論或主張(D)相反。漫不經心：毫不留意／刻骨銘心：形容感激在心，永難忘懷）", "categories": ["回憶往事類", "處境際遇做事態度類"]}, {"id": "exam14", "stem": "下列選項「」中成語何者應用最恰當？", "options": {"A": "我們如果因為一點成就就「得不償失」，終究難成大器", "B": "現代人常為了追求名利而忽略健康，實在是「得意忘形」", "C": "臺灣的地理位置「得天獨厚」，擁有著豐富的海洋資源", "D": "他向來「得隴望蜀」，做一天和尚撞一天鐘，難堪重任"}, "answer": "C", "explanation": "（14.(A)做事所付出的功夫太多，而得到的成果太少。宜用「得意忘形」(B)形容人高興得忘其所以，舉止失去了常態。宜用「得不償失」(C)多用於形容人的天賦、社會條件，或是地方的自然環境特別優越(D)比喻貪得無厭，不知滿足。宜用「得過且過」）", "categories": ["天文氣象時間類"]}, {"id": "exam15", "stem": "「他雖然出身貧窮家庭，卻能□□□□，終於成為商業鉅子。」根據文意脈絡，缺空處最不適宜填入下列何者？", "options": {"A": "奮發圖強", "B": "自立自強", "C": "力爭上游", "D": "克紹箕裘"}, "answer": "D", "explanation": "15.(A)(B)(C)都有努力求取上進的意思(D)比喻能繼承家業。與文意不符，故選）", "categories": ["生活器物類"]}, {"id": "exam16", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "深入淺出／言簡意賅", "B": "高深莫測／胸無城府", "C": "如臨深淵／如履薄冰", "D": "不知深淺／不知輕重"}, "answer": "B", "explanation": "（16.(A)相似。深入淺出：以簡淺易懂的語言文字，表達深刻的道理／言簡意賅：言辭簡練，意思完備(C)相似。如臨深淵：好像走到深水潭的邊上。比喻行事十分小心謹慎／如履薄冰：好像走在薄冰上。比喻處事極為謹慎小心(D)相似。不知深淺：不知道水的深淺，比喻言行不知輕重，沒有分寸／不知輕重：不知事情的輕重，有冒昧的意思。(B)相反。高深莫測：山川高而且深，無法測量。後引申為人或事深沉不可測／胸無城府：比喻為人坦率正直，沒有心機）", "categories": ["人際溝通表達類", "品格修養類", "天文氣象時間類"]}, {"id": "exam17", "stem": "「這一條登山路線非常難走，登頂後大家都已□□□□。」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "筋疲力盡", "B": "盤根錯節", "C": "分筋錯骨", "D": "生龍活虎"}, "answer": "A", "explanation": "（17.(B)比喻事情複雜，不易理解。與文意不符(C)古時一種將人筋骨錯開的刑法。與文意不符(D)比喻活潑勇猛，生氣勃勃。與文意不符）", "categories": ["植物花木類"]}, {"id": "exam18", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "傳宗接代／瓜瓞綿綿", "B": "名不虛傳／名實相符", "C": "言歸正傳／言出題外", "D": "永傳不朽／流芳百世"}, "answer": "C", "explanation": "（18.(A)相似。傳宗接代：子孫世代相繼，綿延不絕／瓜瓞綿綿：比喻子孫繁盛、傳世久遠(B)相似。名不虛傳：名聲與實際相符／名實相符：名稱或名聲與實際一致(D)相似。永傳不朽：永遠流傳而不磨滅／流芳百世：芳名永遠流傳於後世(C)相反。言歸正傳：停止閒話，回歸本題／言出題外：和討論主題無關的言語）", "categories": ["人際溝通表達類"]}, {"id": "exam19", "stem": "下列選項「」中成語，何者應用最不恰當？", "options": {"A": "困境中能「不屈不撓」、堅持到底的人，才會成功", "B": "已向她解釋多次，她還是「不依不饒」，讓人心煩", "C": "原諒我的「不可一世」，竟然聽不懂你的言外之意", "D": "他老是「不修邊幅」，邋邋遢遢，卻自以為是瀟灑"}, "answer": "C", "explanation": "（19.(C)不可一世：形容狂妄自大已達極點。這裡宜用「愚不可及」）", "categories": ["品格修養類", "情感心理類"]}, {"id": "exam20", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "飲水思源／數典忘祖", "B": "兔死狗烹／鳥盡弓藏", "C": "過河拆橋／結草啣環", "D": "一飯千金／忘恩負義"}, "answer": "B", "explanation": "（20.(A)相反。飲水思源：比喻不忘本／數典忘祖：比喻忘本(C)相反。過河拆橋：比喻不念舊情，忘恩負義／結草啣環：比喻報恩(D)相反。一飯千金：比喻報恩隆厚／忘恩負義：受人恩惠而不知報答，反而做出對不起恩人的事情(B)相似。兔死狗烹：比喻事成之後，出過力的人即遭到殺戮或見棄的命運／鳥盡弓藏：比喻天下平定之後便遺棄功臣）", "categories": ["動物類", "戰爭軍事類"]}, {"id": "exam21", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "謙沖自牧／虛懷若谷", "B": "目中無人／剛愎自用", "C": "我行我素／從善如流", "D": "目空一切／夜郎自大"}, "answer": "C", "explanation": "（21.(A)相似。謙沖自牧：為人處事謙和退讓，以修養自我的德性／虛懷若谷：形容為人謙虛，能接納他人的意見(B)相似。目中無人：形容自高自大，瞧不起他人／剛愎自用：性情倔強，固執己見(D)相似。目空一切：自視甚高，一切都瞧不起／夜郎自大：比喻人不自量力，妄自尊大(C)相反。我行我素：形容人不受外界影響，完全依照自己的心意行事／從善如流：比喻樂於接受善意的勸導）", "categories": ["品格修養類", "情感心理類", "文學典故修辭類", "身體感官類"]}, {"id": "exam22", "stem": "下列哪一句的涵義與「推己及人」最相近？", "options": {"A": "己所不欲，勿施於人", "B": "八仙過海，各顯神通", "C": "桃李無言，下自成蹊", "D": "水能載舟，亦能覆舟"}, "answer": "A", "explanation": "（22.題幹與(A)皆強調發揮同理心，(B)比喻為達目的，各自施展本領(C)比喻為人真誠篤實，自然能感召人心(D)比喻事物使用得當則有利，不當則有害）", "categories": []}, {"id": "exam23", "stem": "「這事□□□□，還得算在陸忠義的帳上，正應了一句老話──自食其果。」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "推陳出新", "B": "推本溯源", "C": "推波助瀾", "D": "推心置腹"}, "answer": "B", "explanation": "（23.(A)除去老舊的，創造出新的事物或方法。與文意不符(C)從旁鼓動，使事態擴大。比喻不能消弭事情，反而助長它。與文意不符(D)比喻真心誠意的待人。與文意不符）", "categories": ["學習教育類", "情感心理類"]}, {"id": "exam24", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "目不暇給／琳瑯滿目", "B": "備受矚目／乏人問津", "C": "面目全非／面目一新", "D": "明目張膽／肆無忌憚"}, "answer": "B", "explanation": "（24.(A)相似。目不暇給：形容眼前美好事物太多，或景物變化太快，眼睛來不及觀看／琳瑯滿目：形容滿眼所見都是珍美的東西(C)相似。面目全非：完全不是原先的樣子。形容變化很大／面目一新：改變原樣，呈現新貌(D)相似。明目張膽：張大眼、壯著膽，肆無忌憚的公然做壞事／肆無忌憚：恣意妄為，毫無顧忌(B)相反。備受矚目：受到非常的關照注意／乏人問津：沒有人洽問或探詢）", "categories": ["其他", "身體感官類"]}, {"id": "exam25", "stem": "「她期許自己能夠□□□□，因此想要成為一名醫師。」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "春風化雨", "B": "濟世救人", "C": "明察秋毫", "D": "龍騰虎躍"}, "answer": "B", "explanation": "（25.(A)宜用於教師(C)宜用於法官(D)宜用於運動員）", "categories": ["天文氣象時間類", "學習教育類", "身體感官類"]}, {"id": "exam26", "stem": "「這本書初讀時索然無味，到第三遍時則□□□□，於我心有戚戚焉。」依據文意脈絡，文中缺空處最適宜填入下列何者？", "options": {"A": "戮力同心", "B": "膽戰心驚", "C": "沁人心脾", "D": "殫心竭慮"}, "answer": "C", "explanation": "（1.(C)形容令人感受深刻，符合文意，故選。(A)齊心合力，團結一致(B)形容十分害怕(D)竭盡精力與思慮）", "categories": []}, {"id": "exam27", "stem": "「黯然失色」與「光彩奪目」之間的關係，就像「開門見山」和下列何者的關係？", "options": {"A": "迂迴曲折", "B": "直截了當", "C": "山窮水盡", "D": "皮開肉綻"}, "answer": "A", "explanation": "（2.「黯然失色」與「光彩奪目」屬於相反關係，「開門見山」與「迂迴曲折」也是相反關係，故選(A)彎彎曲曲，回旋環繞的樣子。(B)形容說話或做事乾淨俐落，毫不拐彎抹角(C)比喻陷於絕境，窮困之至(D)形容皮肉裂開的樣子）", "categories": ["其他"]}, {"id": "exam28", "stem": "「今年的畢業生都分配到了能發揮各自專長的工作，真是□□□□。」依據文意脈絡，文中缺空處較不適宜填入下列何者？", "options": {"A": "青雲直上", "B": "如魚得水", "C": "鳶飛戾天", "D": "得其所哉"}, "answer": "A", "explanation": "（3.(B)(C)(D)皆有得到合適的環境而得意自在的意思(A)比喻順利的迅速升到高位。而找到能發揮專長的工作不等於就一定升到高位，與文意較不符，故選）", "categories": ["動物類", "文學典故修辭類"]}, {"id": "exam29", "stem": "下列選項中前後成語和諺語的意思搭配，何者正確？", "options": {"A": "少不更事→吃一塹，長一智", "B": "童叟無欺→掛羊頭，賣狗肉", "C": "勤能補拙→一不做，二不休", "D": "一絲不苟→丁是丁，卯是卯"}, "answer": "D", "explanation": "（4.(A)年紀輕，閱歷淺薄／指受一次挫折，得到一次教訓，就增長一分才智(B)對待小孩和老人的態度一樣，不會欺瞞／比喻表裡不一，欺騙矇混(C)勤奮努力可以彌補天資的不足／既然已經做了，就索性做到底(D)都指做事一點都不馬虎，故選）", "categories": ["文學典故修辭類", "生活器物類", "處境際遇做事態度類"]}, {"id": "exam30", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "大排長龍／乏人問津", "B": "生機勃勃／生意盎然", "C": "名聞遐邇／遠近馳名", "D": "離情依依／依依不捨"}, "answer": "A", "explanation": "（5.(A)相反。大排長龍：形容隊伍排得很長／乏人問津：沒有人洽問或探詢(B)相似。生機勃勃：形容充滿生氣活力，生命力旺盛／生意盎然：形容充滿生機，生命力旺盛(C)相似。名聞遐邇：遠近馳名／遠近馳名：名聲流傳極廣，遠近的人都知道(D)相似。離情依依：形容離別時難分難捨的情景／依依不捨：非常留戀，捨不得分離）", "categories": ["其他", "品格修養類"]}, {"id": "exam31", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "臨陣磨槍／臨渴掘井", "B": "臨風顧盼／躊躇滿志", "C": "未雨綢繆／江心補漏", "D": "曲突徙薪／防患未然"}, "answer": "C", "explanation": "（6.(A)相似。臨陣磨槍：意謂事態急迫，匆忙應變／臨渴掘井：比喻事到臨頭才著手準備，為時已晚(B)相似。臨風顧盼：形容志得意滿，神采飛揚的模樣／躊躇滿志：自得的樣子(D)相似。曲突徙薪：比喻事先採取措施，以防患未然／防患未然：在禍患沒有發生之前就加以防備(C)相反。未雨綢繆：比喻事先預備，防患未然／江心補漏：比喻事有缺失不先預防，臨時才補救，但為時已晚）", "categories": ["天文氣象時間類"]}, {"id": "exam32", "stem": "下列選項「」中成語，何者應用正確？", "options": {"A": "他對品行修養的期許極高，望自己達到如「白玉微瑕」般的境界", "B": "此次聯展，布置上雖有小缺點，然而「瑕不掩瑜」，仍廣受讚譽", "C": "我的提議只是想「堆金積玉」，更周詳的辦法還請大家一起討論", "D": "您這番「金科玉律」，實在讓我受益匪淺，我將終生都銘記在心"}, "answer": "B", "explanation": "（7.(A)白玉微瑕：白色璧玉上有微小斑點。比喻很好的人或事還有小缺點，美中不足。宜作「白璧無瑕」(C)堆金積玉：金玉積聚成堆。形容非常富有。宜作「拋磚引玉」(D)金科玉律：形容完善嚴密的法律條文。後比喻不可變更的信條。宜作「金玉良言」）", "categories": []}, {"id": "exam33", "stem": "下列選項中前後成語和諺語的意思搭配，何者正確？", "options": {"A": "刨根究底→打破砂鍋問到底", "B": "與眾不同→天下烏鴉一般黑", "C": "天衣無縫→此地無銀三百兩", "D": "得過且過→得饒人處且饒人"}, "answer": "A", "explanation": "（8.(A)都指比喻對事情尋根究柢(B)獨樹一幟，不與常人相同／比喻同類的人或事物都有相同的特性。多用於貶意(C)比喻做事精巧，無隙可尋／比喻想掩飾事實，反而暴露(D)勉強能維持生計，或形容苟且偷安，不求上進／做事不要太過分，對人要存有恕道、留有餘地）", "categories": ["天文氣象時間類"]}, {"id": "exam34", "stem": "「百尺竿頭，更進一步」與下列何者的意思最接近？", "options": {"A": "慾壑難填", "B": "得寸進尺", "C": "精益求精", "D": "一步登天"}, "answer": "C", "explanation": "（9.(C)與題幹皆是力求技能進步再進步，故選。(A)形容貪慾如同深谷一樣，永遠難以滿足(B)得到一些利益，即想進而獲得更多利益。比喻貪得無厭(D)比喻突然達到極高的地位或境界）", "categories": ["文學典故修辭類"]}, {"id": "exam35", "stem": "「絕無僅有」與「寥若晨星」之間的關係，就像「嘆為觀止」和下列何者的關係？", "options": {"A": "望洋興嘆", "B": "短嘆長吁", "C": "咳聲嘆氣", "D": "仰屋興嘆"}, "answer": "A", "explanation": "10.題幹為相似關係，嘆為觀止與(A)比喻因眼界大開而驚奇讚嘆。也同為相似關係，故選。(B)(C)不斷嘆氣。形容非常憂傷愁悶(D)形容人無計可施的情狀）", "categories": ["人際溝通表達類", "文學典故修辭類"]}, {"id": "exam36", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "滔滔不絕／口若懸河", "B": "三緘其口／侃侃而談", "C": "舌粲蓮花／期期艾艾", "D": "瞠目結舌／泰然自若"}, "answer": "A", "explanation": "（11.(A)相似。滔滔不絕：形容說話連續而不間斷／口若懸河：言語滔滔不絕，如瀑布流瀉不止。形容能言善辯(B)相反。三緘其口：言語謹慎或不說話／侃侃而談：說話從容不迫的樣子(C)相反。舌粲蓮花：形容口才好／期期艾艾：形容口吃(D)相反。瞠目結舌：形容吃驚、受窘的樣子／泰然自若：形容遇到緊急或危難的情況時，仍能沉著鎮定而不驚惶失措）", "categories": ["人際溝通表達類", "其他", "情感心理類", "文學典故修辭類", "植物花木類", "身體感官類"]}, {"id": "exam37", "stem": "「歷代文人墨客多對梅花□□□□，詠歎不已。」依據文意脈絡，文中缺空處最適宜填入下列何者？", "options": {"A": "貌合情離", "B": "情有獨鍾", "C": "流水無情", "D": "鶼鰈情深"}, "answer": "B", "explanation": "12.(B)特別鍾愛某一事物。符合文意，故選。(A)表面上彼此相處得很好，而實際上感情不融洽(C)比喻人對對方沒有情意(D)比喻夫婦愛情深厚，相處融洽）", "categories": ["情感心理類"]}, {"id": "exam38", "stem": "「他的一番話，有如□□□□，使我大澈大悟。」依據文意脈絡，文中缺空處較不適宜填入下列何者？", "options": {"A": "暮鼓晨鐘", "B": "當頭棒喝", "C": "醍醐灌頂", "D": "天花亂墜"}, "answer": "D", "explanation": "（13.(A)(B)(C)皆指使人覺悟的言論(D)多指誇大而不切實際）", "categories": ["人際溝通表達類", "植物花木類", "生活器物類"]}, {"id": "exam39", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "搖搖欲墜／岌岌可危", "B": "風雨飄搖／國泰民安", "C": "大搖大擺／躡手躡腳", "D": "招搖過市／韜光養晦"}, "answer": "A", "explanation": "（14.(A)相似。搖搖欲墜：搖搖晃晃得快要倒下來。形容岌岌可危，甚不穩固／岌岌可危：形容非常危險(B)相反。風雨飄搖：本指樹上的鳥窩在風雨中飄蕩／國泰民安：國家太平，人民安樂(C)相反。大搖大擺：態度坦然的樣子／躡手躡腳：放輕手腳走路，行動小心翼翼，不敢聲張的樣子(D)相反。招搖過市：指故意在人多的地方誇耀自己，以引人注意／韜光養晦：比喻隱藏才能，不使外露）", "categories": ["天文氣象時間類"]}, {"id": "exam40", "stem": "下列選項「」中成語，何者應用正確？", "options": {"A": "遇到險阻就「望而卻步」的人，是很難有所成就的", "B": "讀書切忌「忘恩負義」，否則很容易扭解作者原意", "C": "看到他的成就，我只能「望其項背」，自嘆不如了", "D": "你今天能有這份工作理當知足，不該再「冠蓋相望」"}, "answer": "A", "explanation": "15.(B)受人恩惠而不知報答，反而做出對不起恩人的事情。宜作「望文生義」(C)意謂程度與之接近。宜作「望塵莫及」(D)比喻使者往來不絕。宜作「得隴望蜀」）", "categories": []}, {"id": "exam41", "stem": "下列選項敘述的情形何者最適合用「借花獻佛」來形容？", "options": {"A": "小明將自己相愛的玩具送給即將搬家的同學", "B": "外公將得來的禮盒順手送給下一位來的賓客", "C": "曉華向同學借手機多天，卻霸占著不願歸還", "D": "小豪將向老師借來的書本，原封不動地歸還"}, "answer": "B", "explanation": "（16.借花獻佛：比喻借用他人的東西來作人情。故選(B)）", "categories": ["植物花木類"]}, {"id": "exam42", "stem": "下列哪個成語的涵義與「出神入化」相差最遠？", "options": {"A": "爐火純青", "B": "巧奪天工", "C": "鬼斧神工", "D": "弄巧成拙"}, "answer": "D", "explanation": "17.(A)(B)(C)都有技藝精巧之意(D)本想取巧，卻反而敗事。有枉費心機的意思）", "categories": ["天文氣象時間類", "顏色類"]}, {"id": "exam43", "stem": "下列敘述的情形何者最適合用「如虎添翼」來形容？", "options": {"A": "歷屆來都是常勝軍的快樂國中，因多了名好手加入更是所向披靡", "B": "這群烏合之眾因為英明領導者的到來，現在的成績早已今非昔比", "C": "大隊接力競賽中，本來就落後很多的黃隊，竟又有成員不幸摔倒", "D": "小芳成績優異，向來都是全校排名第一，這次竟連百名榜都沒有"}, "answer": "A", "explanation": "18.如虎添翼：比喻強有力者又增添生力軍，使之更強，故選(A)。(B)烏合之眾：比喻暫時湊合，無組織、無紀律的一群人。並非強者）", "categories": ["回憶往事類", "戰爭軍事類", "文學典故修辭類"]}, {"id": "exam44", "stem": "「他在試鏡會中□□□□，得到了演出這個角色的機會。」依據文意脈絡，文中缺空處最適宜填入下列何者？", "options": {"A": "脫胎換骨", "B": "金蟬脫殼", "C": "脫穎而出", "D": "脫韁之馬"}, "answer": "C", "explanation": "19.(C)比喻有才華的人得到機會而嶄露頭角，與文意相符，故選。(A)比喻澈底改變(B)比喻用計謀脫身(D)比喻不受拘束的人或失去控制的事物）", "categories": ["動物類", "戰爭軍事類"]}, {"id": "exam45", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "物換星移／滄海桑田", "B": "披星戴月／櫛風沐雨", "C": "電掣星馳／蝸行牛步", "D": "急如星火／千鈞一髮"}, "answer": "C", "explanation": "（20.(A)相似。物換星移：比喻時序景物的變遷，世事的更替／滄海桑田：比喻世事無常，變化很快(B)相似。披星戴月：形容早出晚歸，旅途勞累／櫛風沐雨：比喻在外奔走，極為辛勞(D)相似。急如星火：形容情勢十分緊急／千鈞一髮：比喻非常危險(C)相反。電掣星馳：比喻快速／蝸行牛步：比喻緩慢行走）", "categories": ["天文氣象時間類", "文學典故修辭類", "植物花木類", "處境際遇做事態度類"]}, {"id": "exam46", "stem": "「百花盛開」與「春暖花開」之間的關係，就像「應有盡有」和下列何者的關係？", "options": {"A": "一呼百諾", "B": "一應俱全", "C": "冰山一角", "D": "九牛一毛"}, "answer": "B", "explanation": "（21.題幹為相似關係，應有盡有與(B)應有的一切都很齊全，相似，故選。(A)一人呼喚，百人應和。形容權勢顯赫，隨從盛多(C)嚴重的問題呈現在表面的一小部分(D)比喻多數中的極少部分，對大體沒有什麼影響）", "categories": ["動物類", "天文氣象時間類", "植物花木類"]}, {"id": "exam47", "stem": "「老闆給他加薪，他□□□□地趕回家告訴妻子。」依據文意脈絡，文中缺空處最適宜填入下列何者？", "options": {"A": "樂不可支", "B": "逢場作樂", "C": "樂不思蜀", "D": "樂不可言"}, "answer": "A", "explanation": "（22.(B)隨事應景，偶爾涉足遊戲人間的事(C)後比喻樂而忘返或樂而忘本，與後文「回家」文意衝突(D)快樂到了極點，無法用語言來形容，與後文「告訴妻子」文意衝突）", "categories": ["文學典故修辭類"]}, {"id": "exam48", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "不勞而獲／守株待兔", "B": "徒勞無功／為人作嫁", "C": "勤能補拙／人一己百", "D": "獲益良多／一無所獲"}, "answer": "D", "explanation": "（23.(A)相似。不勞而獲：毫不費力而得到／守株待兔：後比喻拘泥守成，不知變通或妄想不勞而獲(B)相似。徒勞無功：白白浪費精力，沒有任何效益／為人作嫁：比喻徒然為他人辛苦(C)相似。勤能補拙：勤奮努力可以彌補天資的不足／人一己百：別人用一分力量就能學成的事情，自己要用百倍的力量去學才能成功(D)相反。獲益良多：受益甚多／一無所獲：沒有得到任何收穫）", "categories": ["文學典故修辭類"]}, {"id": "exam49", "stem": "下列選項「」中成語何者應用最恰當？", "options": {"A": "在我們的校友之中，有許多「師出無名」的科學家", "B": "她以香菇外型設計燈飾，「別出心裁」，深獲好評", "C": "他看起來文質彬彬，竟是殺人犯，實在「出類拔萃」", "D": "他每天努力練琴，希望有一天在音樂界「出人意表」"}, "answer": "B", "explanation": "24.(A)沒有正當的理由出兵打仗。亦可引喻為做事缺乏正當理由。宜用「出類拔萃」(C)形容才能特出，超越眾人。宜用「出人意表」(D)出乎意料之外。宜用「出人頭地」）", "categories": ["人物形象類", "文學典故修辭類"]}, {"id": "exam50", "stem": "下列選項「」中成語何者應用最恰當？", "options": {"A": "聞君一席話，茅塞頓開，令我佩服得「五內如焚」", "B": "對於他這次無私的熱情贊助，我實在「學富五車」", "C": "時下手機種類真是「五花八門」，看得人眼花撩亂", "D": "學校已經「三綱五常」禁止學生到那條小溪游泳了"}, "answer": "C", "explanation": "（25.(A)形容非常焦慮。宜作「五體投地」(B)形容人書讀很多，學問淵博。宜作「銘感五內」(D)泛指一切的人倫大道。宜作「三令五申」）", "categories": ["學習教育類", "文學典故修辭類", "植物花木類"]}, {"id": "exam51", "stem": "「她每次講鬼故事都□□□□，讓人容易信以為真。」文中缺空處最不適宜填入下列何者？", "options": {"A": "繪聲繪影", "B": "活靈活現", "C": "信口雌黃", "D": "唯妙唯肖"}, "answer": "C", "explanation": "1.(A)(B)(D)皆有生動的意思(C)比喻不顧事情真相，隨意批評。填入後語意矛盾，故選）", "categories": ["學習教育類", "身體感官類", "顏色類"]}, {"id": "exam52", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "風馳電掣／老牛破車", "B": "捕風捉影／信而有徵", "C": "風平浪靜／驚濤駭浪", "D": "馬耳東風／漠不關心"}, "answer": "D", "explanation": "（2.(A)相反。風馳電掣：比喻快速／老牛破車：比喻做事慢吞吞，沒效率(B)相反。捕風捉影：比喻所做之事或所說的話毫無根據，憑空揣測／信而有徵：確實而有證據(C)相反。風平浪靜：比喻平靜或情勢穩定／驚濤駭浪：猛烈的風浪(D)相似。馬耳東風：比喻對事情漠不關心／漠不關心：冷冷淡淡，毫不關心）", "categories": ["天文氣象時間類"]}, {"id": "exam53", "stem": "下列選項「」中的成語何者應用最恰當？", "options": {"A": "愈是艱苦的環境，我們愈該莊敬自強，「瞬息萬變」", "B": "我沒見過如此冥頑不靈，完全不知「變本加厲」的人", "C": "他這些驚人的壯舉，足以使「風雲變色」，日月無光", "D": "服刑後，他不知收斂，反而「達權通變」，更加猖狂"}, "answer": "C", "explanation": "（3.(A)瞬息萬變：形容在極短的時間內變化迅速。宜用「處變不驚」(B)變本加厲：改變原有的狀況而更加嚴重。宜用「通權達變」(C)比喻勢力極盛大，可以使風雲為之改變顏色(D)通權達變：不墨守成規，視情況應變。宜用「變本加厲」）", "categories": []}, {"id": "exam54", "stem": "下列選項中成語的前後關係，何者與「靈機一動」和「靈光乍現」的關係相同？", "options": {"A": "地靈人傑／鍾靈毓秀", "B": "獨抒性靈／墨守成規", "C": "荼毒生靈／民胞物與", "D": "古靈精怪／土頭土腦"}, "answer": "A", "explanation": "（4.題幹與(A)地靈人傑：指傑出人物，生於靈秀之地／鍾靈毓秀：形容能造育傑出人才的環境。皆是相似關係，故選。(B)相反。獨抒性靈：指文學作品以抒發作者性情為主，不受成法所限，講究真實、自然，以具有獨創性為上／墨守成規：形容思想保守，固守舊規矩不肯改變(C)相反。荼毒生靈：殘害人民／民胞物與：比喻博愛(D)相反。古靈精怪：形容人慧黠而精明／土頭土腦：指人頭腦不靈活，行為表現、服飾穿著等不合時宜）", "categories": []}, {"id": "exam55", "stem": "「你們不要再爭論了，我已經想到一個□□□□的好辦法。」文中缺空處最不適宜填入下列何者？", "options": {"A": "兩全其美", "B": "一箭雙鵰", "C": "一石二鳥", "D": "顧此失彼"}, "answer": "D", "explanation": "（5.(A)(B)(C)都有一種舉動同時兼收兩利的意思(D)注意這個卻忽略了那個。指不能全面兼顧。填入後語意矛盾，故選）", "categories": ["動物類", "文學典故修辭類"]}, {"id": "exam56", "stem": "下列選項中成語的前後關係，何者與其他三者不同", "options": {"A": "大相逕庭／雲泥之別", "B": "異曲同工／殊途同歸", "C": "旗鼓相當／望其項背", "D": "伯仲之間／不分軒輊"}, "answer": "A", "explanation": "？（6.(A)相反。大相逕庭：兩者截然不同，相去甚遠／雲泥之別：比喻高下極為懸殊(B)相似。異曲同工：比喻不同人的辭章或方法，卻有相同的造詣或功效／殊途同歸：比喻採取的方法雖不同，所得的結果卻相同(C)相似。旗鼓相當：比喻雙方勢均力敵／望其項背：望見對方的頸項和背脊，意謂程度與之接近(D)相似。伯仲之間：才能相當，不相上下／不分軒輊：相比較的結果，分不出高下）（7.(A)耳熟能詳：聽得非常熟悉，以致能詳盡", "categories": []}, {"id": "exam57", "stem": "下列選項「」中成語何者應用最恰當？", "options": {"A": "因為母親是音樂家，她從小「耳熟能詳」，所以音樂底子不錯", "B": "「小星星」是一首大家「耳濡目染」的兒歌，幾乎人人都會唱", "C": "在勝者為王的年代，不夠強悍的人，只能「伏首貼耳」地稱臣", "D": "初次來到紐約，看到萬象之都的繁華景象，令人「隔牆有耳」"}, "answer": "C", "explanation": "的說出來。宜用「耳濡目染」(B)耳濡目染：聽熟了，看慣了，因而深受影響。宜用「耳熟能詳」(C)伏首貼耳：形容恭順馴服的樣子(D)隔牆有耳：比喻說祕密時，要防備有人偷聽。宜用「耳目一新）", "categories": ["身體感官類"]}, {"id": "exam58", "stem": "下列選項中成語的前後關係，何者與「騎虎難下」和「進退維谷」的關係相同？", "options": {"A": "為虎作倀／與人為善", "B": "暴虎馮河／有勇無謀", "C": "馬馬虎虎／一絲不苟", "D": "放虎歸山／斬草除根"}, "answer": "B", "explanation": "（8.題幹與(B)暴虎馮河：比喻人做事有勇而無謀／有勇無謀：徒具勇力，缺乏智謀。皆為相似關係，故選。(A)相反。為虎作倀：比喻幫惡人做壞事／與人為善：贊助別人做好事(C)相反。馬馬虎虎：勉強將就，敷衍了事／一絲不苟：形容做事認真，一點也不馬虎(D)相反。放虎歸山：比喻放走敵人，後患無窮／斬草除根：比喻除去禍根，不留後患）", "categories": ["品格修養類", "文學典故修辭類", "處境際遇做事態度類"]}, {"id": "exam59", "stem": "下列選項中的諺語何者與「要怎麼收穫，先怎麼栽。」一句的涵義最相近？", "options": {"A": "人為刀俎，我為魚肉", "B": "人而無信，不知其可", "C": "一分耕耘，一分收穫", "D": "三天打魚，兩天曬網"}, "answer": "C", "explanation": "（9.(A)比喻別人掌握生殺大權，自己處在被宰割的地位(B)一個人如果不講信用，真不知那怎麼能行(D)比喻學習或做事缺乏恆心，時常中斷，不能堅持下去(C)與題幹皆是強調有付出才有收穫的意思，故選）", "categories": ["動物類"]}, {"id": "exam60", "stem": "「當局者迷，旁觀者清。」一句說明的道理與下列何者最相近？", "options": {"A": "不識廬山真面目，只緣身在此山中", "B": "向來枉費推移力，此日中流自在行", "C": "紙上得來終覺淺，絕知此事要躬行", "D": "試玉要燒三日滿，辨材須待七年期"}, "answer": "A", "explanation": "（10.(A)與題幹皆說明當事人往往看不清楚事情的真相(B)借助相關條件之力，以往很難的事情也會變得簡單(C)強調行動的重要(D)說明時間是檢驗真偽的最好方法）", "categories": []}, {"id": "exam61", "stem": "下列選項中成語的前後關係，何者與「胸有成竹」和「心中有數」的關係相同？", "options": {"A": "頓足捶胸／喜極而泣", "B": "罄竹難書／擢髮難數", "C": "竹馬之友／點頭之交", "D": "勢如破竹／望風披靡"}, "answer": "B", "explanation": "（11.題幹與(B)罄竹難書：比喻罪狀之多，難以寫盡／擢髮難數：形容多得難以計數。皆是相似關係，故選。(A)相反。頓足捶胸：形容悲痛或憤怒到了極點／喜極而泣：高興到了極點，反而落下淚來(C)相反。竹馬之友：比喻幼年時的朋友／點頭之交：交情只止於相見時點頭招呼而已(D)相反。勢如破竹：比喻作戰或工作順利進行，毫無阻礙／望風披靡：形容為強大的氣勢所壓倒，或為敵人氣勢所震懾，未作戰就潰敗了）", "categories": ["情感心理類", "戰爭軍事類", "植物花木類", "處境際遇做事態度類"]}, {"id": "exam62", "stem": "「當官者怎可因一己私慾而搜刮□□□□、荼炭生靈？」文中缺空處最適宜填入下列何者？", "options": {"A": "民康物阜", "B": "民淳俗厚", "C": "民脂民膏", "D": "民生塗炭"}, "answer": "D", "explanation": "13.下列選項「」中成語，何者應用最不恰當？(A)這兩件事情互為因果，可說是「息息相關」，密不可分(B)「生生不息」的大自然，永不間斷地進行著生命的輪迴(C)魔術師技藝精湛，所有觀眾都「屏息凝氣」地觀看表演(D)這種「間不容息」，委曲求全的日子，我實在過不下去（12.(A)人民生活安康，物產豐富(B)民風純樸敦厚(C)人民用血汗換來的財富(D)形容人民生活疾苦）（13.(A)比喻關係極為密切或彼此契合無間(B)孳生繁衍而不停止(C)暫時停止呼吸，形容全神貫注或極為小心、緊張的神情(D)極言時間急迫，不容稍有喘息延遲。宜用「仰人鼻息」）", "categories": []}, {"id": "exam63", "stem": "「鍥而舍之，朽木不折；鍥而不捨，金石可鏤。」一句說明下列何者的重要？", "options": {"A": "寸陰尺璧", "B": "專心致志", "C": "持之以恆", "D": "小時了了"}, "answer": "C", "explanation": "（14.題幹強調堅持的重要，故選(C)有恆心的堅持到底。(A)指短暫的光陰比珍寶更加可貴(B)專一心思，集中精神(D)人在幼年時聰慧敏捷。題幹語譯：雕刻時如果輕易就捨棄，那麼即使是腐朽的木頭也無法折斷；如果堅持不放棄，即使要雕刻的是金屬或石頭，最終也能鏤刻成功）", "categories": ["品格修養類", "天文氣象時間類", "文學典故修辭類", "處境際遇做事態度類"]}, {"id": "exam64", "stem": "「行百里者半九十。」一句的涵義與下列何者最相近？", "options": {"A": "半斤八兩", "B": "半推半就", "C": "半途而廢", "D": "半吐半露"}, "answer": "C", "explanation": "（15.題幹與(C)皆指事情沒做成功就停止，故選。(A)比喻彼此分量或程度不相上下(B)心中早已同意，表面上卻不答應，表現出假意推辭的姿態(D)說話吞吞吐吐，不直截了當）", "categories": []}, {"id": "exam65", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "功虧一簣／前功盡棄", "B": "馬到成功／旗開得勝", "C": "大功告成／功敗垂成", "D": "戴罪立功／將功折過"}, "answer": "C", "explanation": "（16.(A)相似。功虧一簣：比喻事情不能堅持到底，只差最後的步驟而功敗垂成／前功盡棄：將以往辛苦建立的功勞，全部廢棄(B)相似。馬到成功：比喻成功迅速而順利／旗開得勝：比喻事情一開始就獲得成功(D)相似。戴罪立功：以有罪過之身去建立功勞，將功折罪／將功折過：用功勞來抵消過錯(C)相反。大功告成：艱鉅、偉大的事務完成了／功敗垂成：事情在即將成功時失敗了）", "categories": ["戰爭軍事類", "生活器物類"]}, {"id": "exam66", "stem": "「日知其所亡，月無忘其所能。」一句強調下列何者的重要？", "options": {"A": "溫故知新", "B": "不恥下問", "C": "孜孜矻矻", "D": "人一己百"}, "answer": "A", "explanation": "（17.題幹語譯：每天都學到些新東西，每月都不忘所學會的東西）", "categories": ["學習教育類", "情感心理類", "文學典故修辭類"]}, {"id": "exam67", "stem": "「每逢例假日，動物園的遊客總是□□□□，好不熱鬧！」依據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "三三兩兩", "B": "門可羅雀", "C": "不絕如縷", "D": "絡繹不絕"}, "answer": "D", "explanation": "18.(A)三個一群，兩個一伙。形容零散結集的樣子。與後文文意矛盾(B)形容賓客稀少。與後文文意矛盾(C)比喻聲音細微悠長，似斷非斷。不適宜用來形容遊客）", "categories": ["其他", "文學典故修辭類"]}, {"id": "exam68", "stem": "「榮華富貴，不過是□□□□，惟有實事求是才是不朽的人生真義。」依據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "過猶不及", "B": "得過且過", "C": "文過飾非", "D": "過眼雲煙"}, "answer": "D", "explanation": "19.(A)做事過分就好比做得不夠一樣，皆不妥當。指事情要適得其中(B)勉強能維持生計，或形容苟且偷安，不求上進(C)粉飾過失、錯誤(D)比喻事物消逝極快，不留痕跡）", "categories": ["回憶往事類", "文學典故修辭類"]}, {"id": "exam69", "stem": "下列選項中成語的前後關係，何者與「熱鐵烙膚」和「刻骨銘心」的關係相同？", "options": {"A": "鐵樹開花／浮雲朝露", "B": "鐵石心腸／優柔寡斷", "C": "磨鐵成針／水滴石穿", "D": "面如鐵色／眉飛色舞"}, "answer": "C", "explanation": "（20.題幹與(C)磨鐵成針：比喻只要有恆心，任何困難的事都可以成功／水滴石穿：比喻持之以恆，事必有成。皆是相似關係，故選。(A)無關係。鐵樹開花：比喻事物罕見或極難實現／浮雲朝露：比喻人生的短促(B)相反。鐵石心腸：比喻意志堅定，不為私情所惑／優柔寡斷：行事猶豫不決，不能當機立斷(D)相反。面如鐵色：比喻人因生氣而臉色鐵青／眉飛色舞：形容非常喜悅得意的神情）", "categories": ["品格修養類", "回憶往事類", "情感心理類", "植物花木類"]}, {"id": "exam70", "stem": "下列選項中成語的前後關係，何者與「歷歷如繪」和「歷歷在目」的關係不同？", "options": {"A": "歷久不衰／歷久彌新", "B": "赴湯蹈火／出生入死", "C": "一成不變／事過境遷", "D": "浮光掠影／走馬看花"}, "answer": "C", "explanation": "（21.題幹為相似關係。(A)相似。歷久不衰：經歷長久的時間卻不衰退／歷久彌新：經過長久的時間，不但沒有衰敗、陳舊，反而更新、更好(B)相似。赴湯蹈火：比喻奮不顧身，不避艱險／出生入死：形容不避艱險，將生死置之度外(D)相似。浮光掠影：比喻見識膚淺空泛，不著邊際／走馬看花：比喻略觀事物外象，而不究其底蘊(C)相反。一成不變：事情既定之後，從不改變／事過境遷：事情過了，環境也已改變）", "categories": ["其他", "回憶往事類", "學習教育類", "身體感官類"]}, {"id": "exam71", "stem": "下列選項「」中的成語，何者應用最恰當？", "options": {"A": "櫥窗內掛滿「不形於色」的服裝，真叫人看了眼花撩亂", "B": "他是個喜怒「形形色色」的人，實在難以猜測他的心思", "C": "自從情傷後，他只想過自由自在、「放浪形骸」的人生", "D": "他的個性孤僻，沒有朋友，常「相形見絀」地獨來獨往"}, "answer": "C", "explanation": "（22.(A)不形於色：內心的感覺不在臉上表現出來。宜用「形形色色」(B)形容各色各樣，種類很多。宜用「不形於色」(C)縱情放任，沒有約束(D)兩相比較之下顯得不如對方。宜用「形單影隻」）", "categories": ["其他", "情感心理類", "文學典故修辭類", "處境際遇做事態度類"]}, {"id": "exam72", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "按部就班／循序漸進", "B": "按圖索驥／無跡可尋", "C": "按兵不動／傾巢而出", "D": "按捺不住／忍辱負重"}, "answer": "A", "explanation": "（23.(A)相似。按部就班：指做事依照一定的層次、條理／循序漸進：按照一定的次序與步驟逐漸推進(B)相反。按圖索驥：按照線索尋找、探求。比喻掌握線索，易於辦事／無跡可尋：做事沒有蹤跡可以尋求。指做事不著痕跡(C)相反。按兵不動：暫時停住軍事行動，有觀望形勢的意思／傾巢而出：比喻全部出動(D)相反。按捺不住：無法抑制、忍耐／忍辱負重：忍受屈辱怨謗而承擔重任）", "categories": ["戰爭軍事類", "文學典故修辭類"]}, {"id": "exam73", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "魂牽夢縈／牽腸掛肚", "B": "魂飛魄散／膽戰心驚", "C": "神魂顛倒／意亂心慌", "D": "魂不守舍／聚精會神"}, "answer": "D", "explanation": "（24.(A)相似。魂牽夢縈：形容十分掛念、思念的樣子／牽腸掛肚：比喻十分操心、掛念(B)相似。魂飛魄散：比喻非常恐懼害怕／膽戰心驚：形容十分害怕(C)相似。神魂顛倒：精神恍惚，心意迷亂／意亂心慌：心中慌亂無主(D)相反。魂不守舍：比喻心神恍惚不定／聚精會神：比喻一個人集中精神，專心一意）", "categories": ["回憶往事類", "處境際遇做事態度類"]}, {"id": "exam74", "stem": "「他演講時，博徵古今，真是□□□□。」文 笑）", "categories": ["天文氣象時間類", "學習教育類"]}, {"id": "exam82", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "博大精深／博學多聞", "B": "博覽古今／孤陋寡聞", "C": "旁徵博引／穿鑿附會", "D": "精益求精／故步自封"}, "answer": "A", "explanation": "（8.(B)相反。博覽古今：形容人見識廣博，學識豐富／孤陋寡聞：學識淺薄，見聞不廣泛(C)相反。旁徵博引：多方引證，以資徵信／穿鑿附會：憑空杜撰，隨意牽合(D)相反。精益求精：力求技能進步再進步／故步自封：比喻墨守成規，安於現狀，不求進取(A)相似。博大精深：形容一個人知識宏闊，見解精闢／博學多聞：學問廣博，見識豐富）", "categories": ["景物環境類"]}, {"id": "exam83", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "不約而同／不謀而合", "B": "不卑不亢／俯首帖耳", "C": "不比尋常／家常便飯", "D": "不辨菽麥／冰雪聰明"}, "answer": "A", "explanation": "（9.(B)相反。不卑不亢：形容處事待人態度得體，不傲慢、不卑屈，恰到好處／俯首帖耳：形容恭順馴服的樣子(C)相反。不比尋常：不同於一般／家常便飯：家中的日常飯食。後比喻常見或平常的事情(D)相反。不辨菽麥：指無法分別豆子與麥子。形容人愚昧無知／冰雪聰明：形容人的才思如同冰雪一般的晶瑩透澈、潔白無瑕。用來稱讚人非常聰明(A)相似。不約而同：彼此並未事先約定，而意見或行為卻相同／不謀而合：事先未經商量，而意見、行為卻一致）", "categories": ["品格修養類", "天文氣象時間類"]}, {"id": "exam84", "stem": "下列選項中成語的前後關係，何者與「不勝其煩」和「煩不勝煩」的關係不同？", "options": {"A": "不能勝數／恆河沙數", "B": "美不勝收／琳瑯滿目", "C": "旗開得勝／馬到成功", "D": "略勝一籌／相形見絀"}, "answer": "D", "explanation": "（10.題幹為相似關係，皆表達不堪煩擾。(A)相似。不能勝數：無法一一盡數／恆河沙數：形容數量極多(B)相似。美不勝收：形容美好的事物非常多，無法一一收受／琳瑯滿目：形容滿眼所見都是珍美的東西(C)相似。旗開得勝：比喻事情一開始就獲得成功／馬到成功：比喻成功迅速而順利(D)相反。略勝一籌：比喻兩相比較，其中一方稍微高明一些／相形見絀：兩相比較之下顯得不如對方）", "categories": ["其他", "戰爭軍事類", "景物環境類"]}, {"id": "exam85", "stem": "下列選項中成語的前後關係，何者與其他三者不同？", "options": {"A": "林林總總／五花八門", "B": "酒池肉林／克己復禮", "C": "杏林春暖／妙手回春", "D": "聲振林木／響遏行雲"}, "answer": "B", "explanation": "（11.(A)相似。林林總總：形容人或事物眾多／五花八門：比喻形形色色、變化多端(C)相似。杏林春暖：稱頌醫生的仁心仁術，如春日的溫煦／妙手回春：指醫師的醫術高明，能把垂危的病人治癒(D)相似。聲振林木：形容歌聲激越響亮／響遏行雲：形容聲音響亮高妙，能止住行雲(B)相反。酒池肉林：比喻生活極端奢侈恣縱，毫無節制／克己復禮：克制自己的私欲，使言行舉止合乎禮節）", "categories": ["天文氣象時間類", "文學典故修辭類", "植物花木類", "生活器物類", "身體感官類"]}, {"id": "exam86", "stem": "「這本書資料詳實，內容□□□□，是不可多得的參考書。」根據文意脈絡，缺空處最適宜填入下列何者？", "options": {"A": "所向披靡", "B": "靡靡之音", "C": "靡衣玉食", "D": "鉅細靡遺"}, "answer": "D", "explanation": "（12.(A)比喻力量所到之處，敵人紛紛潰退(B)指令人頹廢、喪志的音樂(C)穿華麗的衣服，吃精美的食物。形容豪華奢侈的生活(D)重要的或不重要的都不會遺漏。比喻做事很仔細）", "categories": ["戰爭軍事類", "文學典故修辭類"]}, {"id": "exam87", "stem": "下列選項「」中成語，何者應用最不恰當？", "options": {"A": "自從當了主管，每天都要開會，真是覺得「不勝其煩」", "B": "他雖出身低微，但處事態度卻「不卑不亢」，令人讚許", "C": "我與他可是出生入死過，彼此的交情當然「不比尋常」", "D": "在處理同學之間的矛盾時，老師總能做到「不名一文」"}, "answer": "D", "explanation": "（13.(A)不堪繁雜的事、不堪別人的打擾(B)形容處事待人態度得體，不傲慢、不卑屈，恰到好處(C)不同於一般(D)一文錢都沒有，比喻極為貧窮。宜用「不偏不倚」）", "categories": ["品格修養類"]}, {"id": "exam88", "stem": "「目擊者基於正義，在警局向辦案人員□□□□地描述整起車禍的經過。」根據文意脈絡，文中缺空處最不適宜填入下列何者？", "options": {"A": "一五一十", "B": "鉅細靡遺", "C": "支吾其詞", "D": "和盤托出"}, "answer": "C", "explanation": "（14.(A)比喻把事情從頭至尾詳細說出，無所遺漏(B)重要的或不重要的都不會遺漏。比喻做事很仔細(C)以含混牽強的言語，搪塞應付他人(D)比喻毫無保留的全部拿出來或說出來）", "categories": ["文學典故修辭類"]}, {"id": "exam89", "stem": "「小豪經過老師諄諄開導後，終於明白了個中道理。」下列哪個成語最不適合用來形容後來的他？", "options": {"A": "豁然開朗", "B": "茅塞頓開", "C": "恍然大悟", "D": "大惑不解"}, "answer": "D", "explanation": "（15.(A)形容領悟了解(B)比喻閉塞的心思頓時豁然了悟(C)心裡忽然明白(D)指對事物感到非常疑惑，無法了解）", "categories": []}, {"id": "exam90", "stem": "「自食其力」與「不勞而獲」的意思相反，請問「無懈可擊」與下列何者意思相反？", "options": {"A": "十全十美", "B": "無隙可乘", "C": "漏洞百出", "D": "堅如磐石"}, "answer": "C", "explanation": "（1.「自食其力」指憑藉自己的勞力養活自己。「不勞而獲」指毫不費力而得到。(A)比喻圓滿美好毫無缺陷的境界(B)沒有可以利用的機會(C)到處都是破綻、缺失。常指作文、說話或行為不嚴謹，往往自相矛盾，無法自圓其說(D)像磐石一樣堅固。比喻極為堅定，不可動搖。故選(C)）", "categories": []}, {"id": "exam91", "stem": "在風箏一詩，作者用「扶搖而上」一詞形容風箏隨著旋風快速上升，盤旋而上。而現今多以「扶搖而上」比喻下列何者？", "options": {"A": "身強體壯", "B": "仕途得意", "C": "堅忍不拔", "D": "使命必達"}, "answer": "B", "explanation": "（2.「扶搖直上」用來比喻仕途得意。故選(B)）", "categories": []}, {"id": "exam92", "stem": "「在關鍵的時候，小陸□□□□接下這個險峻的任務。」句中空格不適合填入下列何者？", "options": {"A": "挺身而出", "B": "自告奮勇", "C": "自得其樂", "D": "毛遂自荐"}, "answer": "C", "explanation": "（3.(A)遇到危難時，勇敢的站出來，擔當其任(B)自動請求擔負冒險犯難的事(C)能悠然體會其中的樂趣(D)比喻自告奮勇，自我推荐。故選(C)）", "categories": []}, {"id": "exam93", "stem": "「仁心仁術」與「妙手回春」的詞義關係，同於「不求甚解」與下列哪個詞語的詞義關係？", "options": {"A": "窮源竟委", "B": "尋根究底", "C": "一知半解", "D": "融會貫通"}, "answer": "C", "explanation": "（4.「仁心仁術」稱揚醫生心地善良、醫術高明的用語。「妙手回春」比喻醫師的醫術高明，能治好重病。後亦用於比喻將頹勢扭轉過來，故「仁心仁術」與「妙手回春」意思相近。「不求甚解」形容學習或工作的態度不認真，只求略懂皮毛而不深入理解。(A)把河道的源頭到末尾，全部予以探查。引申為探究事物的始末原委(B)詳究事物的底細(C)形容一個人所知不全，了解不深(D)形容將各種相關的知識或事物加以融合、貫穿，進而獲得全面通徹的領會。故選(C)「一知半解」與「不求甚解」意思相近）", "categories": ["天文氣象時間類", "學習教育類", "身體感官類"]}, {"id": "exam94", "stem": "下列各組成語，何者詞義相近？", "options": {"A": "袖手旁觀／拔刀相助", "B": "自得其樂／提心吊膽", "C": "矯揉造作／裝腔作勢", "D": "清心寡欲／胡思亂想"}, "answer": "C", "explanation": "（5.(A)把手縮在袖子裡，在一旁觀看。形容置身事外，不予過問／出面替人打抱不平。或指出力幫助(B)能悠然體會其中的樂趣／形容心理上、精神上擔憂恐懼，無法平靜下來(C)刻意地人工施為與雕琢。後形容裝腔作勢、刻意做作的態度／指故意裝出某種腔調或姿態(D)去除內心的雜念，減省對外物的欲求，保持心境清澄寧定／不切實際地妄想。故選(C)）", "categories": ["品格修養類", "身體感官類"]}, {"id": "exam95", "stem": "「□□□□是古代儒家所提倡的立身處世的態度。」句中空格可以填入下列何者？", "options": {"A": "嫌貧愛富", "B": "不甘食貧", "C": "安貧樂道", "D": "養尊處優"}, "answer": "C", "explanation": "（6.(A)厭惡貧窮的人，而喜愛富有的人。指對人的好惡取捨以貧富為準(B)不情願過著貧困的生活(C)能安於貧困的處境，並仍以信守道義為樂(D)自處尊貴，生活優裕。故選(C)）", "categories": []}, {"id": "exam96", "stem": "在五柳先生傳一文，「不求甚解」一詞原指讀書注重理解義理，而不過度鑽研字面上的意思。而現今多以「不求甚解」比喻何者？", "options": {"A": "追根究底的深入了解", "B": "花費很多時間認真學習", "C": "學習只求略懂皮毛而不深入理解", "D": "樂於向學問或地位比自己低的人學習"}, "answer": "C", "explanation": "7.「不求甚解」後形容學習或工作的態度不認真，只求略懂皮毛而不深入理解。故選(C)）", "categories": ["學習教育類"]}, {"id": "exam97", "stem": "「這一方案已包括了應變辦法，補救措施，可說已做到□□□□的地步。」句中空格處應填入下列何者？", "options": {"A": "汲汲營營", "B": "不著痕跡", "C": "好高騖遠", "D": "無懈可擊"}, "answer": "D", "explanation": "（8.(A)形容人急切求取名利的樣子(B)不留任何形跡(C)一味地嚮往高遠的目標而不切實際(D)沒有缺點或破綻可讓人攻擊。故選(D)）", "categories": ["文學典故修辭類"]}, {"id": "exam98", "stem": "下列「」中的成語，何者運用完全正確？", "options": {"A": "小明年輕有為，做事認真踏實，從不「好高騖遠」", "B": "取得優秀的表現，是他「鉅細靡遺」努力的成果", "C": "舊地重遊，而人事已非，不禁令他「知足常樂」", "D": "這本書資料詳實，內容「日積月累」，是不可多得的參考書"}, "answer": "A", "explanation": "9.應改為(B)日積月累：逐日、逐月的長時間累積。比喻歷時遠久。(C)黯然神傷：心神沮喪，神情憂傷。(D)鉅細靡遺：重要的或不重要的都不會遺漏）", "categories": ["文學典故修辭類"]}, {"id": "exam99", "stem": "「在自媒體時代，能迎合觀眾口味，網路人氣便可在短時間內扶搖直上。」句中「扶搖直上」一詞可替換成下列何者而文意不變？", "options": {"A": "青雲直上", "B": "上行下效", "C": "錦上添花", "D": "七上八下"}, "answer": "A", "explanation": "10.題幹與(A)皆有快速上升之意，詞義相近。(B)在上位的人怎麼做，下面的人就起而效法(C)比喻美上加美，喜上加喜(D)形容心情起伏不定、忐忑不安。故選(A)）", "categories": ["文學典故修辭類"]}, {"id": "exam100", "stem": "「這部連續劇的女主角演技自然率真，毫不□□□□，所以贏得眾多觀眾的喜愛。」句中空格處應填入下列何者？", "options": {"A": "拐彎抹角", "B": "矯揉造作", "C": "暢所欲言", "D": "冠冕堂皇"}, "answer": "B", "explanation": "（11.(A)比喻說話或做事不直爽(B)形容裝腔作勢、刻意做作的態度(C)痛痛快快、毫無顧忌地把想說的話全部講出來(D)形容表面上光明正大的樣子。故選(B)）", "categories": ["品格修養類"]}, {"id": "exam101", "stem": "老師請大家用「不求甚解」造句，請問下列何人的成語運用有誤？", "options": {"A": "小一：想不到那麼難解的題目，竟被他毫不費勁地「不求甚解」", "B": "小南：你學數學都「不求甚解」，難怪同一類型的題目老是算錯", "C": "小書：他老是對公事「不求甚解」，處理起來快是快，但總是出差錯", "D": "小文：做事如果一直「不求甚解」，不但得不到任何收穫，還容易弄巧成拙"}, "answer": "A", "explanation": "（12.(A)應改為「迎刃而解」：比喻事情很容易處理）", "categories": ["學習教育類"]}, {"id": "exam102", "stem": "「曉華□□□□，從不斤斤計較，與同事及鄰居間的關係都很好。」句中空格不適合填入下列何者？", "options": {"A": "寬大為懷", "B": "正中下懷", "C": "寬宏大量", "D": "豁達大度"}, "answer": "B", "explanation": "（13.(A)抱著寬大的胸襟來待人處世(B)恰好符合自己的心意(C)度量寬大(D)形容心胸寬闊、度量宏大，能容人。故選(B)）", "categories": ["品格修養類"]}, {"id": "exam103", "stem": "下列文句「」中的詞語，何者使用不恰當？", "options": {"A": "他為人和善，凡事「不拘小節」，所以身旁總有很多朋友", "B": "他做事一向「不擇手段」，你和他共事，要多加小心", "C": "這本小說雖然有幾個錯別字，但「無傷大雅」，並不影響閱讀理解", "D": "他和他的酒肉朋友一向「不拘小節」，到處聚眾滋事，是地方的頭痛人物"}, "answer": "D", "explanation": "（14.(D)應改為「為非作歹」）", "categories": ["生活器物類"]}, {"id": "exam104", "stem": "「對於不合理的要求，不必□□□□，應該極力爭取應有的權利。」句中空格處應填入下列何者？", "options": {"A": "赤手空拳", "B": "自得其樂", "C": "逆來順受", "D": "順水推舟"}, "answer": "C", "explanation": "（15.(A)指手中空無一物。亦用於形容沒有一點憑藉(B)能悠然體會其中的樂趣(C)以順從的態度接受惡劣環境或不合理的待遇(D)比喻順應情勢行事。故選(C)）", "categories": ["生活器物類", "身體感官類"]}, {"id": "exam105", "stem": "「哄堂大笑」與「鴉雀無聲」的意思相反，請問「設身處地」與下列何者意思相反？", "options": {"A": "以己度人", "B": "悠然自得", "C": "見義勇為", "D": "將心比心"}, "answer": "A", "explanation": "（16.「設身處地」：假想自己處在他人地位或情況中。(A)用自己的猜測來推想別人的心意(B)神態從容，心情閒適的樣子(C)看到合乎正義的事，就奮勇去做(D)以自己的立場去衡量別人的立場，體會他人的心意，多方為其設想。故選(A)）", "categories": ["品格修養類", "天文氣象時間類", "情感心理類", "文學典故修辭類", "身體感官類"]}, {"id": "exam106", "stem": "「他在成為幫派分子十餘年後還能迷途知返，真不容易。」句中「迷途知返」一詞可替換成下列何者而文意不變？", "options": {"A": "知己知彼", "B": "明知故犯", "C": "溫故知新", "D": "知錯能改"}, "answer": "D", "explanation": "17.題幹與(D)皆有知道過錯而能改正的意思。(A)正確澈底地了解自己以及對手的實力(B)形容明明知道不對，卻故意去做(C)複習學過的課業，而能領悟出新的道理）", "categories": []}, {"id": "exam107", "stem": "老師請大家用「發人深省」造句，請問下列何人運用正確？", "options": {"A": "小冬：這件事情我只想「發人深省」，以免牽一髮而動全身", "B": "小皙：王教授的這場演講「發人深省」，讓聽眾受益良多", "C": "小南：他不論讀書、做事都能掌握要訣，自然能「發人深省」", "D": "小北：犯錯是常見的，但如犯了錯還「發人深省」，那就無藥可救了"}, "answer": "B", "explanation": "18.應改為(A)息事寧人：平息紛爭，以使彼此相安(C)事半功倍：形容費力少而收效大(D)執迷不悟：堅持錯誤的觀念而不醒悟）", "categories": []}, {"id": "exam108", "stem": "「得知多年好友突然離世，他整日□□□□，無法從悲痛中走出來。」句中空格處應填入下列何者？", "options": {"A": "黯然神傷", "B": "慷慨激昂", "C": "大發雷霆", "D": "哭笑不得"}, "answer": "A", "explanation": "（19.(A)內心沮喪，神情憂傷(B)志氣高昂，情緒激揚(C)形容大發脾氣，大聲責罵(D)形容令人又好氣又好笑的感覺。故選(A)）", "categories": ["天文氣象時間類", "情感心理類"]}, {"id": "exam109", "stem": "「他個性孤僻，長年過著離群索居的生活。」請問「離群索居」與下列何者意思相近？", "options": {"A": "獨當一面", "B": "獨來獨往", "C": "無獨有偶", "D": "獨木難支"}, "answer": "B", "explanation": "20.(A)獨力擔當某一方面的重任(B)獨自一人，不與人同伙(C)指兩項事物恰巧相同或類似(D)比喻事情非常重大，非一人之力所能支持。故選(B)）", "categories": []}, {"id": "exam110", "stem": "「真正的朋友不僅在順境時並肩而行，更能在困境中□□□□。」句中空格處應填入下列何者？", "options": {"A": "過河拆橋", "B": "恩斷義絕", "C": "禍福與共", "D": "作威作福"}, "answer": "C", "explanation": "（21.(A)比喻不念舊情，忘恩負義(B)斷絕恩情道義，多指夫妻感情決裂而離異(C)一同度過苦難，也一同分享快樂(D)仗著權勢欺壓別人。故選(C)）", "categories": []}, {"id": "exam111", "stem": "「我只是好心提醒他別遲到，他不僅不領情，還罵我多管閒事，真是不知好歹！」句中「不知好歹」可換成下列何者而文意不變？", "options": {"A": "不識抬舉", "B": "不言而喻", "C": "不知所云", "D": "不苟言笑"}, "answer": "A", "explanation": "22.(A)指責人不接受或不自知別人的禮遇優待(B)事態明顯，不待說明即可曉悟(C)言語模糊或內容空洞，無法得知意旨為何(D)指不隨便談笑，態度嚴肅。故選(A)）", "categories": ["人際溝通表達類"]}, {"id": "exam112", "stem": "下列哪個成語並非形容人「家境貧苦」？", "options": {"A": "簞瓢屢空", "B": "家徒四壁", "C": "食不果腹", "D": "餐風沐雨"}, "answer": "D", "explanation": "（23.(A)形容生活極為貧窮，缺乏食物(B)形容家境極為貧困(C)吃不飽，形容生活貧窮困苦(D)形容野外生活或行旅的艱苦。故選(D)）", "categories": ["景物環境類", "植物花木類"]}, {"id": "exam113", "stem": "「無傷大雅」與「不足掛齒」的意思相近，請問「不拘小節」與下列何者同屬於近義詞？", "options": {"A": "束手無策", "B": "一毛不拔", "C": "錙銖必較", "D": "不修邊幅"}, "answer": "D", "explanation": "24.題幹與(D)皆有不拘束於形式小節的意思。(A)比喻面對問題時，毫無解決的辦法(B)比喻自私自利，不肯貢獻出些微的力量(C)連很少的錢或很小的事情都非常計較）", "categories": ["身體感官類"]}, {"id": "exam114", "stem": "下列文句，何者成語運用完全正確？", "options": {"A": "他在公司表現優異，短短三年內就「扶搖直上」，晉升為部門主管", "B": "他的成功並非偶然，而是靠著「俯仰之間」的努力與堅持換來的", "C": "走進老人的家中，只見屋內「美輪美奐」，家具簡陋，但卻十分整潔", "D": "操場雖有上萬人，但卻「哄堂大笑」，似乎連根針掉地上都聽得清楚"}, "answer": "A", "explanation": "（25.應改為(B)日積月累：比喻歷時遠久(C)環堵蕭然：形容居室簡陋，十分貧窮(D)鴉雀無聲：形容非常寂靜）", "categories": ["景物環境類"]}, {"id": "exam115", "stem": "「當年小王見義勇為，捨身救人的事蹟，至今仍為人所□□□□。」句中空格可以填入下列何者？", "options": {"A": "三緘其口", "B": "絕口不提", "C": "意猶未盡", "D": "津津樂道"}, "answer": "D", "explanation": "（1.(A)形容說話謹慎或不說話(B)對某事保持沉默，不再提起(C)興致、意趣尚未滿足(D)形容很有興味地談論。故選(D)）", "categories": ["人際溝通表達類", "品格修養類", "文學典故修辭類", "身體感官類"]}, {"id": "exam116", "stem": "「每當小華說起第一次參加比賽的心情，總是歷歷如繪，引人入勝。」請問「歷歷如繪」與下列何者意思相近？", "options": {"A": "匪夷所思", "B": "繪聲繪影", "C": "向壁虛造", "D": "不切實際"}, "answer": "B", "explanation": "（2.「歷歷如繪」描寫、陳述得清楚，就像畫面呈現眼前一般。(A)非一般人所能想像得到的(B)形容講述或描摹事物，十分深刻入微、生動逼真(C)比喻憑空捏造(D)不符合現實狀況或需要。故選(B)）", "categories": ["學習教育類", "身體感官類"]}, {"id": "exam117", "stem": "「小婷上了大學之後，參加了不同社團，生活過得更加□□□□。」句中空格填入何者最恰當？", "options": {"A": "推陳出新", "B": "五彩繽紛", "C": "多采多姿", "D": "形形色色"}, "answer": "C", "explanation": "3.(A)比喻排除老舊的，創造出嶄新的事物或方法(B)形容色彩鮮豔絢麗(C)形容姿態變化多端，色彩鮮麗迷人。後引申為內容豐富華麗，且變化多端。(D)形容事物種類繁多。故選(C)）", "categories": ["其他", "學習教育類", "文學典故修辭類"]}, {"id": "exam118", "stem": "下列各組詞語意思的關係，何者異於其他三者？", "options": {"A": "剛愎自用／從諫如流", "B": "門庭若市／車水馬龍", "C": "忘恩負義／過河拆橋", "D": "層次井然／條理分明"}, "answer": "A", "explanation": "（4.(A)指性情倔強，自以為是／形容人有雅量，能像水由高處順流而下般接受別人的直言規勸(B)門庭間來往的人很多，像市集一般熱鬧。比喻上門來的人很多／門前車馬往來不絕。後形容繁華熱鬧的景象(C)受人恩惠不知報答，反而做出對不起恩人的事情／渡過了河就把橋拆掉。比喻不念舊情，忘恩負義(D)條理整齊而不雜亂／有系統、層次，不紊亂。(A)相反詞(B)(C)(D)相似詞。故選(A)）", "categories": ["品格修養類", "文學典故修辭類"]}, {"id": "exam119", "stem": "「遇到不合理的事就應據理力爭，維護自己的權益。」句中「據理力爭」用下列何詞取代後句意仍然可通？", "options": {"A": "力排眾議", "B": "強詞奪理", "C": "忍氣吞聲", "D": "理屈詞窮"}, "answer": "A", "explanation": "5.(A)為維持自己的意見，竭力排除各種不同的議論(B)形容沒有道理卻強為狡辯，硬說成有理(C)形容受了氣也強自忍耐，不敢作聲抗爭(D)由於理虧而被反駁得無話可說。故選(A)）", "categories": []}, {"id": "exam120", "stem": "「他細細描述童年的往事，那些歡樂的時光彷彿□□□□，浮現在眼前。」句中空格處應填入下列何者最恰當？", "options": {"A": "走馬看花", "B": "浮光掠影", "C": "蜻蜓點水", "D": "歷歷如繪"}, "answer": "D", "explanation": "（6.(A)比喻粗略、匆促地觀看，不能仔細深入了解事物(B)形容印象不深刻(C)比喻膚淺而不深入(D)描寫、陳述得清楚，就像畫面呈現眼前一般。故選(D)）", "categories": ["動物類", "回憶往事類", "學習教育類", "身體感官類"]}, {"id": "exam121", "stem": "下列文句皆使用「逍遙自在」一詞造句，何者使用正確？", "options": {"A": "他退休後搬到山中小屋，每天種花寫字，過著逍遙自在的生活", "B": "面對突如其來的考試，他依然逍遙自在，焦慮得睡不著覺", "C": "這次比賽失利後，他整天逍遙自在，愁眉不展，悔恨不已", "D": "這間公司工作壓力極大，員工每天都忙得逍遙自在，焦頭爛額"}, "answer": "A", "explanation": "7.應改為(B)忐忑不安：心緒起伏不定的樣子(C)悔不當初：事與願違而悔恨最初的計畫或作為不當(D)疲於奔命：形容事情繁多，奔波勞累。故選(A)）", "categories": ["情感心理類"]}, {"id": "exam122", "stem": "「這間利用寶特瓶蓋成的休閒屋，以它別出心裁的設計奪得金牌獎。」句中的「別出心裁」無法用下列哪個成語替換？", "options": {"A": "自出機杼", "B": "別具一格", "C": "拾人牙慧", "D": "獨樹一幟"}, "answer": "C", "explanation": "（8.(A)比喻獨創新意、風格(B)另有一種風格(C)比喻蹈襲他人的言論或主張(D)比喻自成一家，獨具風格。故選(C)）", "categories": ["學習教育類"]}, {"id": "exam123", "stem": "「多采多姿」與「枯燥乏味」的意思相反，請問「融會貫通」與下列何者意思相反？", "options": {"A": "一葉知秋", "B": "不求甚解", "C": "一見如故", "D": "少見多怪"}, "answer": "B", "explanation": "（9.(A)比喻由細微的徵兆，可推知事物的演變和趨勢(B)形容學習或工作的態度不認真，只求略懂皮毛而不深入理解(C)初次見面就相處融洽，如同老朋友一般(D)譏諷人見識不廣，遇平常之事亦以為驚怪。故選(B)）", "categories": ["天文氣象時間類", "學習教育類", "情感心理類"]}, {"id": "exam124", "stem": "如果要形容一個人「堅持正義，不屈從權勢」，下列哪個成語最適切？", "options": {"A": "剛愎自用", "B": "持正不阿", "C": "大義滅親", "D": "八面玲瓏"}, "answer": "B", "explanation": "（10.(A)指性情倔強，自以為是(B)堅守正道，而不逢迎曲從(C)為了維護公理正義，不徇私情，滅了犯罪的親人，或讓他們接受法律制裁(D)形容人言行手段，十分巧妙，處世圓融。故選(B)）", "categories": ["品格修養類", "情感心理類", "文學典故修辭類"]}, {"id": "exam125", "stem": "下列成語中，哪一組成語的意思最接近？", "options": {"A": "博大精深／據理力爭", "B": "別出心裁／獨樹一幟", "C": "持正不阿／層次井然", "D": "津津樂道／手足無措"}, "answer": "B", "explanation": "11.(A)形容一個人知識宏闊，見解精闢／根據事理，竭力爭取(B)皆形容獨具風格(C)堅守正道，而不逢迎曲從／條理整齊而不紊亂(D)形容很有興味地談論／形容人惶恐不安，不知如何是好。故選(B)）", "categories": ["人際溝通表達類", "身體感官類"]}, {"id": "exam126", "stem": "「遇到不合理的事就應□□□□，維護自己的權益。」句中空格處應填入下列何者？", "options": {"A": "持正不阿", "B": "津津樂道", "C": "據理力爭", "D": "大材小用"}, "answer": "C", "explanation": "（12.(A)堅守正道，而不逢迎曲從(B)形容很有興味地談論(C)根據事理，竭力爭取(D)比喻才能的浪費或人事安排不當。故選(C)）", "categories": ["人際溝通表達類"]}, {"id": "exam127", "stem": "下列「」中的成語，何者使用正確？", "options": {"A": "這本小說故事情節複雜，卻能層層鋪陳，「層次井然」，令人讚嘆", "B": "他的話語「博大精深」，讓人完全無法理解他的意思，只能勉強附和", 一詞造句，何者使用正確？", "options": {"A": "這次比賽的參賽作品品質參差不齊、「異曲同工」，很難評出佳作", "B": "小明做事馬馬虎虎，小華則一絲不苟，兩人的態度簡直是「異曲同工」", "C": "他們的意見明顯對立，簡直是「異曲同工」，讓人感到無所適從", "D": "這兩篇文章，儘管風格截然不同，但在表達技巧上卻有「異曲同工」之妙"}, "answer": "D", "explanation": "（20.應改為(A)良莠不齊(B)天壤之別(C)南轅北轍。故選(D)）", "categories": ["文學典故修辭類", "處境際遇做事態度類"]}, {"id": "exam135", "stem": "「他對於自己的目標，一直抱持□□□□的態度，不達目的絕不放棄。」句中空格應填入哪個成語？", "options": {"A": "鍥而不捨", "B": "無懈可擊", "C": "逍遙自在", "D": "從諫如流"}, "answer": "A", "explanation": "（21.(A)堅持到底，奮勉不懈(B)沒有任何缺點可讓人攻擊(C)自由自在、無拘無束(D)形容人有雅量，能像水由高處順流而下般接受別人的直言規勸）", "categories": ["品格修養類", "處境際遇做事態度類"]}, {"id": "exam136", "stem": "下列文句皆使用「當局者迷，旁觀者清」一詞造句，何者使用錯誤？", "options": {"A": "小美在職場上遇到難題，遲遲無法下決定，朋友提醒她：「當局者迷，旁觀者清", "B": "在比賽中，小明因過於緊張而判斷失誤，場邊的教練卻一眼看出問題，真是「當", "C": "這對夫妻爭吵不休，雙方各執一詞，旁人卻一聽就知道誤會在哪裡，應了那句話", "D": "這場籃球賽雙方實力相當，我們都看得熱血沸騰，真是「當局者迷，旁觀者清」"}, "answer": "D", "explanation": "」，建議她換個角度思考局者迷，旁觀者清」：「當局者迷，旁觀者清」（22.(D)應改為「精采絕倫」）", "categories": []}, {"id": "exam137", "stem": "「平日養成應變的能力，才不會在遇到事情時手足無措、失去方寸。」句中的「手足無措」可用下列哪個成語替換？", "options": {"A": "逍遙自在", "B": "六神無主", "C": "手舞足蹈", "D": "泰然自若"}, "answer": "B", "explanation": "23.(A)自由自在、無拘無束(B)形容心慌意亂，拿不定主意(C)形容高興到了極點(D)形容遇到緊急或危難的情況時，仍能沉著鎮定而不驚惶失措。故選(B)）", "categories": ["情感心理類", "文學典故修辭類", "身體感官類"]}, {"id": "exam138", "stem": "下列「」中的成語，何者運用最恰當？", "options": {"A": "這間利用寶特瓶蓋成的房屋，以它「別出心裁」的設計奪得金牌獎", "B": "這次論壇的議程規畫完善，討論內容環環相扣，整體顯得「博大精深」", "C": "這場馬拉松比賽競爭激烈，選手們互不相讓，快到終點時仍「逍遙自在」", "D": "這次期中考試題目簡單，學生們輕鬆應對，個個顯得「手足無措」"}, "answer": "A", "explanation": "（24.應改為(B)層次井然(C)勝負未分(D)胸有成竹。故選(A)）", "categories": ["身體感官類"]}, {"id": "exam139", "stem": "下列文句皆使用「一言既出，駟馬難追」一詞造句，何者使用正確？", "options": {"A": "只要願意努力讀書，就能在考試中取得好成績，正所謂「一言既出，駟馬難追」", "B": "他在大家面前答應負責，事後卻想反悔，朋友提醒他：「一言既出，駟馬難追」", "C": "這幅畫筆觸細膩、色彩鮮明，彷彿讓人置身畫境，可謂「一言既出，駟馬難追」", "D": "他花三年時間完成的小說，終於出版了，這種毅力真是「一言既出，駟馬難追」"}, "answer": "B", "explanation": "（25.應改為(A)一分耕耘，一分收穫(C)歷歷如繪(D)鍥而不捨。故選(B)）", "categories": []}, {"id": "exam140", "stem": "「近幾年房屋價格節節高漲，□□□□苦無財力購屋，經常感嘆城市居大不易。」句中空格可以填入以下何詞？", "options": {"A": "王孫公子", "B": "公子哥兒", "C": "達官貴人", "D": "市井小民"}, "answer": "D", "explanation": "（1.(A)泛指官僚、貴族的弟子(B)不知人情世故的富貴人家子弟(C)高級官員和社會地位顯要的人(D)城市裡的居民百姓。故選(D)）", "categories": []}, {"id": "exam141", "stem": "下列文句「」中的成語，何者使用不恰當？", "options": {"A": "今天晚上吳老師大提琴演出確實不同凡響，給人「耳目一新」的感覺", "B": "這個青花瓷花瓶，是外公「愛不釋手」的寶貝", "C": "事情的真相尚未明朗，我們還是先不要「杯弓蛇影」，庸人自擾了", "D": "小明朗誦的語調「平鋪直述」，富有感情，臺下觀眾如痴如醉"}, "answer": "D", "explanation": "2.(A)形容所見所聞都有一種新奇、清新的感覺(B)喜歡得捨不得放手(C)將酒杯裡的弓影，誤以為是蛇，以致喝下後心生疑懼。後比喻為不存在的事情枉自驚擾(D)宜填入「抑揚頓挫」。故選(D)）", "categories": ["戰爭軍事類", "文學典故修辭類"]}, {"id": "exam142", "stem": "下列各組成語，何者詞義相近？", "options": {"A": "百思不解／茅塞頓開", "B": "貫徹始終／朝秦暮楚", "C": "市井小民／布衣黔首", "D": "波濤洶湧／風平浪靜"}, "answer": "C", "explanation": "（3.(A)經過反覆思考，仍然無法了解／比喻閉塞的心思，頓時豁然了悟(B)自始至終，澈底實踐／比喻人心反覆無常(C)城市裡的居民百姓／泛指一般的老百姓(D)波浪很大／無風無浪。比喻平靜或情勢穩定。故選(C)）", "categories": []}, {"id": "exam143", "stem": "下列各組詞語意思的關係，何者異於其他三者？", "options": {"A": "自顧不暇／分身乏術", "B": "不可或缺／無關緊要", "C": "刻骨銘心／沒齒難忘", "D": "耳濡目染／潛移默化"}, "answer": "B", "explanation": "（4.(A)形容自身難保，沒有餘力再管別的事情／比喻非常繁忙，無法再兼顧他事(B)必須，不能缺少／不重要(C)形容感受深刻，難以忘懷／指永遠難以忘記(D)指經常聽到、看到而深受影響／人的思想、性格或習慣受到影響，不知不覺中起了變化。(A)(C)(D)相似詞(B)相反詞，故選(B)）", "categories": ["回憶往事類", "身體感官類"]}, {"id": "exam144", "stem": "「他做事總是□□□□，常惹得急性子的主管暴跳如雷。」句中空格填入下列何者最恰當？", "options": {"A": "不假思索", "B": "慢條斯理", "C": "小心翼翼", "D": "一日千里"}, "answer": "B", "explanation": "5.「暴跳如雷」形容人急怒時跳腳吼叫的樣子。(A)指不經過思考探求，立即做出反應(B)從容不迫的樣子(C)形容舉止十分謹慎，不敢懈怠疏忽(D)形容速度很快。故選(B)）", "categories": ["品格修養類", "情感心理類", "文學典故修辭類"]}, {"id": "exam145", "stem": "「陽光空氣和水與人的生命息息相關」，請問「息息相關」與下列何者意思相近？", "options": {"A": "水火不容", "B": "密不可分", "C": "毫不相干", "D": "渺不相涉"}, "answer": "B", "explanation": "（6.「息息相關」比喻關係極為密切或彼此契合無間。(A)比喻互相對立，不能相容(B)關係十分緊密而無法分開(C)絲毫沒有關連(D)一點也不相干、無關。故選(B)）", "categories": []}, {"id": "exam146", "stem": "下列「」中哪一個成語的用法不適當？", "options": {"A": "這件弊案被揭發後，她反而「如釋重負」，多年來心頭的壓力一掃而空", "B": "他抱持著「破釜沉舟」的信念爭取贏的機會，不為失敗找尋任何藉口", "C": "這幅壁畫內容豐富，「一成不變」，令人目不暇給", "D": "小花這次段考成績突飛猛進，令人「刮目相看」"}, "answer": "C", "explanation": "義無反顧(C)事情既定之後，從不改變。「目不暇給」形容眼前美好事物不斷，或景物變化太快，讓人來不及觀賞(D)用新的眼光來看待人。「突飛猛進」比喻發展進步得很快。故選(C)）（7.(A)像放下重擔那樣輕鬆。比喻責任已盡，身心輕鬆愉快。「一掃而空」：全部清除乾淨(B)形容做事果決，", "categories": ["其他", "戰爭軍事類", "生活器物類", "身體感官類"]}, {"id": "exam147", "stem": "「在各國兵荒馬亂的戰爭下，遭受飢荒的百姓□□□□。」句中空格可以填入何詞？", "options": {"A": "不知凡幾", "B": "寥寥可數", "C": "屈指可數", "D": "寥若晨星"}, "answer": "A", "explanation": "（8.(A)數目多得不可計算(B)數量極少(C)彎曲手指可計數，形容數量很少(D)形容數量稀少。故選(A)）", "categories": ["戰爭軍事類", "文學典故修辭類", "身體感官類"]}, {"id": "exam148", "stem": "「花車遊行時，圍觀群眾將街道擠得□□□□。」句中空格不適合填入下列何者？", "options": {"A": "摩肩接踵", "B": "水洩不通", "C": "寸步難行", "D": "暢通無阻"}, "answer": "D", "explanation": "（9.(A)指肩接肩，腳碰腳。形容人多擁擠不堪(B)一點水也無法泄漏，形容包圍得極為嚴密(C)一小步也行走不得。形容行走困難，或比喻處境艱難窘困(D)順利的通行，沒有阻礙。故選(D)）", "categories": []}, {"id": "exam149", "stem": "「三月初春的天氣□□□□，出門在外要記得注意早晚的氣溫。」句中空格可以填入何詞？", "options": {"A": "乍暖還寒", "B": "風光明媚", "C": "秋高氣爽", "D": "滴水成冰"}, "answer": "A", "explanation": "（10.(A)氣候冷熱不定，忽冷忽熱(B)景色鮮明悅目(C)深秋天空清朗，氣候涼爽(D)滴下的水很快就結成冰。形容天氣非常寒冷。故選(A)）", "categories": ["景物環境類"]}, {"id": "exam150", "stem": "「每逢農曆新年，□□□□都洋溢著歡樂的氣息。」句中空格填入何詞最恰當？", "options": {"A": "花街柳巷", "B": "大街小巷", "C": "萬人空巷", "D": "打街罵巷"}, "answer": "B", "explanation": "（11.(A)風化區，妓院聚集的地方(B)泛指城裡街道巷弄(C)形容擁擠、熱鬧的盛況(D)在鄰里街坊間鬧事、耍無賴。故選(B)）", "categories": []}, {"id": "exam151", "stem": "「愛情不是□□□□、苦苦追求，而是要雙方兩情相悅，互相珍惜。」句中空格填入何詞最恰當？", "options": {"A": "一日三秋", "B": "一片冰心", "C": "一廂情願", "D": "一心一意"}, "answer": "C", "explanation": "（13.「兩情相悅」雙方彼此情投意合。(A)比喻思念心切(B)比喻人冰清玉潔、恬靜淡泊的性情(C)完全出自單方面的主觀意願，不管對方意願如何(D)心意專一，毫無他念。故選(C)）", "categories": ["天文氣象時間類"]}, {"id": "exam152", "stem": "差不多先生傳一文中，「一命嗚呼」表示死亡。下列何者與「一命嗚呼」語義相差最遠？", "options": {"A": "駕鶴西歸", "B": "陰魂不散", "C": "溘然長逝", "D": "撒手人寰"}, "answer": "B", "explanation": "14.(A)神仙駕鶴回到西天，比喻人死。多用於輓辭(B)比喻人或事雖已不存在，影響力仍起一定作用。或謔稱人尾隨緊跟，窮追不捨(C)謂人死亡(D)比喻人去世。故選(B)）", "categories": []}, {"id": "exam153", "stem": "（甲）模稜兩可（乙）實事求是（丙）馬馬虎虎（丁）囫圇吞棗（戊）戰戰兢兢（己）小心謹慎上列成語，哪些可以用來形容差不多先生的行為處事？", "options": {"A": "丁戊己", "B": "甲丙丁", "C": "乙戊己", "D": "甲丙己"}, "answer": "B", "explanation": "（15.(甲)比喻處理事情的態度含混，不表示明確的意見或主張(乙)做事切實，加求真確(丙)勉強將就，敷衍了事(丁)比喻理解事物籠統含糊，或為學不求甚解(戊)形容戒慎恐懼的樣子(己)為人處事、言談舉止非常慎重。故選(B)）", "categories": ["學習教育類", "文學典故修辭類", "植物花木類", "生活器物類"]}, {"id": "exam154", "stem": "「小花天馬行空，不著邊際的回答讓全班同學□□□□，不知如何回應。」句中空格可以填入下列何者？", "options": {"A": "平淡無奇", "B": "哭笑不得", "C": "不苟言笑", "D": "津津樂道"}, "answer": "B", "explanation": "（16.「天馬行空」比喻文才氣勢豪放不拘，亦用於形容浮誇不著邊際。(A)事物平凡，沒有特色(B)形容令人又好氣又好笑的感覺。亦可形容處境尷尬(C)指不隨便談笑，態度嚴肅(D)形容很有興味地談論。故選(B)）", "categories": ["人際溝通表達類", "天文氣象時間類", "處境際遇做事態度類"]}, {"id": "exam155", "stem": "下列成語何者運用正確？", "options": {"A": "你說話「模稜兩可」，我無法了解你的真實意願", "B": "他做事一向「敷衍了事」，因此常獲得長官的青睞", "C": "讀書切記「不求甚解」，否則將難有成就", "D": "小明「戰戰兢兢」的態度，讓人不禁搖頭"}, "answer": "A", "explanation": "（17.(A)比喻處理事情的態度含混，不表示明確的意見或主張(B)形容辦事不認真或對人不熱情，表面應付了事(C)讀書著重理解義理，而不過度鑽研字句上的解釋。後多指學習或工作的態度不認真，只求略懂皮毛而不深入理解(D)形容戒慎恐懼的樣子。故選(A)）", "categories": ["學習教育類", "文學典故修辭類"]}, {"id": "exam156", "stem": "「做事需持之以恆，不可□□□□。」句中空格可以填入下列何者？", "options": {"A": "滴水穿石", "B": "鍥而不捨", "C": "半途而廢", "D": "始終不渝"}, "answer": "C", "explanation": "（18.(A)滴水久了可使石穿。比喻持之以恆，事必有成(B)比喻堅持到底，奮勉不懈(C)事情沒做成功就停止。比喻做事情有始無終(D)自始至終，都不改變。指意志堅定。故選(C)）", "categories": ["品格修養類", "處境際遇做事態度類"]}, {"id": "exam157", "stem": "下列文句「」中的成語，何者使用恰當？", "options": {"A": "這個表演無趣又乏味，令人「眼花撩亂」", "B": "麗莎所設計的班服，款式新穎獨特，相當「引人注目」", "C": "展覽內容各式各樣，內容包羅萬象，讓人「過目不忘」", "D": "劉老師文采斐然，「目不識丁」，是近代文學界的重要人物"}, "answer": "B", "explanation": "（19.(A)形容眼睛昏花，心緒迷亂(B)引起他人的注意(C)形容記憶力很強，看過後不易忘記(D)比喻不識字或毫無學問。故選(B)）（20.(A)猛然醒悟過來／眼前頓時開闊明亮起來。後形容心境忽然變得開闊暢快。亦用於形容突然領悟到某個道理(B)比喻醫師的", "categories": ["其他", "回憶往事類", "身體感官類"]}, {"id": "exam158", "stem": "「陳老師剛接手這個班級，真是□□□□，不知從何著手。」句中空格可以填入何詞？", "options": {"A": "千奇百怪", "B": "千篇一律", "C": "千頭萬緒", "D": "千方百計"}, "answer": "C", "explanation": "（21.(A)形容事物或現象的奇特怪異(B)指許多篇詩文都是相同的格式、體裁。後形容事物的形式呆板而毫無變化(C)形容事情雜亂，頭緒紛繁，難以處理(D)費盡心機，想盡一切辦法、計謀。故選(C)）", "categories": ["其他"]}, {"id": "exam159", "stem": "下列「」中哪一個成語的用法不適當？", "options": {"A": "外頭花園「萬紫千紅」，百花齊放，令人目不轉睛", "B": "吳校長一直以來「潔身自愛」，私下收了不少廠商的匯款", "C": "公司的業績能夠突破，完全是團隊同仁一起立下的「汗馬功勞」", "D": "臺下觀眾喧嘩吵鬧，完全無視臺上表演者的存在，未免「喧賓奪主」了吧"}, "answer": "B", "explanation": "（22.(A)形容百花盛開，色彩絢麗的景象(B)保持自身清白純潔，而不與人同流合汙。亦指怕招惹是非，只顧自己，不管別人的閒事(C)指征戰的功勞，亦泛指一般的功勞(D)指賓客聲勢強大，占了主人的位置，反客為主。故選(B)）", "categories": ["情感心理類", "景物環境類", "植物花木類", "身體感官類"]}, {"id": "exam160", "stem": "「選拔人才要堅持□□□□的原則，也不要濫竽充數。」句中空格可以填入何詞？", "options": {"A": "缺一不可", "B": "寧缺毋濫", "C": "屈指可數", "D": "少一缺二"}, "answer": "B", "explanation": "（23.「濫竽充數」比喻沒有真才實學的人，混在行家中充數。(A)事物的必備條件，不能缺少任何一項(B)寧可沒有，也不要不顧品質，只求數量(C)彎曲手指可計數，形容數量很少(D)有所不足。故選(B)）（24.(A)原指病位深隱難治，病情危重，無藥可救。後比喻人、事已到無可挽回的", "categories": ["文學典故修辭類", "生活器物類", "身體感官類"]}, {"id": "exam161", "stem": "「這場音樂會的燈光與音效都令人驚艷，讓觀眾有□□□□的感受。」句中空格可以填入下列何者？", "options": {"A": "耳目一新", "B": "如痴如狂", "C": "一目了然", "D": "喧賓奪主"}, "answer": "A", "explanation": "（1.(A)形容所見所聞都有一種新奇、清新的感覺(B)形容人神態失常，到了無法自制的地步(C)看一眼就完全清楚明白(D)指賓客聲勢強大，占了主人的位置，反客為主。故選(A)）（2.(A)本指匆匆往來的樣子。後多形容人急切求取名利的樣子。「與世無爭」：與世人毫無爭執(B)門庭間來往的人很多，像市集一般熱鬧", "categories": ["身體感官類"]}, {"id": "exam162", "stem": "下列文句「」中的成語，何者使用不恰當？", "options": {"A": "他一生都過著「汲汲營營」、與世無爭的生活", "B": "地方的百貨公司盛大開幕，當天「門庭若市」，熱鬧非凡", "C": "讀書時萬萬不可「囫圇吞棗」，才能了解書中所蘊含的深意", "D": "因新冠肺炎影響，旅行業經營陷入困境，只有大家同舟共濟，才能「轉危為安」"}, "answer": "A", "explanation": "。比喻上門來的人很多(C)指吃棗子時不加咀嚼，把整個都吞下去。後比喻理解事物籠統含糊，或為學不求甚解(D)將危急的情況轉化為安全。「同舟共濟」：同乘一條船渡河，比喻同心協力，戰勝困難。故選(A)）", "categories": ["學習教育類", "文學典故修辭類", "植物花木類", "生活器物類"]}, {"id": "exam163", "stem": "「我們行事要有定見，不能□□□□。」句中空格可以填入下列何者？", "options": {"A": "戰戰兢兢", "B": "實事求是", "C": "隨波逐流", "D": "衝鋒陷陣"}, "answer": "C", "explanation": "3.(A)形容戒慎恐懼的樣子(B)做事切實，加求真確(C)順著水流而行。比喻人沒有確定的方向和目標，只依從環境潮流行事(D)深入敵方陣地向敵人攻擊。形容作戰英勇。故選(C)）", "categories": ["文學典故修辭類", "處境際遇做事態度類"]}, {"id": "exam164", "stem": "「這家公司的行銷手法高明，總能在競爭激烈的市場中先聲奪人，讓對手難以追趕。」句中「先聲奪人」一詞可以替換成下列何者？", "options": {"A": "先發制人", "B": "後來居上", "C": "持之以恆", "D": "狹路相逢"}, "answer": "A", "explanation": "4.先聲奪人：謂先張大聲威，以挫敗敵人士氣。(A)凡事先下手取得先機，才能制伏對方(B)形容後來的人或事物超越原領先者(C)有恆心的堅持到底(D)比喻仇人相遇。故選(A)）", "categories": ["品格修養類", "身體感官類"]}, {"id": "exam165", "stem": "下列哪一個成語的用法不適當？", "options": {"A": "在閉關修行的期間，劉師父「清心寡欲」，無欲無求", "B": "「瞬息之間」，小花竟然睡了一個下午這麼久", "C": "只有持續的努力學習，「力爭上游」才能不斷進步", "D": "小佳自從接下公司年度企畫案後，每天「早出晚歸」，十分忙碌"}, "answer": "B", "explanation": "5.(A)去除內心的雜念，減省對外物的欲求，保持心境清澄寧定(B)比喻極短的時間。不適合形容後文「一個下午這麼久」，故選(B)。(C)比喻努力奮鬥，求取上進(D)早上很早出門、晚上很晚才回來，表示一整天都在外面）", "categories": []}, {"id": "exam166", "stem": "「好的百科全書一定要內容充實，□□□□。」句中空格填入何者最符合文意？", "options": {"A": "一成不變", "B": "圖文並茂", "C": "不著痕跡", "D": "不著邊際"}, "answer": "B", "explanation": "6.(A)事情既定之後，從不改變(B)圖畫和文章的品質都非常優美(C)不留任何形跡(D)比喻言論空泛或想法不切實際。故選(B)）", "categories": ["其他"]}, {"id": "exam167", "stem": "「力爭上游」與「自甘墮落」的詞義相反，請問「慢條斯理」與下列何者詞義相反？", "options": {"A": "迫不及待", "B": "從容不迫", "C": "泰然自若", "D": "悠然自得"}, "answer": "A", "explanation": "7.「力爭上游」比喻努力奮鬥，求取上進。「自甘墮落」形容人自暴自棄，不求上進。「慢條斯理」從容不迫的樣子。(A)情況急迫，不能再等(B)沉著鎮定不慌張(C)形容遇到緊急或危難的情況時，仍能沉著鎮定而不驚惶失措(D)神態從容，心情閒適的樣子。故選(A)）", "categories": ["天文氣象時間類", "情感心理類"]}, {"id": "exam168", "stem": "下列文句「」中的成語，何者使用正確？", "options": {"A": "這篇文章經過「異曲同工」之後，顯得簡潔有力", "B": "做學問得慢慢來，從根基做起，不可「戰戰兢兢」", "C": "我們要對事情的「井井有條」澈底了解，不要驟下斷語", "D": "雖然敵人武力強大，但是軍隊抱著「寧死不屈」的決心，奮戰到底"}, "answer": "D", "explanation": "8.(A)異曲同工比喻不同人的辭章或言論同樣精采，應改為「去蕪存菁」(B)戰戰兢兢形容戒懼謹慎的樣子，應改為「好高騖遠」(C)井井有條形容整齊有序，條理分明，應改為「前因後果」(D)寧死不屈是指寧願犧牲生命，也不屈服。用以表示意志堅定。故選(D)）", "categories": ["文學典故修辭類", "處境際遇做事態度類"]}, {"id": "exam169", "stem": "下列「」中哪一個成語的用法正確？", "options": {"A": "這家餐廳的裝潢「眼花撩亂」，讓人一進門就感受到滿滿的古典氛圍", "B": "他對音樂的熱愛已到「如痴如狂」的地步，甚至夢中都在哼唱旋律", "C": "他這次獲得冠軍，身邊朋友紛紛恭喜他「功成身退」，期待他再創佳績", "D": "這場籃球賽太精采了，讓觀眾完全「貫徹始終」，沉浸其中"}, "answer": "B", "explanation": "9.(A)「眼花撩亂」形容眼睛昏花，心緒迷亂，應改為「古色古香」(C)「功成身退」指功業成就後，就退休歸隱，應改為「功成名就」(D)「貫徹始終」指自始至終，澈底實踐，應改為「全神貫注」。故選(B)）", "categories": []}, {"id": "exam170", "stem": "「這數十株的杜鵑一齊怒放，編織成□□□□的花海，真是美不勝收。」句中空格可以填入何詞？", "options": {"A": "素昧平生", "B": "萬紫千紅", "C": "興高采烈", "D": "喧賓奪主"}, "answer": "B", "explanation": "（10.「美不勝收」形容美好的事物太多，無法盡收眼底。(A)向來不相識(B)形容百花盛開，色彩絢麗的景象(C)形容興致勃勃，情緒熱烈的樣子(D)指賓客聲勢強大，占了主人的位置，反客為主。故選(B)）", "categories": ["景物環境類", "身體感官類"]}, {"id": "exam171", "stem": "「農夫為了種出金黃飽滿的稻子，每天□□□□，十分辛勞。」句中空格可以填入何詞？", "options": {"A": "扶搖直上", "B": "開張大吉", "C": "早出晚歸", "D": "慢條斯理"}, "answer": "C", "explanation": "（11.(A)比喻快速上升，亦用來比喻仕途得意(B)商店開始營業或休業後再重新開張時常用的吉祥話，有祈求或祝福生意興隆之意(C)早上很早出門、晚上很晚才回來，表示一整天都在外面(D)從容不迫的樣子。故選(C)）", "categories": []}, {"id": "exam172", "stem": "下列「」中的成語哪一個用法正確？", "options": {"A": "他那「欣欣向榮」的一生，聽了真令人嘆為觀止", "B": "只看他才畫幾筆，一匹馬就「別來無恙」，躍然紙上", "C": "他一看到食物就「逍遙自在」地塞入口中，完全忘了應該先洗手", "D": "我讀書做事一路走來，無不「戰戰兢兢」，深怕辜負了父母對我的期盼"}, "answer": "D", "explanation": "12.(A)指草木生長繁盛的樣子。後比喻事物蓬勃發展、繁榮興盛，應改為「多采多姿」(B)指別離至今一切順利平安，通常當作問候語，應改為「栩栩如生」(C)是指自由自在、無拘無束，應改為「迫不及待」(D)形容戒慎恐懼的樣子。故選(D)）", "categories": ["人際溝通表達類", "學習教育類", "文學典故修辭類", "植物花木類"]}, {"id": "exam173", "stem": "「因為參賽的作品水準不夠，我們決定□□□□，第一名從缺。」句中空格可以填入何詞？", "options": {"A": "圖文並茂", "B": "寧缺毋濫", "C": "貫徹始終", "D": "嶔崎磊落"}, "answer": "B", "explanation": "（13.(A)圖畫和文章的品質都非常的優美(B)寧可沒有，也不要不顧品質，只求數量(C)自始至終，澈底實踐(D)比喻人品高潔，有骨氣。故選(B)）", "categories": []}, {"id": "exam174", "stem": "「這位企業家一生□□□□，不斷追求名利，直到晚年才選擇退休。」句中空格最適合填入何詞？", "options": {"A": "樂善好施", "B": "汲汲營營", "C": "功成身退", "D": "如痴如狂"}, "answer": "B", "explanation": "（15.(A)指樂於行善，喜好施捨、濟助他人(B)形容人急切求取名利的樣子(C)功業成就後，就退休歸隱(D)形容人神態失常，到了無法自制的地步。故選(B)）", "categories": ["文學典故修辭類"]}, {"id": "exam175", "stem": "「貫徹始終」指自始至終，澈底實踐，「虎頭蛇尾」指做事有始無終，兩者詞義相反，請問「隨波逐流」與下列何者詞義相反？", "options": {"A": "見風轉舵", "B": "人云亦云", "C": "隨遇而安", "D": "特立獨行"}, "answer": "D", "explanation": "（16.隨波逐流：比喻人沒有確定的方向和目標，只依從環境潮流行事。(A)比喻隨機應變，視情況而行動(B)形容沒有獨自的見解，只會盲從跟隨(C)指能安於所處的環境。亦比喻安於現狀，不思長進(D)行為獨特，不隨俗、不和眾。故選(D)）", "categories": ["人際溝通表達類", "處境際遇做事態度類"]}, {"id": "exam176", "stem": "下列「」中哪一個成語的用法正確？", "options": {"A": "這篇小說故事情節「錯綜複雜」，但作者的敘述清晰，讀來毫不費力", "B": "他不願花時間研究，只憑印象寫報告，這種「貫徹始終」的態度令人擔憂", "C": "這場比賽結果出乎意料，讓觀眾個個「一目了然」，大感驚訝", "D": "他雖然很有才華，但凡事計較得太細，連朋友都說他「樂善好施」"}, "answer": "A", "explanation": "17.(B)「貫徹始終」指自始至終，澈底實踐，應改為「得過且過」(C)「一目了然」指看一眼就完全清楚明白，應改為「出乎意料」(D)「樂善好施」指樂於行善，喜好施捨、濟助他人，應改為「錙銖必較」。故選(A)）", "categories": ["文學典故修辭類"]}, {"id": "exam177", "stem": "「這家百貨公司周年慶大折扣，吸引大量人潮，使賣場內人聲鼎沸，幾乎水洩不通。」句中「人聲鼎沸」一詞可以替換成下列何者？", "options": {"A": "人山人海", "B": "屈指可數", "C": "三三兩兩", "D": "人去樓空"}, "answer": "A", "explanation": "（18.(A)人群如山海般眾多，無法估計，形容人聚集的非常多(B)彎曲手指可計數，形容數量很少(C)形容零散結集的樣子(D)形容畏罪潛逃，不知去向。故選(A)）", "categories": ["文學典故修辭類", "生活器物類", "身體感官類"]}, {"id": "exam178", "stem": "「錙銖必較」及「斤斤計較」都有事事計較的意思，兩者屬於近義詞，請問「喧賓奪主」與下列何者也屬近義詞？", "options": {"A": "棄暗投明", "B": "反客為主", "C": "同流合汙", "D": "粗枝大葉"}, "answer": "B", "explanation": "（19.喧賓奪主：指賓客聲勢強大，占了主人的位置，反客為主。(A)比喻人生道路的抉擇上認清是非，走向光明正道(B)比喻變被動的為主動的或變次要的為主要的(C)指跟壞人一起做壞事(D)比喻疏略，做事不細密。故選(B)）", "categories": ["處境際遇做事態度類", "身體感官類"]}, {"id": "exam179", "stem": "「他是個□□□□的人，叫他做這種精細的工作，恐怕不妥當。」句中空格可以填入何詞？", "options": {"A": "粗枝大葉", "B": "錙銖必較", "C": "嶔崎磊落", "D": "一心一意"}, "answer": "A", "explanation": "（20.(A)比喻疏略，做事不細密(B)連很少的錢或很小的事情都非常計較(C)比喻人品高潔，有骨氣(D)指心意專一，毫無他念。故選(A)）", "categories": ["處境際遇做事態度類"]}, {"id": "exam180", "stem": "下列「」中哪一個成語的用法不恰當？", "options": {"A": "這件案子的牽涉層面太廣，涉及的利益「錯綜複雜」，很難在短時間內解決", "B": "所謂擇善固執，就是我們要有主見，不可隨波逐流", "C": "這場考試對他來說毫無壓力，他應試時「怨天尤人」，輕鬆應對", "D": "這間公司對職員的薪水錙銖必較，請病假也要扣錢"}, "answer": "C", "explanation": "（21.(C)「怨天尤人」比喻面對不如意時，一味地歸咎客觀環境，而不能自我檢討，應改為「從容不迫」，故選(C)）", "categories": ["天文氣象時間類", "處境際遇做事態度類"]}, {"id": "exam181", "stem": "「球賽進入白熱化階段，球迷們在場邊□□□□地為自己支持的隊伍吶喊助威。」句中空格可以填入何詞？", "options": {"A": "如痴如狂", "B": "眼花撩亂", "C": "淋漓盡致", "D": "流連往返"}, "answer": "A", "explanation": "（22.(A)形容人神態失常，到了無法自制的地步(B)形容眼睛昏花，心緒迷亂(C)形容表現生動逼真(D)貪戀沉迷而不願離去。故選(A)）", "categories": []}, {"id": "exam182", "stem": "「花團錦簇」與「五彩繽紛」皆形容豐富多樣，兩者詞義相近，請問「慢條斯理」與下列何者詞義相同？", "options": {"A": "緩不濟急", "B": "好整以暇", "C": "井井有條", "D": "心浮氣躁"}, "answer": "B", "explanation": "（23.「慢條斯理」指從容不迫的樣子。(A)行動或辦法太慢，不能有效處理好急事(B)形容在紛亂、繁忙中顯得從容不迫(C)形容整齊有序，條理分明(D)形容情緒不穩，沉不住氣。故選(B)）", "categories": ["植物花木類", "處境際遇做事態度類"]}, {"id": "exam183", "stem": "「把垃圾分類，既可減少垃圾量，又能資源回收，真是一舉兩得。」句中「一舉兩得」一詞可以替換成下列何者？", "options": {"A": "一箭雙鵰", "B": "顧此失彼", "C": "喧賓奪主", "D": "寧缺毋濫"}, "answer": "A", "explanation": "（24.(A)比喻一次舉動，可以同時達成兩個目標(B)指做事時不能全面兼顧(C)指賓客聲勢強大，占了主人的位置，反客為主(D)寧可沒有，也不要不顧品質，只求數量。故選(A)）", "categories": ["文學典故修辭類", "身體感官類"]}, {"id": "exam184", "stem": "下列「」中哪一個成語的用法不恰當？", "options": {"A": "他高妙的彈奏技巧，把這首曲子的意境表現得「淋漓盡致」", "B": "他為人慷慨，經常捐款幫助貧困學生，大家都讚譽他「樂善好施」", "C": "這張設計圖畫得十分簡單，即使外行人看了也會「一目了然」", "D": "這個計畫剛開始推動，就因為預算問題被迫中止，真可謂「貫徹始終」"}, "answer": "D", "explanation": "25.(D)「貫徹始終」指自始至終，澈底實踐，應改為「半途而廢」，故選(D)）", "categories": ["文學典故修辭類"]}];
