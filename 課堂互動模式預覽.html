<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>課堂互動模式</title>
  <style>

  :root {
    --primary: #ff6b5b;       /* 珊瑚橘 */
    --primary-dark: #e85142;
    --primary-light: #ffe9e4;
    --accent: #2ec4b6;        /* 薄荷綠 */
    --accent-light: #e2fbf6;
    --sunny: #ffc145;         /* 陽光黃 */
    --sunny-light: #fff5df;
    --danger: #f0544a;
    --ok: #16a893;
    --bg: #fffaf3;
    --text: #33302e;
    --muted: #8a8378;
    --border: #f2e4d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 6% 8%, var(--sunny-light) 0%, transparent 40%),
      radial-gradient(circle at 96% 92%, var(--accent-light) 0%, transparent 40%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.6;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 4px 0 4px; color: var(--primary-dark); }
  h2 { font-size: 18px; margin: 0 0 12px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 6px 18px rgba(255, 107, 91, 0.08);
    animation: cardIn .35s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  label { display: block; font-weight: 700; margin: 14px 0 6px; font-size: 14px; }
  input[type=text] {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 15px; transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light);
  }
  textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 15px; font-family: inherit; resize: vertical;
  }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .chip {
    border: 1.5px solid var(--border); border-radius: 999px; padding: 7px 14px;
    font-size: 13.5px; cursor: pointer; background: #fff; user-select: none;
    transition: transform .12s ease, background .15s, border-color .15s, color .15s;
  }
  .chip:active { transform: scale(.93); }
  .chip.selected {
    background: var(--primary); color: #fff; border-color: var(--primary);
    animation: pop .28s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .mode-group { display: flex; gap: 10px; margin-top: 4px; }
  .mode-card {
    flex: 1; border: 2px solid var(--border); border-radius: 14px; padding: 12px;
    cursor: pointer; text-align: center; font-size: 14px;
    transition: transform .12s ease, border-color .15s, background .15s;
  }
  .mode-card:active { transform: scale(.97); }
  .mode-card b { display: block; margin-bottom: 4px; font-size: 15px; }
  .mode-card.selected {
    border-color: var(--primary); background: var(--primary-light);
    animation: pop .28s ease;
  }
  select {
    padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px;
  }
  input[type=number] {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 15px;
  }
  .sub-panel {
    border: 1.5px dashed var(--accent); border-radius: 14px; padding: 14px;
    margin-top: 10px; background: var(--accent-light);
  }
  .timer-box {
    display: none; text-align: center; font-size: 22px; font-weight: 800;
    color: var(--primary-dark); background: var(--sunny-light); border-radius: 12px;
    padding: 8px; margin-bottom: 14px; transition: color .2s, background .2s;
  }
  .timer-box.timer-warn { color: #fff; background: var(--danger); animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { opacity: 1; transform: scale(1); } to { opacity: .7; transform: scale(1.04); } }
  button.primary {
    display: block; width: 100%; padding: 13px; margin-top: 18px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 14px rgba(232, 81, 66, 0.3);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  button.primary:active { transform: translateY(1px) scale(.98); box-shadow: 0 3px 8px rgba(232, 81, 66, 0.28); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
  button.secondary {
    padding: 10px 16px; background: #fff; color: var(--primary-dark); border: 1.5px solid var(--primary);
    border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform .12s ease, background .15s;
  }
  button.secondary:active { transform: scale(.96); background: var(--primary-light); }
  button.ghost {
    padding: 8px 12px; background: transparent; color: var(--muted); border: 1.5px dashed var(--border);
    border-radius: 10px; font-size: 13px; cursor: pointer; transition: transform .12s ease, border-color .15s, color .15s;
  }
  button.ghost:active { transform: scale(.95); }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  .progress { font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .bar { height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, var(--sunny), var(--primary)); transition: width .4s ease; }
  .stem-label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stem { font-size: 19px; font-weight: 700; margin-bottom: 18px; }
  .opt {
    display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 10px;
    border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-size: 15px;
    cursor: pointer; transition: transform .1s ease, border-color .15s, background .15s;
  }
  .opt:active { transform: scale(.98); }
  .opt .letter {
    display: inline-block; width: 22px; height: 22px; line-height: 22px; text-align: center;
    border-radius: 50%; background: var(--primary-light); color: var(--primary-dark); font-size: 12px;
    font-weight: 700; margin-right: 8px;
  }
  .opt.correct { border-color: var(--ok); background: var(--accent-light); animation: pop .3s ease; }
  .opt.wrong { border-color: var(--danger); background: #fdeceb; animation: shake .4s ease; }
  .opt.selected { border-color: var(--accent); background: var(--accent-light); }
  .opt.disabled { pointer-events: none; opacity: .85; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  .select-note {
    margin-top: 4px; font-size: 13px; color: var(--accent); font-weight: 600; display: none;
  }
  .hint-box {
    margin-top: 6px; font-size: 13.5px; color: #b5722a; background: var(--sunny-light);
    border: 1px dashed var(--sunny); border-radius: 10px; padding: 10px 12px; display: none;
  }
  .feedback {
    margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; display: none; font-weight: 600;
  }
  .feedback.correct { background: var(--accent-light); color: var(--ok); }
  .feedback.wrong { background: #fdeceb; color: var(--danger); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .score-big { font-size: 44px; font-weight: 800; color: var(--primary-dark); text-align: center; margin: 6px 0; }
  .score-sub { text-align: center; color: var(--muted); margin-bottom: 18px; font-size: 14px; }
  .review-item { border-bottom: 1px solid var(--border); padding: 14px 0; }
  .review-item:last-child { border-bottom: none; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; font-weight: 700; }
  .tag.right { background: var(--accent-light); color: var(--ok); }
  .tag.wrong { background: #fdeceb; color: var(--danger); }
  .review-q { font-weight: 700; margin-bottom: 6px; }
  .review-line { font-size: 13.5px; color: var(--muted); margin: 2px 0; }
  .review-line b { color: var(--text); }
  .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 20px; }
  .banner {
    background: var(--sunny-light); border-radius: 12px; padding: 10px 14px; font-size: 13px;
    color: #8a5a12; margin-bottom: 14px; font-weight: 600;
  }

  /* ============ 慶祝彩帶效果（答對用） ============ */
  .confetti-piece {
    position: fixed; top: -10px; width: 8px; height: 14px; opacity: .95;
    pointer-events: none; z-index: 999; border-radius: 2px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(540deg); opacity: 0; }
  }

  /* ============ 課堂互動模式專用樣式 ============ */
  .draw-stage {
    text-align: center; padding: 26px 12px; border-radius: 16px;
    background: linear-gradient(135deg, var(--sunny-light), var(--accent-light));
    margin: 12px 0;
  }
  .draw-name {
    font-size: 40px; font-weight: 800; color: var(--primary-dark);
    min-height: 54px;
  }
  .draw-name.rolling { animation: rollFade .08s linear infinite; }
  @keyframes rollFade { 0% { opacity: .5; } 50% { opacity: 1; } 100% { opacity: .5; } }
  .link-box {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
    background: var(--accent-light); border-radius: 10px; padding: 10px 12px;
    font-size: 13px; word-break: break-all;
  }
  .link-box input {
    flex: 1; border: none; background: transparent; font-size: 13px; color: var(--text);
  }

</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 課堂互動模式</h1>
  <div class="sub">投影用：抽題目、抽學生，或一鍵出一份小測驗給全班</div>

  <div id="screen-login" class="card">
    <label>教師密碼</label>
    <input type="text" id="in-pass" placeholder="請輸入密碼">
    <button class="primary" id="btn-login">進入</button>
    <div id="login-msg" class="sub" style="margin-top:10px;"></div>
  </div>

  <div id="screen-main" style="display:none">

    <!-- ========== 學生名單 ========== -->
    <div class="card">
      <h2>👥 班級名單</h2>
      <div class="sub">一行一個名字（或用逗號分隔），存起來下次打開還在。</div>
      <textarea id="roster-text" rows="4" placeholder="例：王小明、陳小華、李小美..."></textarea>
      <button class="secondary" id="btn-save-roster" style="margin-top:10px;">💾 儲存名單</button>
      <span class="sub" id="roster-count" style="margin-left:10px;"></span>
    </div>

    <!-- ========== 抽題＋抽人 ========== -->
    <div class="card">
      <h2>🎲 抽題＋抽人</h2>
      <label>抽題範圍（可複選，不選則為全部）</label>
      <div class="chip-group" id="draw-category-chips"></div>

      <div class="row" style="margin-top:14px;">
        <button class="primary" id="btn-draw-question" style="margin-top:0;">🎲 抽一題</button>
        <button class="primary" id="btn-draw-student" style="margin-top:0;">🙋 抽學生</button>
      </div>

      <div class="draw-stage" id="question-stage" style="display:none;">
        <div class="stem-label" id="draw-stem-label" style="text-align:left;"></div>
        <div class="stem" id="draw-stem" style="text-align:left;"></div>
        <div id="draw-options" style="text-align:left;"></div>
        <button class="secondary" id="btn-reveal-answer">👀 顯示答案</button>
        <div class="review-line" id="draw-explanation" style="display:none;text-align:left;margin-top:10px;"></div>
      </div>

      <div class="draw-stage" id="student-stage" style="display:none;">
        <div class="sub">被抽中的是……</div>
        <div class="draw-name" id="draw-name">？</div>
      </div>
    </div>

    <!-- ========== 一鍵出題給全班 ========== -->
    <div class="card">
      <h2>📋 一鍵出一份小測驗給全班</h2>
      <div class="sub">全班點進同一個連結，會拿到完全一樣的題目，方便一起檢討。</div>
      <label>類別（可複選，不選則為全部）</label>
      <div class="chip-group" id="quiz-category-chips"></div>
      <label>題數（5～20 題）</label>
      <input type="number" id="quiz-count" min="5" max="20" value="10">
      <button class="primary" id="btn-generate-link">📋 產生班級測驗連結</button>
      <div class="link-box" id="link-box" style="display:none;">
        <input type="text" id="link-output" readonly>
        <button class="secondary" id="btn-copy-link">複製</button>
      </div>
      <div class="sub" id="copy-msg" style="margin-top:6px;"></div>
    </div>

  </div>

  <div class="footer-note">
    <a href="teacher.html">← 回教師端查看成績</a>　·　<a href="index.html">學生測驗頁</a>
  </div>
</div>

<script>

// ============================================================

]}, {"i": "夢寐以求", "d": "睡夢中都在尋找、追求。形容願望強烈、迫切。", "c": ["情感心理類"]}, {"i": "大動干戈", "d": "原指雙方交戰激烈，後多用來比喻行事大肆聲張、勞師動眾或大費手腳。", "c": ["文學典故修辭類"]}, {"i": "大家閨秀", "d": "出身於世家貴族，有教養、有風範的未婚女子。", "c": ["人物形象類"]}, {"i": "大獲全勝", "d": "打敗對手或敵人，獲得全面性的勝利。", "c": ["文學典故修辭類"]}, {"i": "大發雷霆", "d": "盛怒時大聲斥責，聲如雷霆，令人驚恐。形容大發脾氣，大聲責罵。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "大筆如椽", "d": "用以稱揚著名作品、作家或寫作才能極高。椽，音ㄔㄨㄢˊ。", "c": ["學習教育類"]}, {"i": "大紅大紫", "d": "形容聲名顯赫。", "c": ["顏色類"]}, {"i": "大義滅親", "d": "指為了維護公理正義，不徇私情，滅了犯罪的親人，或讓他們接受法律制裁。", "c": ["情感心理類"]}, {"i": "大而化之", "d": "形容人做事不謹慎、不細心、不拘小節。", "c": ["品格修養類"]}, {"i": "大聲疾呼", "d": "大聲而急促的呼喊，以引起人們的注意。引申為大力的提倡、號召。", "c": ["身體感官類"]}, {"i": "大腹便便", "d": "大肚子顯得肥胖而凸出的樣子。", "c": ["身體感官類"]}, {"i": "大隱朝市", "d": "真正有心隱居的人，雖處鬧市中，仍不改其心志。", "c": ["品格修養類"]}, {"i": "大雨傾盆", "d": "形容雨勢大又急，像從盆中傾倒出來一樣。", "c": ["天文氣象時間類"]}, {"i": "天倫之樂", "d": "家人團聚時的歡樂。", "c": ["情感心理類"]}, {"i": "天各一方", "d": "形容分離後各居一地，相隔遙遠。", "c": ["品格修養類"]}, {"i": "天崩地裂", "d": "形容巨大的聲音。", "c": ["文學典故修辭類"]}, {"i": "天差地遠", "d": "形容差別很大、相差甚遠。", "c": ["處境際遇做事態度類"]}, {"i": "天涯海角", "d": "形容偏僻或相距遙遠的地方。", "c": ["天文氣象時間類"]}, {"i": "天真無邪", "d": "性情率直、真誠，毫無邪念。", "c": ["人物形象類"]}, {"i": "天真爛漫", "d": "形容性情率真，毫不假飾。", "c": ["人物形象類", "品格修養類"]}, {"i": "天經地義", "d": "指天地間理所當然而不能改變的道理。", "c": ["天文氣象時間類"]}, {"i": "天網恢恢", "d": "比喻犯法者難逃國法制裁。", "c": ["天文氣象時間類"]}, {"i": "天羅地網", "d": "比喻防範極為嚴密，無法逃脫。", "c": ["天文氣象時間類"]}, {"i": "天花亂墜", "d": "形容說話動聽，但多浮誇不切實際。", "c": ["人際溝通表達類", "植物花木類"]}, {"i": "天衣無縫", "d": "比喻詩文渾然天成，沒有斧鑿痕跡；亦用於比喻事物或計畫周密完美，沒有一絲破綻或缺點。", "c": ["天文氣象時間類"]}, {"i": "天造地設", "d": "天然所成就的事物。形容人或事物彼此配合得自然得體，渾然天成。", "c": ["天文氣象時間類"]}, {"i": "天長地久", "d": "形容時間悠遠長久。", "c": ["天文氣象時間類"]}, {"i": "天馬行空", "d": "比喻文才氣勢豪放不拘，亦用於形容浮誇不著邊際。", "c": ["天文氣象時間類", "處境際遇做事態度類"]}, {"i": "失之毫釐，差之千里", "d": "指差距雖然極細微，但導致的差誤、錯誤卻極大。", "c": ["文學典故修辭類"]}, {"i": "夾槍帶棒", "d": "言語中暗藏諷刺。", "c": ["人際溝通表達類"]}, {"i": "奇貨可居", "d": "比喻利用某種專長或有價值的東西以謀利。", "c": ["文學典故修辭類", "生活器物類"]}, {"i": "奉公守法", "d": "以公事為重，謹守法紀，不徇私舞弊。", "c": ["處境際遇做事態度類"]}, {"i": "奮不顧身", "d": " ": "兒子繼承父親事業。", "c": ["情感心理類"]}, {"i": "子種蓮房", "d": "用於祝賀人得子的賀辭。", "c": ["植物花木類"]}, {"i": "孔席不暖", "d": "形容熱心濟世，奔波勞碌。", "c": ["文學典故修辭類"]}, {"i": "孔武有力", "d": "勇敢而力大。", "c": ["身體感官類"]}, {"i": "字字珠璣", "d": "形容句子或文章中遣詞用字非常優美。", "c": ["學習教育類", "生活器物類"]}, {"i": "孜孜不倦", "d": "指勤勉而不知疲倦。", "c": ["學習教育類", "處境際遇做事態度類"]}, {"i": "孟母三遷", "d": "形容家長為教育子女，選擇良好的學習環境所花的苦心。", "c": ["情感心理類"]}, {"i": "孤軍奮戰", "d": "①孤立無援的軍隊奮力作戰。②比喻一個人單獨奮鬥。", "c": ["戰爭軍事類"]}, {"i": "孤陋寡聞", "d": "形容學識淺薄，見聞不廣。", "c": ["景物環境類"]}, {"i": "孤雲野鶴", "d": "比喻閒逸自在，不求名利的隱士。", "c": ["品格修養類"]}, {"i": "學以致用", "d": "將學得的知識運用到實際生活或工作當中。", "c": ["學習教育類"]}, {"i": "學如穿井", "d": "作學問就如同鑿井，愈深入愈艱難，能堅持到底，始有泉水湧出的收穫。", "c": ["學習教育類"]}, {"i": "學如逆水行舟", "d": "比喻為學的艱難。用以告誡人學習應抱著嚴謹、持恆的態度，不可輕忽怠慢。", "c": ["學習教育類"]}, {"i": "學富五車", "d": "讀過的書可以裝滿五大車。形容人書讀很多，學識廣博。", "c": ["學習教育類", "文學典故修辭類"]}, {"i": "學無常師", "d": "指善於學習的人，知道該向不同專長的人請教不同的學問。", "c": ["學習教育類"]}, {"i": "學無止境", "d": "研究學問沒有終止的時候。", "c": ["學習教育類"]}, {"i": "學然後知不足", "d": "入門學習之後，才發現自己的知識還不完備。", "c": ["學習教育類"]}, {"i": "孺子可教", "d": "指年輕人可以教誨栽培。用於稱許之意。", "c": ["人物形象類", "學習教育類"]}, {"i": "孺慕之情", "d": "本指小兒之愛慕父母，後多指對人或事深切依戀愛慕。", "c": ["情感心理類"]}, {"i": "守口如瓶", "d": "嘴像瓶口一樣封得很嚴緊。比喻嚴守祕密。", "c": ["生活器物類"]}, {"i": "守株待兔", "d": "比喻拘泥守成。亦比喻妄想不勞而獲或等著目標自己送上門來。典出韓非子五蠹。", "c": ["文學典故修辭類"]}, {"i": "安之若素", "d": "在反常或危困等情況下，仍安然處之，毫不在意。", "c": ["情感心理類"]}, {"i": "安步當車", "d": "比喻安貧樂賤。也形容態度悠閒從容。", "c": ["天文氣象時間類"]}, {"i": "完璧歸趙", "d": "比喻物歸原主。", "c": ["文學典故修辭類"]}, {"i": "室如懸磬", "d": "指居室空無所有，比喻非常貧窮。", "c": ["景物環境類"]}, {"i": "宰相肚裡好撐船", "d": "比喻人胸襟度量寬大，不計前嫌。", "c": ["生活器物類"]}, {"i": "宵衣旰食", "d": "天未明就披衣起床，日暮才進食。形容勤於政事。", "c": ["生活器物類"]}, {"i": "家徒四壁", "d": "形容家境極為貧困。", "c": ["景物環境類"]}, {"i": "寅吃卯糧", "d": "比喻入不敷出，預支以後的用項。", "c": ["生活器物類"]}, {"i": "富麗堂皇", "d": "形容富偉美麗、氣勢宏偉。", "c": ["景物環境類"]}, {"i": "寓教於樂", "d": "在娛樂中寄託教育的作用。", "c": ["學習教育類"]}, {"i": "察言觀色", "d": "觀察人的言語神情而窺知對方心意。", "c": ["文學典故修辭類"]}, {"i": "寡廉鮮恥", "d": "缺乏廉恥之心。比喻不知羞恥。", "c": ["品格修養類"]}, {"i": "寢食難安", "d": "睡覺和吃飯都不安心。形容憂慮煩亂的樣子。", "c": ["生活器物類"]}, {"i": "寥寥若晨星", "d": "形容數量稀少。", "c": ["天文氣象時間類"]}, {"i": "寥若晨星", "d": "形容數量稀少。", "c": ["文學典故修辭類"]}, {"i": "實至名歸", "d": "有真才實學的人，不求名而名自至。", "c": ["文學典故修辭類"]}, {"i": "寧為雞口，不為牛後", "d": "比喻寧願在小場面中作主，不願在大場面聽人支配。", "c": ["動物類"]}, {"i": "寸草春暉", "d": "比喻父母恩情深重，子女難以報答。寸草，小草，比喻子女。春暉，春天的陽光，比喻父母恩情。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "專心致志", "d": "專一心思，集中精神。", "c": ["處境際遇做事態度類"]}, {"i": "尋幽訪勝", "d": "尋找訪求景色清雅的地方。", "c": ["景物環境類"]}, {"i": "對牛彈琴", "d": "相傳古人公明儀曾為牛彈琴，但牛依然低頭而食，聽而不聞，因為人類的音樂，對牛而言並不適合。後比喻對不懂道理的人講道理或講話不看對象。", "c": ["動物類", "文學典故修辭類"]}, {"i": "對酒當歌", "d": "原用以感嘆人生苦短，要及時有所作為。後亦指應當及時行樂。", "c": ["生活器物類"]}, {"i": "小家碧玉", "d": "指平常人家年輕貌美的少女。", "c": ["人物形象類"]}, {"i": "小心翼翼", "d": "形容舉止十分謹慎，不敢懈怠疏忽。", "c": ["品格修養類"]}, {"i": "小時了了", "d": "人在幼年時聰慧敏捷。", "c": ["天文氣象時間類", "文學典故修辭類"]}, {"i": "小題大做", "d": "比喻人將小事視為大事辦理，有故意誇張的意思。", "c": ["文學典故修辭類"]}, {"i": "小鳥依人", "d": "形容依傍他人而嬌弱可愛的樣子，多用於女子或小孩。", "c": ["動物類"]}, {"i": "少年老成", "d": "年紀雖輕，舉止卻成熟穩重，辦事老練。", "c": ["人物形象類"]}, {"i": "尖嘴猴腮", "d": "形容人長相極為醜陋。", "c": ["文學典故修辭類"]}, {"i": "尖嘴薄舌", "d": "形容說話尖銳刻薄。", "c": ["身體感官類"]}, {"i": "就地正法", "d": "在犯罪所在地執行死刑。", "c": ["處境際遇做事態度類"]}, {"i": "屈指可數", "d": "彎曲手指可計數，形容數量很少。", "c": ["身體感官類"]}, {"i": "層巒疊嶂", "d": "山峰重疊，連綿不斷。", "c": ["景物環境類"]}, {"i": "山明水秀", "d": "形容山水秀麗，風景優美。", "c": ["景物環境類"]}, {"i": "山珍海味", "d": "泛指豐盛的食物。", "c": ["生活器物類"]}, {"i": "山雨欲來", "d": "形容重大事件發生前的緊張情勢。", "c": ["天文氣象時間類"]}, {"i": "山雨欲來風滿樓", "d": "比喻事件發生前的徵兆或氣氛。", "c": ["生活器物類"]}, {"i": "左右開弓", "d": "①形容雙手同時或輪流做某一動作。②傳統武術的招式名稱。③形容雙掌摑打兩頰的姿勢。", "c": ["戰爭軍事類"]}, {"i": "巧奪天工", "d": "雖然是人工所製，但是精巧勝過天然。形容技藝巧妙。", "c": ["天文氣象時間類"]}, {"i": "巧婦難為無米之炊", "d": "比喻即使非常靈巧的人，做事缺乏必要條件，也難以完成。", "c": ["處境際遇做事態度類"]}, {"i": "差強人意", "d": "比喻雖然不夠好，但大體上還能讓人滿意。", "c": ["處境際遇做事態度類"]}, {"i": "巾幗英雄", "d": "女性英雄。", "c": ["人物形象類"]}, {"i": "巾幗鬚眉", "d": "女中丈夫。指性格豪爽，有男子氣概的女子。", "c": ["人物形象類"]}, {"i": "布衣之交", "d": "①貧賤時所交往的朋友。或比喻患難知己的朋友。②平民之間相互的交往。③有官位者與平民的交往。", "c": ["情感心理類"]}, {"i": "幡然悔悟", "d": "澈底的悔改、醒悟。幡，音ㄈㄢ。", "c": ["情感心理類"]}, {"i": "平分秋色", "d": "指中秋時分。亦用於指平均分配好處。亦用於形容二者一樣出色，分不出高下。", "c": ["天文氣象時間類"]}, {"i": "平步青雲", "d": "比喻順利無阻，迅速晉升高位。", "c": ["顏色類"]}, {"i": "年高德劭", "d": "指年紀大而品德好。", "c": ["品格修養類"]}, {"i": "庖丁解牛", "d": "比喻對事物瞭解透澈，做事能得心應手，運用自如。庖丁，廚師。", "c": ["動物類"]}, {"i": "廢寢忘食", "d": "形容專心努力工作或學習。", "c": ["學習教育類", "處境際遇做事態度類"]}, {"i": "延頸企踵", "d": "伸長脖子，踮起腳跟。形容熱切期望的樣子。", "c": ["情感心理類"]}, {"i": "弋不射宿", "d": "指不射殺已歸巢的鳥。比喻對自然萬物，取之有時，用之有節。弋，以繩子繫箭而射。", "c": ["戰爭軍事類"]}, {"i": "引人側目", "d": "引來他人斜視的目光。常指不好的事情。", "c": ["身體感官類"]}, {"i": "弱不禁風", "d": "柔弱得禁不起風吹。", "c": ["身體感官類"]}, {"i": "張口結舌", "d": "形容恐懼慌張，或理屈說不出話的樣子。", "c": ["身體感官類"]}, {"i": "強幹弱枝", "d": "比喻強化根本主權力量，削弱分歧的勢力。", "c": ["植物花木類"]}, {"i": "強弩之末", "d": "比喻原本強大的力量已經衰竭，不能再發揮效用。", "c": ["戰爭軍事類", "文學典故修辭類"]}, {"i": "彈丸之地", "d": "比喻狹小的地方。", "c": ["文學典故修辭類"]}, {"i": "彈指之間", "d": "○1形容極短暫的時間。○2形容時間過的很快。", "c": ["天文氣象時間類", "身體感官類"]}, {"i": "形形色色", "d": "各色各樣，種類很多。", "c": ["其他", "文學典故修辭類"]}, {"i": "形銷骨立", "d": "形容人極其瘦弱。", "c": ["身體感官類"]}, {"i": "彪形大漢", "d": "形容身材高大，健壯如虎的男子。", "c": ["身體感官類"]}, {"i": "待價而沽", "d": "等待較好的價錢才賣出。比喻人等待良機，為世所用。後亦用來比喻商品等待買主出高價買下。", "c": ["文學典故修辭類", "生活器物類"]}, {"i": "後悔莫及", "d": "事後懊悔，已來不及了。表示事情無法挽回。", "c": ["情感心理類"]}, {"i": "後生可畏", "d": "年輕人每每能超越先輩，令人敬畏。", "c": ["文學典故修辭類"]}, {"i": "徒費脣舌", "d": "浪費言詞，無濟於事。", "c": ["身體感官類"]}, {"i": "得天獨厚", "d": "獨得上天的厚愛，具有特別優越的天然條件。多用於形容人的天賦、社會條件，或是地方的自然環境特別優越。", "c": ["天文氣象時間類"]}, {"i": "得心應手", "d": "心裡怎麼想，手便能怎麼做。比喻技藝熟練，運用自如。後亦用來比喻做事順利。", "c": ["身體感官類"]}, {"i": "得魚忘筌", "d": "筌，捕魚用的竹器。比喻人在達到目的成功後就忘掉賴以成功的手段或憑藉物。", "c": ["動物類"]}, {"i": "循循善誘", "d": "指循序漸進的誘導。", "c": ["學習教育類"]}, {"i": "德高望重", "d": "形容人品德高尚，極有聲望。", "c": ["品格修養類"]}, {"i": "心力交瘁", "d": "精神和體力都已疲弊。比喻非常勞苦。", "c": ["情感心理類"]}, {"i": "心曠神怡", "d": "心情開朗，精神愉悅。", "c": ["情感心理類"]}, {"i": "心狠手辣", "d": "心腸狠毒，手段殘忍。", "c": ["身體感官類"]}, {"i": "心直口快", "d": "個性直率，說話不隱諱。", "c": ["人際溝通表達類", "品格修養類"]}, {"i": "心領神會", "d": "不必經由言行的表達，心裡便已明白。", "c": ["人際溝通表達類"]}, {"i": "志同道合", "d": "彼此的志趣和理想一致。", "c": ["情感心理類"]}, {"i": "忘年之交", "d": "不拘年歲行輩而結交為友。", "c": ["情感心理類"]}, {"i": "忙裡偷閒", "d": "在忙碌中抽空來娛樂。", "c": ["天文氣象時間類"]}, {"i": "忠孝兩全", "d": "盡忠國家和孝順父母兩者都能兼顧。", "c": ["品格修養類"]}, {"i": "忠孝節義", "d": "對國家盡忠，對父母盡孝，對夫妻盡節，對朋友盡義。", "c": ["品格修養類"]}, {"i": "忠心耿耿", "d": "形容極為忠誠。", "c": ["品格修養類"]}, {"i": "忠肝義膽", "d": "赤膽忠心，見義勇為。", "c": ["品格修養類"]}, {"i": "忠臣孝子", "d": "忠君愛國、善事父母的人。", "c": ["品格修養類"]}, {"i": "忠貞不渝", "d": "忠誠堅貞，永不改變。", "c": ["品格修養類"]}, {"i": "念念不忘", "d": "心裡時時刻刻惦記著。", "c": ["回憶往事類"]}, {"i": "念茲在茲", "d": "指對某人或某事牢記在心，念念不忘。", "c": ["回憶往事類"]}, {"i": "怒火中燒", "d": "心中升起熊烈的怒火。形容非常憤怒。", "c": ["情感心理類"]}, {"i": "怒目而視", "d": "因發怒而圓睜兩眼瞪視對方。", "c": ["情感心理類"]}, {"i": "怒髮衝冠", "d": "憤怒得頭髮直豎頂起帽子。形容盛怒的樣子。", "c": ["情感心理類", "文學典故修辭類"]}, {"i": "急不可耐", "d": "急得不能再等，形容十分急切。", "c": ["情感心理類"]}, {"i": "急公好義", "d": "熱心公益，喜愛助人。", "c": ["品格修養類"]}, {"i": "急如星火", "d": "如流星的光那樣急速，形容情勢急迫。", "c": ["天文氣象時間類", "文學典故修辭類"]}, {"i": "急管繁弦", "d": "形容音樂節拍快速，音色豐富多變。後亦用以比喻各種繁雜的聲音。", "c": ["生活器物類"]}, {"i": "怨天尤人", "d": "抱怨上天，責怪他人。比喻面對不如意時，一味地歸咎客觀環境，而不能自我檢討。", "c": ["天文氣象時間類"]}, {"i": "怵目驚心", "d": "眼見可怕的情景，使內心驚恐不已。引申為感到事態、問題極其嚴重。", "c": ["身體感官類"]}, {"i": "恃才傲物", "d": "依仗本身有才幹而驕傲，目空一切。", "c": ["品格修養類"]}, {"i": "恩同再造", "d": "恩情如同給予重生般的深重。", "c": ["情感心理類"]}, {"i": "恩同父母", "d": "如同父母對子女般的恩情。形容恩德極為深厚。", "c": ["情感心理類"]}, {"i": "恩重如山", "d": "形容恩德極重。", "c": ["情感心理類"]}, {"i": "悔過自懺", "d": "後悔自己所犯的過失，並且感到自責、慚愧。懺，音ㄔㄢˋ。", "c": ["情感心理類"]}, {"i": "悠哉悠哉", "d": "比喻悠閒自得。", "c": ["天文氣象時間類"]}, {"i": "悠然自得", "d": "神態從容，心情閒適的樣子。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "患得患失", "d": "形容人的得失心很重，在沒得到以前怕得不到，得到以後又怕失去。", "c": ["文學典故修辭類"]}, {"i": "患難之交", "d": "共同經歷困苦艱難而互相扶持的好朋友。", "c": ["情感心理類"]}, {"i": "悲天憫人", "d": "憂傷時局多變，哀憐百姓疾苦。", "c": ["天文氣象時間類"]}, {"i": "悲痛欲絕", "d": "形容傷心哀痛到了極點。", "c": ["情感心理類"]}, {"i": "情不自禁", "d": "感情激動得無法自我控制。", "c": ["情感心理類"]}, {"i": "情投意合", "d": "情感融洽，心意相通。", "c": ["情感心理類"]}, {"i": "惱羞成怒", "d": "因羞愧到極點而惱恨發怒。", "c": ["情感心理類"]}, {"i": "愁眉不展", "d": "雙眉緊鎖，很憂愁的樣子。", "c": ["情感心理類"]}, {"i": "愁眉苦臉", "d": "形容憂傷、愁苦的神色。", "c": ["文學典故修辭類", "身體感官類"]}, {"i": "意到筆隨", "d": "形容文思敏捷，得心應手。", "c": ["學習教育類"]}, {"i": "意氣用事", "d": "處理事務但憑情緒，缺乏理智。", "c": ["情感心理類"]}, {"i": "愚公移山", "d": "比喻努力不懈，終能達成目標。或比喻效率不佳。", "c": ["品格修養類", "處境際遇做事態度類"]}, {"i": "愛之欲其生，惡之欲其死", "d": "喜愛一個人的時候就百般呵護希望他長壽，等到不愛他的時候就希望他死。指人陷於情緒，愛惡無定。", "c": ["情感心理類"]}, {"i": "愛人如己", "d": "善待他人就像愛惜自己一般。", "c": ["情感心理類"]}, {"i": "愛屋及烏", "d": "比喻愛一個人也連帶地關愛與他有關的一切。", "c": ["情感心理類"]}, {"i": "愛恨交織", "d": "愛與恨的情緒互相交連錯雜在一起。喻心情矛盾。", "c": ["情感心理類"]}, {"i": "愛惜羽毛", "d": "比喻自重、愛惜自己的聲譽。", "c": ["情感心理類"]}, {"i": "愛憎分明", "d": "喜好和憎惡的態度十分明確。", "c": ["情感心理類"]}, {"i": "愛莫能助", "d": "指內心雖然同情，想要幫助卻無能為力。", "c": ["情感心理類"]}, {"i": "感人肺腑", "d": "形容使人深受感動。肺腑，比喻內心深處。", "c": ["情感心理類"]}, {"i": "感恩圖報", "d": "感激他人的恩德而設法報答。", "c": ["情感心理類"]}, {"i": "感恩戴德", "d": "感激他人對自己的恩德。", "c": ["情感心理類"]}, {"i": "感激不盡", "d": "感激至深。", "c": ["情感心理類"]}, {"i": "感激涕零", "d": "感激落淚，形容非常感謝。", "c": ["情感心理類"]}, {"i": "慈烏反哺", "d": "烏鴉雛鳥長大後，知銜食哺養母鳥。比喻子女報答父母的養育之恩。", "c": ["情感心理類"]}, {"i": "慎思明辨", "d": "謹慎的考慮並且分辨清楚。", "c": ["品格修養類"]}, {"i": "慎謀能斷", "d": "凡事細密的策畫，謹慎的謀慮，並能夠當機立斷。", "c": ["品格修養類"]}, {"i": "慘綠少年", "d": "指風度翩翩、意氣風發的青年才俊，或用來指徬徨苦惱的少年。", "c": ["人物形象類", "顏色類"]}, {"i": "慷慨激昂", "d": "志氣高昂，情緒激揚。", "c": ["情感心理類"]}, {"i": "應接不暇", "d": "比喻事情繁忙，難以應付。", "c": ["文學典故修辭類"]}, {"i": "懷珠抱玉", "d": "比喻人具有高潔的品格及傑出的才能。", "c": ["品格修養類"]}, {"i": "懷瑾握瑜", "d": "比喻懷有高貴的美德與才能。", "c": ["品格修養類"]}, {"i": "懸壺濟世", "d": "代稱行醫救人。", "c": ["其他", "生活器物類"]}, {"i": "懸崖勒馬", "d": "比喻到了危險的邊緣而及時回頭。", "c": ["其他"]}, {"i": "懸梁刺股", "d": "比喻人發憤努力學習。", "c": ["其他", "學習教育類"]}, {"i": "成人之美", "d": "成全別人的好事。", "c": ["文學典故修辭類"]}, {"i": "戛戛然而止", "d": "形容突然停止。", "c": ["身體感官類"]}, {"i": "截長補短", "d": "取有餘以補不足。", "c": ["文學典故修辭類"]}, {"i": "戰戰兢兢", "d": "形容戒慎恐懼的樣子。", "c": ["文學典故修辭類"]}, {"i": "戶限為穿", "d": "形容來訪人數眾多。", "c": ["其他"]}, {"i": "所向披靡", "d": "比喻力量所到之處，敵人紛紛潰敗逃散。", "c": ["戰爭軍事類"]}, {"i": "手不釋卷", "d": "形容人勤奮好學。", "c": ["學習教育類", "身體感官類"]}, {"i": "手忙腳亂", "d": "形容做事慌亂，失了條理。亦可形容十分忙碌的樣子。", "c": ["身體感官類"]}, {"i": "手無寸鐵", "d": "形容手上沒有拿任何武器。", "c": ["身體感官類"]}, {"i": "手足之情", "d": "兄弟間的情分。", "c": ["情感心理類"]}, {"i": "手足無措", "d": "形容人惶恐不安，不知如何是好。", "c": ["身體感官類"]}, {"i": "才德兼備", "d": "兼具才華和品德。", "c": ["品格修養類"]}, {"i": "才疏學淺", "d": "才能駑下，學識淺薄。多用作自謙之詞。", "c": ["學習教育類"]}, {"i": "打秋風", "d": "向富有的人抽取小利，或藉故向人求取財物。", "c": ["天文氣象時間類"]}, {"i": "打草驚蛇", "d": "比喻對付敵人時，行事不密，致使對方有所警覺，而預先防備。", "c": ["植物花木類"]}, {"i": "扭扭捏捏", "d": "故做嬌態或裝腔作勢、不大方自然。", "c": ["品格修養類"]}, {"i": "抑揚頓挫", "d": "形容音樂之聲響高低轉折，富變化又有節奏。", "c": ["身體感官類"]}, {"i": "投桃報李", "d": "你送給我桃子，我回贈李子。比喻朋友間友好往來或相互贈答。", "c": ["植物花木類", "生活器物類"]}, {"i": "投閒置散", "d": "置於不重要的地位，不予重用。", "c": ["天文氣象時間類"]}, {"i": "投鞭斷流", "d": "比喻軍旅眾多，兵力強大。", "c": ["文學典故修辭類"]}, {"i": "折箭為誓", "d": "把箭折斷發誓。暗示倘若違誓，下場如同此箭。形容意志堅決。", "c": ["戰爭軍事類"]}, {"i": "披星戴月", "d": "形容早出晚歸、連夜趕路或工作非常勞累。", "c": ["天文氣象時間類"]}, {"i": "抱蔓摘瓜", "d": "摘完瓜後連藤蔓也抱走。比喻株連無辜，趕盡殺絕。後藉喻順著線索，探查原委，查知真相。", "c": ["植物花木類"]}, {"i": "抱誠守真", "d": "信守真誠。", "c": ["品格修養類"]}, {"i": "拂袖而歸", "d": "無所留戀，回鄉歸隱。", "c": ["景物環境類"]}, {"i": "拈酸吃醋", "d": "形容喜歡吃醋、嫉妒。", "c": ["身體感官類"]}, {"i": "拋磚引玉", "d": "比喻自己先發表粗陋的詩文或不成熟的意見，以引出別人的佳作或高論，多用作自謙之詞。", "c": ["品格修養類"]}, {"i": "拍案叫絕", "d": "拍桌子叫好，形容非常讚賞。", "c": ["人際溝通表達類"]}, {"i": "拖泥帶水", "d": "比喻言辭或行為不乾脆。", "c": ["處境際遇做事態度類"]}, {"i": "拙口鈍辭", "d": "形容不會說話，拙於言辭。", "c": ["人際溝通表達類"]}, {"i": "拭目以待", "d": "擦亮眼睛等待著。比喻期待事情的發展及結果。", "c": ["情感心理類", "身體感官類"]}, {"i": "持之以恆", "d": "有恆心的堅持到底。", "c": ["品格修養類"]}, {"i": "指古摘今", "d": "形容才氣縱橫，立論鋒利。", "c": ["身體感官類"]}, {"i": "指日可待", "d": "指日，可以指出日期，比喻不久之後。指願望或期盼不久即將實現。", "c": ["身體感官類"]}, {"i": "指桑罵槐", "d": "指著桑樹罵槐樹，比喻拐彎抹角的罵人。", "c": ["植物花木類", "身體感官類"]}, {"i": "指顧之際", "d": "比喻時間十分短促。", "c": ["身體感官類"]}, {"i": "指鹿為馬", "d": "比喻人刻意顛倒是非。", "c": ["文學典故修辭類", "身體感官類"]}, {"i": "按兵不動", "d": "形容暫時不採取行動。", "c": ["戰爭軍事類"]}, {"i": "按圖索驥", "d": "比喻做事拘泥成規，呆板不知變通。或比喻按照所掌握的線索辦事。語本漢書梅福傳。驥，音ㄐㄧˋ。", "c": ["文學典故修辭類"]}, {"i": "挑燈夜戰", "d": "打著燈火在夜裡作戰。指熬夜做事。", "c": ["天文氣象時間類"]}, {"i": "捉襟見肘", "d": "形容人衣衫破敗，才抓住衣襟蔽胸，又露出了手肘。比喻困乏不足、窮於應付的窘態。", "c": ["情感心理類"]}, {"i": "捕風捉影", "d": "比喻所做的事或所說的話毫無根據，憑空揣測。", "c": ["天文氣象時間類"]}, {"i": "捨本逐末", "d": "指人不求事物的根本大端，只重視微末小節。", "c": ["文學典故修辭類", "處境際遇做事態度類"]}, {"i": "捶胸頓足", "d": "捶打胸膛，以腳跺地。形容極為悲憤或悔恨。", "c": ["情感心理類"]}, {"i": "掌上明珠", "d": "比喻極為珍愛的人或物。後多指愛女。", "c": ["生活器物類"]}, {"i": "探驪得珠", "d": "本指獲得極為珍貴的寶物。後引申為寫作文章能抓住重點，深得題旨的精髓。", "c": ["學習教育類", "生活器物類"]}, {"i": "推崇備至", "d": "非常尊敬與佩服。", "c": ["人際溝通表達類"]}, {"i": "推心置腹", "d": "比喻真心誠意的待人。", "c": ["情感心理類"]}, {"i": "推誠相見", "d": "以誠心待人。", "c": ["品格修養類"]}, {"i": "推陳出新", "d": "比喻排除老舊的，創造出嶄新的事物或方法。", "c": ["學習教育類"]}, {"i": "掩人耳目", "d": "比喻欺騙、蒙蔽他人。", "c": ["身體感官類"]}, {"i": "掩耳盜鈴", "d": "比喻自欺欺人。典出呂氏春秋自知。", "c": ["文學典故修辭類"]}, {"i": "揠苗助長", "d": "比喻使用不當的手段以求速成，結果不但無益，反而有害。典出孟子公孫丑上。揠，音ㄧㄚˋ。", "c": ["文學典故修辭類"]}, {"i": "揮汗如雨", "d": "抹下的汗水如同下雨一般。比喻流汗很多。", "c": ["天文氣象時間類"]}, {"i": "揮灑自如", "d": "隨意寫作詩文或書畫，不受拘束。", "c": ["學習教育類"]}, {"i": "援筆成章", "d": "比喻才思敏捷，且具文采。", "c": ["學習教育類"]}, {"i": "搬弄口舌", "d": "調唆、搬弄是非。", "c": ["身體感官類"]}, {"i": "撥雲見日", "d": "比喻除去障礙，重見光明。", "c": ["天文氣象時間類"]}, {"i": "撫今追昔", "d": "由眼前的事物，追憶起過去的一切。", "c": ["回憶往事類"]}, {"i": "擒賊擒王", "d": "打擊敵人要先擊敗為首的人。比喻做事要能把握關鍵。", "c": ["戰爭軍事類"]}, {"i": "擲地有聲", "d": "形容文辭巧妙華美、音韻鏗鏘有致。", "c": ["身體感官類"]}, {"i": "放蕩不羈", "d": "形容行為放縱隨便，不加檢點。", "c": ["處境際遇做事態度類"]}, {"i": "教學相長", "d": "教與學互相增長，指通過教授、學習，不但能使學生得到進步，而且教師本身的水準也可藉此提高。", "c": ["學習教育類", "情感心理類"]}, {"i": "教無常師", "d": "意即受教求知不必有固定的對象，有道德、有專長的人即可為師。", "c": ["學習教育類"]}, {"i": "敝帚自珍", "d": "比喻東西雖不好，卻因為是自己所擁有，故非常珍視。", "c": ["生活器物類"]}, {"i": "敷衍塞責", "d": "形容做事不認真負責，只是表面應付。", "c": ["處境際遇做事態度類"]}, {"i": "文不加點", "d": "形容文思敏捷、下筆成章，通篇無所塗改。", "c": ["學習教育類"]}, {"i": "文官不愛錢，武官不怕死", "d": "宋代名將岳飛，皇帝詢問他天下何時可太平，他認為只要文臣不貪財、武臣不畏死，則天下就太平了。", "c": ["情感心理類"]}, {"i": "文思泉湧", "d": "比喻行文時，思路迅速豐暢。", "c": ["學習教育類"]}, {"i": "文情並茂", "d": "形容文章辭藻、情致俱佳。", "c": ["學習教育類"]}, {"i": "文質彬彬", "d": "形容人舉止文雅，態度端莊。也用作形容文章內容與辭采並茂。", "c": ["人物形象類", "文學典故修辭類"]}, {"i": "斐然成章", "d": "形容言語或文章富有文采，且成章法。常用來稱讚別人的文章。", "c": ["文學典故修辭類"]}, {"i": "斗杓標東指", "d": "斗柄指向東方，表示春季來臨。", "c": ["天文氣象時間類"]}, {"i": "斗筲之人", "d": "比喻器量狹小，才疏學淺的人。", "c": ["品格修養類"]}, {"i": "斬草不除根，春風吹又生", "d": "比喻處理問題要從根本著手，澈底解決，否則經過一段時間，又會成為問題。", "c": ["天文氣象時間類"]}, {"i": "新鶯出谷", "d": "比喻人的歌聲，宛轉清脆，悅耳動聽，如黃鶯在山谷間鳴叫般。", "c": ["身體感官類"]}, {"i": "斷虀畫粥", "d": "形容不畏艱苦，刻苦勤學。", "c": ["學習教育類"]}, {"i": "旁若無人", "d": "對身旁的人視若無睹，形容說話舉動毫無顧忌。後亦用來形容態度高傲。", "c": ["情感心理類"]}, {"i": "旌旗所指", "d": "指軍隊所前往的地方。", "c": ["身體感官類"]}, {"i": "旗開得勝", "d": "比喻事情才一開始就獲得成功。", "c": ["戰爭軍事類"]}, {"i": "既生瑜，何生亮", "d": "用以感慨人外有人，天外有天；強中自有強中手。", "c": ["文學典故修辭類"]}, {"i": "日上三竿", "d": "太陽已上升到三根竹竿相接的高度。表示時候不早了。", "c": ["天文氣象時間類"]}, {"i": "日不移晷", "d": "時間短暫迅疾，連日影都沒移動。比喻非常迅速。", "c": ["天文氣象時間類"]}, {"i": "日新月異", "d": "形容發展或進步快速，不斷出現新事物或新現象。", "c": ["天文氣象時間類"]}, {"i": "日月如梭", "d": "形容時光迅速消逝。", "c": ["天文氣象時間類"]}, {"i": "日月蹉跎", "d": "歲月流逝，一無所成。", "c": ["天文氣象時間類"]}, {"i": "日月重光", "d": "比喻黑暗時期已過去，重新出現穩定清明的局面。", "c": ["天文氣象時間類"]}, {"i": "日正當中", "d": "太陽正位在中央。指正中午的時候。", "c": ["天文氣象時間類"]}, {"i": "日落西山", "d": "太陽隱沒在西邊的山腳下，指黃昏的時候。亦可用以比喻盛壯繁榮的事物轉為衰微敗落。", "c": ["天文氣象時間類"]}, {"i": "日鍛月煉", "d": "比喻長時間不懈的下苦功鑽研。", "c": ["處境際遇做事態度類"]}, {"i": "早知今日，何必當初", "d": "因看到今日的不良結果，而感慨從前的作為失當。", "c": ["情感心理類"]}, {"i": "旭日初升", "d": "清晨的太陽剛從東方升起。比喻充滿活力，生機勃勃的景象。也作「旭日東升」。", "c": ["天文氣象時間類"]}, {"i": "明察秋毫", "d": "比喻洞察一切，能看到極細微的地方。", "c": ["天文氣象時間類", "身體感官類"]}, {"i": "明日黃花", "d": "指在重陽節欣賞菊花最能景與情會，若錯過時令就毫無興味。後比喻為過時的事物。", "c": ["植物花木類", "顏色類"]}, {"i": "明槍易躲，暗箭難防", "d": "比喻公開的攻擊容易對付，而暗中的攻擊比較難以提防。", "c": ["戰爭軍事類"]}, {"i": "明珠暗投", "d": "比喻懷才不遇，高才屈居下位。後亦用來比喻好人誤入歧途。", "c": ["生活器物類"]}, {"i": "明鏡高懸", "d": "比喻官吏辦事明察無私，執法公正嚴明。", "c": ["其他"]}, {"i": "易牙之味", "d": "比喻食物味道鮮美，有如經過易牙調味。", "c": ["身體感官類"]}, {"i": "星移斗轉", "d": "星斗移位、轉向。比喻時光的流逝。", "c": ["天文氣象時間類"]}, {"i": "星羅棋布", "d": "形容布列繁密。", "c": ["天文氣象時間類"]}, {"i": "映雪囊螢", "d": "指夜晚利用雪光照明和螢火亮光讀書。形容人在艱困的環境中勤奮讀書。", "c": ["動物類", "學習教育類"]}, {"i": "春光明媚", "d": "形容春景妙麗動人。", "c": ["天文氣象時間類"]}, {"i": "春和景明", "d": "春氣和煦，景物明麗。", "c": ["天文氣象時間類"]}, {"i": "春回大地", "d": "嚴冬過去，春天再度降臨大地。比喻情勢好轉，或事情圓滿成功。", "c": ["天文氣象時間類"]}, {"i": "春寒料峭", "d": "早春薄寒，侵人肌骨。", "c": ["天文氣象時間類"]}, {"i": "春意闌珊", "d": "春天的景象衰敗凋殘。指春天將盡。", "c": ["天文氣象時間類"]}, {"i": "春暖花開", "d": "春光和煦宜人，百花紛紛綻放。", "c": ["天文氣象時間類", "植物花木類"]}, {"i": "春江水暖鴨先知", "d": "比喻處於某一環境中，會預先感受到環境改變的徵兆。", "c": ["天文氣象時間類"]}, {"i": "春秋鼎盛", "d": "正當壯盛之年。", "c": ["天文氣象時間類"]}, {"i": "春花秋月", "d": "比喻美好的時光與景物。", "c": ["天文氣象時間類"]}, {"i": "春華秋實", "d": "一為比喻文質，各擅其勝。二為比喻努力與成果過程的因果關係，即有「春華」才有「秋實」之意。", "c": ["天文氣象時間類"]}, {"i": "春雨貴如油", "d": "比喻非常珍貴。", "c": ["生活器物類"]}, {"i": "春風化雨", "d": "指適合草木生長的和風及雨水，亦用於比喻師長和藹親切的教導。", "c": ["天文氣象時間類", "學習教育類"]}, {"i": "春風得意", "d": "形容人因事情如願以償而心情愉悅滿足。", "c": ["天文氣象時間類"]}, {"i": "時來運轉", "d": "本來處境不好，遇到機會，由逆境轉到順境。", "c": ["天文氣象時間類"]}, {"i": "暑往寒來", "d": "夏天過去，冬天到來。泛指時光流逝。", "c": ["天文氣象時間類"]}, {"i": "暗度陳倉", "d": "比喻暗中進行的活動，亦用於比喻男女私通。", "c": ["戰爭軍事類"]}, {"i": "暗箭傷人", "d": "比喻暗中用陰險的手段傷害人。", "c": ["戰爭軍事類"]}, {"i": "暗送秋波", "d": "①指暗中以眼神傳達情意。②暗中巴結。", "c": ["天文氣象時間類"]}, {"i": "暗香疏影", "d": "描繪梅花的幽香和其枝幹橫斜。後成為梅花的代稱。", "c": ["身體感官類"]}, {"i": "暮雲春樹", "d": "表示朋友間思念情深的話。", "c": ["天文氣象時間類"]}, {"i": "暮鼓晨鐘", "d": "佛寺中早晚抱時的鐘鼓。後亦指一日的時光，或比喻使人警醒的力量。", "c": ["生活器物類"]}, {"i": "暴殄天物", "d": "比喻糟蹋物力，不知珍惜。", "c": ["天文氣象時間類"]}, {"i": "暴跳如雷", "d": "形容人急怒時跳腳吼叫的樣子。", "c": ["情感心理類"]}, {"i": "曇花一現", "d": "比喻事物稀有難得。後用來比喻人或事物一出現便迅速消失。", "c": ["回憶往事類", "天文氣象時間類", "植物花木類"]}, {"i": "曙光乍現", "d": "曙光，清晨的日光；乍，突然。曙光乍現比喻事情在混沌不明中突然出現一線光明、一絲希望。", "c": ["天文氣象時間類"]}, {"i": "曠日持久", "d": "歷時長久，拖延時日。", "c": ["天文氣象時間類"]}, {"i": "曲徑通幽", "d": "彎曲的小路通到風景美麗的地方。形容景色雅致迷人。", "c": ["景物環境類"]}, {"i": "更深半夜", "d": "夜深。", "c": ["天文氣象時間類"]}, {"i": "書中自有黃金屋", "d": "古代勸人讀書，以為只要書讀得好，富貴利祿自然到來。", "c": ["顏色類"]}, {"i": "月明如晝", "d": "形容月光明亮。", "c": ["天文氣象時間類"]}, {"i": "月明星稀", "d": "月色皎潔，星光稀疏不明。形容清朗幽靜的月夜。", "c": ["天文氣象時間類"]}, {"i": "月暈而風", "d": "比喻事情發生前，必有徵兆。", "c": ["天文氣象時間類"]}, {"i": "月朗風清", "d": "月色皎潔，微風清涼。形容夜色幽美宜人。", "c": ["天文氣象時間類"]}, {"i": "月白風清", "d": "月色皎潔，微風清涼。形容美好的月夜。", "c": ["顏色類"]}, {"i": "月盈則虧", "d": "比喻物盛極必衰。", "c": ["天文氣象時間類"]}, {"i": "月落星沉", "d": "月亮落下，星星低垂。指天色將亮的時候。", "c": ["天文氣象時間類"]}, {"i": "月黑風高", "d": "形容沒有月亮，風很大的晚上。", "c": ["天文氣象時間類", "顏色類"]}, {"i": "有教無類", "d": "指施教的對象，沒有貴賤貧富的分別。", "c": ["學習教育類", "文學典故修辭類"]}, {"i": "有條不紊", "d": "指條理分明，有次序而不雜亂。", "c": ["處境際遇做事態度類"]}, {"i": "有目共睹", "d": "比喻極為清楚明顯，眾所周知。", "c": ["身體感官類"]}, {"i": "有眼無珠", "d": "比喻缺乏辨別能力。", "c": ["生活器物類"]}, {"i": "望子成龍", "d": "希望自己的兒子能成大器。", "c": ["情感心理類"]}, {"i": "望梅止渴", "d": "比喻以空想來安慰自己。", "c": ["文學典故修辭類", "植物花木類"]}, {"i": "望眼欲穿", "d": "眼睛都快望穿了，形容盼望極其深切。", "c": ["情感心理類", "身體感官類"]}, {"i": "望穿秋水", "d": "望穿了眼睛，形容殷切盼望。", "c": ["天文氣象時間類", "情感心理類"]}, {"i": "望風披靡", "d": "形容為強大的氣勢所壓倒。", "c": ["戰爭軍事類"]}, {"i": "朝令夕改", "d": "比喻政令、主張或意見反覆無常。", "c": ["文學典故修辭類"]}, {"i": "朝趁暮食", "d": "早上賺到錢，晚上才有飯吃。形容生活窮苦。", "c": ["生活器物類"]}, {"i": "期期艾艾", "d": "形容口吃結巴的樣子。", "c": ["人際溝通表達類", "文學典故修辭類"]}, {"i": "木已成舟", "d": "木材已經做成船隻。比喻已成事實，無法改變。", "c": ["植物花木類", "生活器物類"]}, {"i": "未雨綢繆", "d": "比喻事先預備，防患未然。", "c": ["天文氣象時間類"]}, {"i": "末學膚受", "d": "學問不求根本，淺嘗即止，僅得皮毛。", "c": ["學習教育類"]}, {"i": "朽木不雕", "d": "腐朽的木頭已不能雕刻。比喻局勢或人敗壞到不可救藥的地步。", "c": ["植物花木類"]}, {"i": "李代桃僵", "d": "李樹代替桃樹受蟲咬而枯死，用以諷刺兄弟間不能互助互愛。後比喻以此代彼或代人受過。", "c": ["植物花木類"]}, {"i": "杏壇之光", "d": "泛指教育界的楷模。", "c": ["植物花木類"]}, {"i": "杞人憂天", "d": "比喻缺乏根據且不必要的憂慮。典出列子天瑞。杞，音ㄑㄧˇ。", "c": ["文學典故修辭類"]}, {"i": "束手無策", "d": "比喻面對問題時，毫無解決的辦法。", "c": ["身體感官類"]}, {"i": "杯弓蛇影", "d": "比喻為不存在的事情枉自驚惶。典出漢應劭風俗通義世間多有見怪驚怖以自傷者。", "c": ["戰爭軍事類", "文學典故修辭類"]}, {"i": "杯盤狼藉", "d": "形容酒席完畢，杯盤散亂的情形。", "c": ["生活器物類"]}, {"i": "東奔西走", "d": "到處奔走，或為某種目的而四處活動。", "c": ["情感心理類"]}, {"i": "東山再起", "d": "比喻官員退隱後，再度出任官職。亦用於比喻失敗後重新崛起。", "c": ["文學典故修辭類"]}, {"i": "東差西誤", "d": "形容辦事不得力。", "c": ["處境際遇做事態度類"]}, {"i": "杳如黃鶴", "d": "比喻一去不返，無影無蹤。杳，音ㄧㄠˇ。", "c": ["動物類", "顏色類"]}, {"i": "松鶴延年", "d": "松、鶴都是長壽的象徵。祝人延年益壽的賀辭。", "c": ["植物花木類"]}, {"i": "枕戈待旦", "d": "形容人全神戒備，絲毫不敢鬆懈。", "c": ["戰爭軍事類"]}, {"i": "枕石漱流", "d": "形容高潔之士的隱居生活。", "c": ["品格修養類"]}, {"i": "果熟自落", "d": "比喻時機成熟，結果即會自現，無須強求。", "c": ["植物花木類"]}, {"i": "枝繁葉茂", "d": "比喻兒孫滿堂，子孫眾多。", "c": ["植物花木類"]}, {"i": "枝葉扶疏", "d": "○1枝葉繁密四布。形容樹木茂盛。○2比喻宗族繁衍昌盛。○3比喻文章詳細縝密、文詞華美。", "c": ["植物花木類"]}, {"i": "枯木逢春", "d": "比喻雖處於絕境卻重獲生機，或劣境忽然轉好。", "c": ["天文氣象時間類", "植物花木類"]}, {"i": "枯魚涸轍", "d": "車轍乾涸，則轍中之魚不能活。比喻人陷於困境。", "c": ["動物類"]}, {"i": "柳啼花怨", "d": "形容景象淒涼，心境悽惻。", "c": ["植物花木類"]}, {"i": "柳暗花明", "d": "○1形容綠柳成蔭，繁花似錦的美景。○2比喻在曲折艱辛之後，忽然絕處逢生，另有一番情景。", "c": ["植物花木類"]}, {"i": "柳暗花明又一村", "d": "本為寫景詩句。後用以比喻絕處逢生，忽現轉機。", "c": ["植物花木類"]}, {"i": "柳眉倒豎", "d": "形容女子發怒的樣子。", "c": ["植物花木類"]}, {"i": "柳綠花紅", "d": "形容春天花木茂盛，景色美好。", "c": ["植物花木類"]}, {"i": "栩栩如生", "d": "形容貌態逼真，彷彿具有生命力。", "c": ["學習教育類"]}, {"i": "根深蒂固", "d": "比喻根基堅固，不可動搖。", "c": ["植物花木類"]}, {"i": "桀驁不遜", "d": "凶暴倔強，傲慢不恭順。", "c": ["品格修養類"]}, {"i": "桂子飄香", "d": "形容中秋時桂花綻放，香氣飄散。", "c": ["身體感官類"]}, {"i": "桃李之教", "d": "老師的教誨。", "c": ["學習教育類"]}, {"i": "桃李滿門", "d": "指學生眾多。", "c": ["植物花木類"]}, {"i": "桃李爭妍", "d": "桃花和李花競相開放，形容春天明媚美麗。", "c": ["植物花木類"]}, {"i": "桃紅柳綠", "d": "桃花綻紅，柳枝垂綠。形容春天絢麗多彩的樣子。", "c": ["植物花木類"]}, {"i": "桑榆暮景", "d": "日暮時夕陽照在桑榆間。比喻晚年、年老。", "c": ["植物花木類"]}, {"i": "梁園雖好，不是久戀之家", "d": "異鄉雖好，卻不是久留的地方。", "c": ["文學典故修辭類"]}, {"i": "梅妻鶴子", "d": "宋林逋隱居於杭州西湖孤山，植梅養鶴以為伴，逍遙自在。因其無妻無子，故稱為「梅妻鶴子」。比喻清高或隱居。", "c": ["動物類", "品格修養類"]}, {"i": "梨園弟子", "d": "唐玄宗時對梨園歌舞藝人的稱呼，後用以泛稱演戲的人。也稱為「梨園子弟」。", "c": ["植物花木類"]}, {"i": "梨花帶雨", "d": "形容美女的淚容，有如春天沾著雨的梨花。", "c": ["植物花木類"]}, {"i": "棄甲曳兵", "d": "形容戰敗落荒而逃；亦比喻放棄或被打敗。", "c": ["戰爭軍事類"]}, {"i": "楚楚可憐", "d": "形容姿態纖弱嬌媚，惹人憐愛，亦用於形容神情淒楚或處境不佳，令人憐憫。", "c": ["文學典故修辭類", "植物花木類"]}, {"i": "槁木死灰", "d": "形體寂靜有如枯木，精神凝聚猶如冷灰。後形容人因遭受挫折變故而灰心絕望的樣子。", "c": ["植物花木類"]}, {"i": "槍林彈雨", "d": "形容戰爭猛烈。", "c": ["天文氣象時間類"]}, {"i": "樂不思蜀", "d": "比喻人因留戀異地而不想返回故鄉。或形容快樂得忘了歸去。", "c": ["文學典故修辭類"]}, {"i": "樂善好施", "d": "指樂於行善，喜好施捨、濟助他人。", "c": ["文學典故修辭類"]}, {"i": "標新立異", "d": "形容創立新奇的名目或主張，以表示與眾不同。", "c": ["文學典故修辭類"]}, {"i": "樹倒猢猻散", "d": "比喻有權勢的人一旦失勢，則其依附者隨即散去。猢猻，獼猴。", "c": ["植物花木類"]}, {"i": "樹大招風", "d": "樹長得高大時容易受到風吹。比喻個人名聲太大，容易招來妒嫉毀謗。也作「樹高招風」。", "c": ["植物花木類"]}, {"i": "樹欲靜而風不止", "d": "樹想要靜止，風卻不停地颳動它的枝葉。比喻形勢與自己的願望相違背。多用於感嘆人子希望盡孝時，父母卻已經亡故。", "c": ["植物花木類"]}, {"i": "橫刀奪愛", "d": "用強硬蠻橫的方式，奪取他人所喜愛的人或事物。", "c": ["情感心理類"]}, {"i": "橫掃千軍", "d": "形容勇武，打敗所有敵手。", "c": ["戰爭軍事類"]}, {"i": "櫛風沐雨", "d": "以風梳髮，以雨沐浴。比喻在外奔走，極為辛勞。", "c": ["天文氣象時間類", "處境際遇做事態度類"]}, {"i": "櫻桃小口", "d": "形容女子的嘴脣小巧而紅潤，如同櫻桃一般。", "c": ["植物花木類"]}, 涕泗縱橫", "d": "形容哭得很傷心。", "c": ["情感心理類"]}, {"i": "淚如雨下", "d": "哭得非常傷心，淚水如同下雨一般。形容十分傷心。", "c": ["天文氣象時間類"]}, {"i": "淡而無味", "d": "清淡而沒有味道。", "c": ["身體感官類"]}, {"i": "深宅大院", "d": "①房室眾多，庭院寬闊。②比喻富貴人家。", "c": ["景物環境類"]}, {"i": "混水摸魚", "d": "在混濁的水中撈魚。比喻趁混亂的時機謀取不正當的利益或指工作不認真。", "c": ["動物類"]}, {"i": "淺斟低唱", "d": "形容悠然自得，遣興消閒的情景。", "c": ["天文氣象時間類"]}, {"i": "渙然冰釋", "d": "像冰塊遇熱消融流散。後用以比喻疑慮、誤會、嫌隙等一下子完全消除。", "c": ["天文氣象時間類"]}, {"i": "渾渾噩噩", "d": "形容渾樸無知，也用來形容糊裡糊塗，茫無目的。", "c": ["文學典故修辭類"]}, {"i": "湖光山色", "d": "湖水的波光，山中的景色。形容美好的自然風景。", "c": ["景物環境類"]}, {"i": "溫文儒雅", "d": "形容人文質彬彬，態度溫和文雅。", "c": ["品格修養類"]}, {"i": "溫文爾雅", "d": "形容人文質彬彬，態度溫和典雅。", "c": ["人物形象類", "品格修養類"]}, {"i": "溫柔敦厚", "d": "溫和而篤實寬厚。", "c": ["品格修養類"]}, {"i": "滂沱大雨", "d": "形容雨勢盛大。", "c": ["天文氣象時間類"]}, {"i": "滄海桑田", "d": "比喻環境改變很大。後亦用來比喻世事無常，變化很快。", "c": ["植物花木類"]}, {"i": "滄海遺珠", "d": "被採珠人遺漏在大海的珍珠。比喻被埋沒的人才或被人忽視的珍貴事物。", "c": ["生活器物類"]}, {"i": "滔滔不絕", "d": "形容說話連續不斷。", "c": ["人際溝通表達類"]}, {"i": "滴酒不沾", "d": "一滴酒都不沾口，表示沒有喝酒的習慣或堅持不飲酒。", "c": ["生活器物類"]}, {"i": "滾瓜爛熟", "d": "滾落在地上的瓜，熟透了。比喻極為純熟流利。", "c": ["文學典故修辭類", "植物花木類"]}, {"i": "滿城風雨", "d": "本指自然現象，後指事情一經傳出，便流言四起，到處議論紛紛。", "c": ["天文氣象時間類"]}, {"i": "滿目瘡痍", "d": "映入眼中的都是殘破不堪的悲涼景象。", "c": ["身體感官類"]}, {"i": "滿舌生花", "d": "比喻口若懸河，說得天花亂墜。", "c": ["身體感官類"]}, {"i": "滿面春風", "d": "形容滿臉笑容，心情喜悅，或得意的情狀。", "c": ["天文氣象時間類"]}, {"i": "漏網之魚", "d": "比喻僥倖逃避法律制裁的人。", "c": ["動物類"]}, {"i": "潑油救火", "d": "使事態更加嚴重。", "c": ["生活器物類"]}, {"i": "潔身自愛", "d": "保持自身清白純潔，而不與人同流合汙。", "c": ["情感心理類"]}, {"i": "潘安再世", "d": "比喻男子非常英俊。", "c": ["人物形象類"]}, {"i": "潦草塞責", "d": "粗率不用心而敷衍了事。", "c": ["處境際遇做事態度類"]}, {"i": "潰不成軍", "d": "指軍隊潰敗得不成個軍隊。形容遭到慘敗。", "c": ["戰爭軍事類"]}, {"i": "濟世愛民", "d": "拯救時世，愛護人民。", "c": ["情感心理類"]}, {"i": "濫竽充數", "d": "比喻沒有真才實學的人，混在行家中充數；或比喻以不好的東西冒充場面；有時也用於自謙之辭。典出韓非子內儲說上。", "c": ["文學典故修辭類", "生活器物類"]}, {"i": "火上加油", "d": "比喻使事態更加擴張或惡化。", "c": ["生活器物類"]}, {"i": "火傘高張", "d": "比喻烈日當空。", "c": ["天文氣象時間類"]}, {"i": "火眼金睛", "d": "本指小說中能識別妖魔鬼怪的眼睛，後以比喻深具洞察力，能分辨真偽善惡。", "c": ["身體感官類"]}, {"i": "炎陽炙人", "d": "指炎熱的太陽照射在身上，好像烤火一般熱。形容非常酷熱。", "c": ["天文氣象時間類"]}, {"i": "炙手可熱", "d": "比喻地位尊貴，勢燄熾盛。後亦用來比喻廣受歡迎，名聲極盛。", "c": ["身體感官類"]}, {"i": "為國捐軀", "d": "為國犧牲性命。", "c": ["品格修養類"]}, {"i": "為臣死忠，為子死孝", "d": "為臣者應不惜犧牲性命以效忠國家，為子者應盡力孝順父母。", "c": ["品格修養類"]}, {"i": "烈日當空", "d": "炎熱的太陽高掛天空。形容天氣酷熱。", "c": ["天文氣象時間類"]}, {"i": "烏飛兔走", "d": "比喻日月運行，光陰流逝快速。", "c": ["天文氣象時間類"]}, {"i": "烏鳥之情", "d": "相傳幼烏鴉長成後，會反哺年老而無法覓食的老烏鴉。用以比喻奉養長輩的孝心。", "c": ["動物類", "情感心理類"]}, {"i": "烘雲托月", "d": "比喻不從正面描繪，而從側面點染以烘托出所欲表現的重點。", "c": ["天文氣象時間類"]}, {"i": "焚琴煮鶴", "d": "把琴當柴燒，烹煮鶴來吃。比喻極殺風景的事。", "c": ["動物類"]}, {"i": "焚膏繼晷", "d": "形容不眠不休地工作或活動。", "c": ["學習教育類"]}, {"i": "無出其右", "d": "古時以右為尊。指沒有人能勝過他，為推許之詞。", "c": ["文學典故修辭類"]}, {"i": "無心插柳柳成蔭", "d": "無意間的舉動，竟產生了意想不到的結果。", "c": ["植物花木類"]}, {"i": "無憂無慮", "d": "毫無憂慮。形容心情怡然自得。", "c": ["人物形象類"]}, {"i": "無所事事", "d": "什麼事也不做，閒蕩無事的樣子。", "c": ["情感心理類"]}, {"i": "無拘無束", "d": "自由而不受約束。", "c": ["情感心理類"]}, {"i": "無法無天", "d": "沒有法紀、天理。形容人肆意妄為毫無顧忌。", "c": ["處境際遇做事態度類"]}, {"i": "無的放矢", "d": "比喻毫無事實根據而胡亂地指責、攻擊別人。", "c": ["戰爭軍事類"]}, {"i": "無聲無息", "d": "沉寂沒有聲音。比喻人沒有名氣或對事情不發生影響。", "c": ["身體感官類"]}, {"i": "無顏見江東父老", "d": "指心懷羞愧，沒臉見自己人。", "c": ["情感心理類"]}, {"i": "焦頭爛額", "d": "比喻做事陷入十分狼狽窘迫的困境或犧牲慘重。", "c": ["情感心理類"]}, {"i": "煙波釣徒", "d": "比喻隱居湖海，不慕榮利的人。", "c": ["品格修養類"]}, {"i": "煙消雲散", "d": "比喻事物如煙雲消散盡淨。", "c": ["天文氣象時間類"]}, {"i": "燈紅酒綠", "d": "原描述夜飲聚會的情景。後用以形容夜晚尋歡作樂，奢侈淫靡的生活。", "c": ["生活器物類"]}, {"i": "爐火純青", "d": "比喻學問、技術、功夫等到達精純完美的境地。", "c": ["顏色類"]}, {"i": "父嚴子孝", "d": "父親嚴厲管教子女，子女順從孝敬父親。", "c": ["情感心理類"]}, {"i": "父子天性", "d": "父子之間的感情出於天然。", "c": ["情感心理類"]}, {"i": "父慈子孝", "d": "父親慈愛，兒女孝順。", "c": ["情感心理類"]}, {"i": "父析子荷", "d": "父劈柴，子擔負之。比喻子承父業。", "c": ["情感心理類"]}, {"i": "父母之邦", "d": "祖國，己身所屬之國。", "c": ["情感心理類"]}, {"i": "父母恩勤", "d": "父母養育子女的慈愛和辛勤。", "c": ["情感心理類"]}, {"i": "爾虞我詐", "d": "彼此互相詐騙。形容人際間的鉤心鬥角。", "c": ["其他"]}, {"i": "牙牙學語", "d": "形容嬰兒初學說話的聲音。", "c": ["學習教育類"]}, {"i": "牛刀小試", "d": "比喻有大才能，在小事上施展。", "c": ["動物類"]}, {"i": "牛山濯濯", "d": "本指山上無樹木。今多用以戲喻人禿頂無髮。", "c": ["動物類"]}, {"i": "牛衣對泣", "d": "牛衣，牛隻禦寒遮雨的覆蓋物。漢王章家貧，沒有被子蓋，生大病時只能睡在牛衣之中，他自料必死，於是對妻涕泣訣別。後比喻夫妻共度貧困的生活。", "c": ["動物類", "情感心理類"]}, {"i": "牛角掛書", "d": "唐李密貧寒，乘牛掛書於角上，邊行邊讀書。比喻勤勉讀書。", "c": ["動物類"]}, {"i": "牛頭不對馬嘴", "d": "比喻答非所問或事情兩不相符。", "c": ["動物類"]}, {"i": "牛鬼蛇神", "d": "(1)比喻內容荒誕不經的作品。(2)比喻形形色色的壞人。", "c": ["動物類"]}, {"i": "牝牝雞司晨", "d": "比喻女性當權。", "c": ["動物類"]}, {"i": "牡丹花下死，做鬼也風流", "d": "形容為美麗的女子而死，也是一件值得的風流韻事。", "c": ["植物花木類"]}, {"i": "牡丹雖好，全仗綠葉扶持", "d": "比喻一個人即使能力再好，也需要靠別人的幫助。", "c": ["植物花木類"]}, {"i": "物以稀為貴", "d": "東西稀少就顯得珍貴。", "c": ["生活器物類"]}, {"i": "物換星移", "d": "比喻景物的變遷，世事的更替。", "c": ["天文氣象時間類"]}, {"i": "物美價廉", "d": "物品精美，價格便宜。", "c": ["生活器物類"]}, {"i": "狐假虎威", "d": "比喻藉著有權者的威勢欺壓他人、作威作福。典出戰國策楚策一。", "c": ["文學典故修辭類"]}, {"i": "狐死首丘", "d": "傳說狐狸死時，頭必朝向狐穴所在的山丘。比喻不忘本或對故鄉的思念。", "c": ["景物環境類"]}, {"i": "狗嘴裡吐不出象牙", "d": "比喻人說話不中聽，說不出好話。", "c": ["人際溝通表達類"]}, {"i": "獐頭鼠目", "d": "形容人相貌鄙陋，令人生厭。", "c": ["身體感官類"]}, {"i": "獨占鰲頭", "d": "中了狀元，後亦稱在競賽中獲得第一名。", "c": ["處境際遇做事態度類"]}, {"i": "獨樹一格", "d": "比喻自成一家，擁有獨自的品味和風格。", "c": ["植物花木類"]}, {"i": "獨步一時", "d": "在當時獨一無二，無人能比。", "c": ["天文氣象時間類"]}, {"i": "獨步天下", "d": "才能出眾，天下第一。", "c": ["處境際遇做事態度類"]}, {"i": "玉樹臨風", "d": "形容人年少才貌出眾。", "c": ["人物形象類", "品格修養類", "植物花木類"]}, {"i": "珠圓玉潤", "d": "像珠子一般渾圓，像玉石一般溫潤。後用來比喻文詞、歌聲、字跡的流利、圓潤、娟秀。", "c": ["生活器物類"]}, {"i": "珠聯璧合", "d": "日月如併合的玉璧，星辰如成串的珍珠。古人認為是祥瑞的徵兆。後用來比喻人才或美好的事物相匹配或同時薈集。常用作祝賀新婚的頌辭。", "c": ["生活器物類"]}, {"i": "現身說法", "d": "本指佛、菩薩顯現種種化身，向眾生宣說佛法。後用來比喻以親身經歷為例證，來說明道理或勸導別人。", "c": ["處境際遇做事態度類"]}, {"i": "琵琶別抱", "d": "婦女改嫁。今常用於女子結識新的男友。", "c": ["生活器物類"]}, {"i": "璞玉渾金", "d": "比喻天然美質，未加修飾，或喻人品真純質樸。", "c": ["品格修養類"]}, {"i": "環堵蕭然", "d": "形容居室簡陋，十分貧窮。", "c": ["景物環境類"]}, {"i": "環肥燕瘦", "d": "比喻美人不同的體態而各擅其美。", "c": ["身體感官類"]}, {"i": "瓊樓玉宇", "d": "形容精美華麗的樓閣。亦用以指月宮或神仙住的地方。", "c": ["景物環境類"]}, {"i": "瓜剖豆分", "d": "瓜被剖開，豆從筴中分裂而出。比喻國土被併吞、分割。", "c": ["植物花木類"]}, {"i": "瓜熟蒂落", "d": "比喻懷胎足月生產，亦用於比喻時機成熟，事情自然成功。", "c": ["植物花木類"]}, {"i": "瓜田李下", "d": "比喻容易引起懷疑的場合。", "c": ["植物花木類"]}, {"i": "甕中捉鱉", "d": "捕捉已在甕裡的鱉。比喻舉手可得、確有把握。", "c": ["生活器物類"]}, {"i": "甕牖繩樞", "d": "用破甕的口作窗戶，用繩子作門軸。比喻貧寒之家。", "c": ["景物環境類"]}, {"i": "甘之如飴", "d": "指苦難來臨，甘心承受。", "c": ["文學典故修辭類", "身體感官類"]}, {"i": "甘棠遺愛", "d": "表示對賢官廉吏的愛戴或懷念。", "c": ["情感心理類"]}, {"i": "甘瓜苦蒂", "d": "比喻事物不可能十全十美。", "c": ["身體感官類"]}, {"i": "甜言蜜語", "d": "甜美動聽的言語。", "c": ["身體感官類"]}, {"i": "生死之交", "d": "可以共生死，共患難的交誼。", "c": ["情感心理類"]}, {"i": "生花妙筆", "d": "比喻文筆美妙，變化多姿，有寫作的才華。", "c": ["植物花木類"]}, {"i": "生離死別", "d": "生時的分離與死亡時的永別。", "c": ["品格修養類"]}, {"i": "男兒膝下有黃金", "d": "形容男子的氣節，絕不因逆境而屈膝求人。", "c": ["顏色類"]}, {"i": "男耕女織", "d": "農業社會中男女分工，男子多下田耕種，女子多在家織布。", "c": ["植物花木類"]}, {"i": "畫中有詩", "d": "泛指畫作中有詩意。", "c": ["學習教育類"]}, {"i": "畫虎類犬", "d": "比喻人仿效失真，得到反效果，變得不倫不類。", "c": ["學習教育類"]}, {"i": "畫蛇添足", "d": "比喻多此一舉反將事情弄糟。典出戰國策齊策二。", "c": ["學習教育類", "文學典故修辭類"]}, {"i": "畫龍點睛", "d": "比喻繪畫、作文時在最重要之處加上一筆，使全體更加生動傳神。", "c": ["學習教育類"]}, {"i": "異軍突起", "d": "比喻突然興起的新生力量。", "c": ["文學典故修辭類"]}, {"i": "當仁不讓", "d": "面臨仁義之事而不謙讓。後指遇到應該做的事，主動承擔起來，而不推讓。", "c": ["文學典故修辭類"]}, {"i": "疾言厲色", "d": "指言語急迫，神色嚴厲。形容人發怒的樣子。", "c": ["人際溝通表達類"]}, {"i": "痛心疾首", "d": "比喻痛恨到極點。疾首，頭痛。", "c": ["情感心理類"]}, {"i": "瘋瘋癲癲", "d": "精神或舉止不正常的樣子。", "c": ["文學典故修辭類"]}, {"i": "瘦骨嶙峋", "d": "形容人身體枯瘦、骨骼突出可見。", "c": ["身體感官類"]}, {"i": "登峰造極", "d": "比喻成就達到極點或造詣高深精絕。", "c": ["文學典故修辭類"]}, {"i": "發憤忘食", "d": "專心學習或工作以致忘記吃飯。形容十分勤奮。", "c": ["文學典故修辭類"]}, {"i": "白刀子進去，紅刀子出來", "d": "用刀殺生。", "c": ["顏色類"]}, {"i": "白手起家", "d": "沒有任何依恃而獨立興起家業。", "c": ["顏色類"]}, {"i": "白雲蒼狗", "d": "比喻世事變幻無常。", "c": ["天文氣象時間類", "顏色類"]}, {"i": "白頭偕老", "d": "形容夫妻恩愛到老。", "c": ["情感心理類"]}, {"i": "白駒過隙", "d": "指快馬從縫隙一下子就奔馳過去。比喻時間過得很快。", "c": ["天文氣象時間類", "顏色類"]}, {"i": "百口莫辯", "d": "比喻冤屈無法申訴辯白。", "c": ["文學典故修辭類"]}, {"i": "百年樹人", "d": "形容培育人才的不容易。", "c": ["植物花木類"]}, {"i": "百感交集", "d": "比喻思緒混亂，感情複雜。", "c": ["情感心理類"]}, {"i": "百折不撓", "d": "意志剛強，雖受盡挫折，仍能堅持不變，奮鬥到底。", "c": ["品格修養類", "文學典故修辭類"]}, {"i": "百步穿楊", "d": "形容射箭技術高超或射擊技藝高強。", "c": ["戰爭軍事類", "植物花木類"]}, {"i": "百發百中", "d": "形容射擊技術高超，絕無虛發。亦用來形容技術高妙，能命中目標。或形容料事、用計、施藥等相當準確。", "c": ["戰爭軍事類"]}, {"i": "百花齊放", "d": "(1)形容各種花朵一起開放，繁華茂盛。(2)比喻各種形式風格的藝術或思想蓬勃發展。", "c": ["植物花木類"]}, {"i": "皓齒星眸", "d": "形容女子容貌明麗。", "c": ["天文氣象時間類"]}, {"i": "盜泉寧渴", "d": "寧死也不接受不義之物，不同流合汙。", "c": ["文學典故修辭類"]}, {"i": "盡付闕如", "d": "完全缺乏。", "c": ["其他"]}, {"i": "盡心竭力", "d": "費盡心思，竭盡全力。", "c": ["處境際遇做事態度類"]}, {"i": "盡心竭誠", "d": "竭盡心中的誠意。", "c": ["品格修養類"]}, {"i": "盡忠職守", "d": "竭盡忠誠，堅守崗位。", "c": ["品格修養類"]}, {"i": "盤根錯節", "d": "比喻事情複雜，不易分解。", "c": ["植物花木類"]}, {"i": "目不交睫", "d": "比喻人忙碌或心情不安而不能入眠。", "c": ["文學典故修辭類"]}, {"i": "目不暇給", "d": "形容眼前美好事物太多，或景物變化太快，眼睛來不及觀看。", "c": ["身體感官類"]}, {"i": "目不識丁", "d": "比喻不識字或毫無學問。", "c": ["身體感官類"]}, {"i": "目不轉睛", "d": "形容凝神注視，注意力高度集中。", "c": ["身體感官類"]}, {"i": "目中無人", "d": "形容人高傲自大，瞧不起別人。", "c": ["情感心理類", "身體感官類"]}, {"i": "目光如炬", "d": "形容目光有神。亦用於比喻見事透澈，識見遠大。炬，音ㄐㄩˋ。", "c": ["身體感官類"]}, {"i": "目光如豆", "d": "形容目光短淺，器識狹隘。", "c": ["身體感官類"]}, {"i": "目斷飛鴻", "d": "形容離別的悲悽之情。", "c": ["品格修養類"]}, {"i": "目無全牛", "d": "比喻技藝純熟高超。", "c": ["動物類"]}, {"i": "目無法紀", "d": "膽大妄為，無視於法律的存在。", "c": ["處境際遇做事態度類", "身體感官類"]}, {"i": "目眩神迷", "d": "形容所見情景令人驚異。", "c": ["身體感官類"]}, {"i": "目瞪口呆", "d": "受驚或受窘以致神情痴呆的樣子。", "c": ["身體感官類"]}, {"i": "目空一切", "d": "形容人高傲自大，什麼都不放在眼裡。", "c": ["情感心理類", "身體感官類"]}, {"i": "盲人摸象", "d": "比喻以偏概全，不能了解真相。", "c": ["人際溝通表達類"]}, {"i": "盲人瞎馬", "d": "比喻茫然不知處境極為危險。", "c": ["文學典故修辭類"]}, {"i": "直搗黃龍", "d": "指直接進擊敵方都城、巢穴。", "c": ["戰爭軍事類"]}, {"i": "相形見絀", "d": "兩相比較之下顯得不如對方。", "c": ["其他"]}, {"i": "相時而動", "d": "觀察時機再採取行動。", "c": ["天文氣象時間類"]}, {"i": "眉飛色舞", "d": "形容非常喜悅得意的神情。", "c": ["情感心理類"]}, {"i": "眼明手快", "d": "眼光銳利，動作敏捷。", "c": ["處境際遇做事態度類", "身體感官類"]}, {"i": "眼穿腸斷", "d": "形容盼望渴切，傷心極了。", "c": ["情感心理類"]}, {"i": "眾叛親離", "d": "形容不得人心，處境孤立。", "c": ["情感心理類"]}, {"i": "眾口鑠金", "d": "比喻眾口同聲，往往積非成是。", "c": ["文學典故修辭類"]}, {"i": "眾目睽睽", "d": "眾人都睜大眼睛注視著。", "c": ["身體感官類"]}, {"i": "眾矢之的", "d": "比喻眾人一致攻擊的目標。", "c": ["戰爭軍事類"]}, {"i": "睹物生情", "d": "看到某些事物、景物而湧生情感。", "c": ["回憶往事類"]}, {"i": "瞞天過海", "d": "比喻欺騙的手法很高明。", "c": ["天文氣象時間類", "戰爭軍事類"]}, {"i": "瞠目結舌", "d": "形容吃驚、受窘的樣子。", "c": ["身體感官類"]}, {"i": "瞭如指掌", "d": "比喻對事情的狀況了解得非常清楚。", "c": ["身體感官類"]}, {"i": "瞻前顧後"
