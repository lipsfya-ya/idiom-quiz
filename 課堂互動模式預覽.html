<script>

// ============ 成語測驗引擎（練習模式／測驗模式共用） ============

// 可重現的亂數產生器（課堂模式用同一個 seed 讓全班拿到同一份題目）
function makeSeededRandom(seed) {
  var s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rng) {
  var rand = rng || Math.random;
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function sample(arr, n, rng) {
  return shuffle(arr, rng).slice(0, n);
}

// 依選取的類別過濾成語池；categories 為空陣列時代表「全部類別」
function filterIdiomsByCategory(categories) {
  if (!categories || categories.length === 0) return IDIOM_DB.slice();
  return IDIOM_DB.filter(function (it) {
    return it.c.some(function (c) { return categories.indexOf(c) !== -1; });
  });
}

function filterExamByCategory(categories) {
  if (!categories || categories.length === 0) return EXAM_BANK.slice();
  return EXAM_BANK.filter(function (q) {
    if (!q.categories || q.categories.length === 0) return true; // 未分類題目一律納入
    return q.categories.some(function (c) { return categories.indexOf(c) !== -1; });
  });
}

// 產生「看釋義選成語」題目
function makeDefToIdiomQuestion(pool, subject, usedIdiomTexts, rng) {
  var distractPool = IDIOM_DB.filter(function (it) {
    return it.i !== subject.i && usedIdiomTexts.indexOf(it.i) === -1;
  });
  var sameCat = distractPool.filter(function (it) {
    return it.c.some(function (c) { return subject.c.indexOf(c) !== -1; });
  });
  var candidates = sameCat.length >= 3 ? sameCat : distractPool;
  var distractors = sample(candidates, 3, rng);
  var options = shuffle([subject].concat(distractors), rng).map(function (it) { return it.i; });
  var correctIndex = options.indexOf(subject.i);
  return {
    type: 'defToIdiom',
    stem: subject.d,
    stemLabel: '請選出符合下列釋義的成語：',
    options: options,
    correctIndex: correctIndex,
    explanation: subject.i + '：' + subject.d,
    hint: '提示：這個成語共 ' + subject.i.length + ' 個字，第一個字是「' + subject.i.charAt(0) + '」。',
    subjectIdiom: subject.i
  };
}

// 產生「看成語選釋義」題目
function makeIdiomToDefQuestion(pool, subject, usedIdiomTexts, rng) {
  var distractPool = IDIOM_DB.filter(function (it) {
    return it.i !== subject.i && usedIdiomTexts.indexOf(it.i) === -1;
  });
  var distractors = sample(distractPool, 3, rng);
  var options = shuffle([subject].concat(distractors), rng).map(function (it) { return it.d; });
  var correctIndex = options.indexOf(subject.d);
  return {
    type: 'idiomToDef',
    stem: subject.i,
    stemLabel: '請選出「' + subject.i + '」正確的釋義：',
    options: options,
    correctIndex: correctIndex,
    explanation: subject.i + '：' + subject.d,
    hint: '提示：這個成語屬於「' + subject.c[0] + '」。',
    subjectIdiom: subject.i
  };
}

// 轉換段考題庫題目為統一格式
function makeExamQuestion(q) {
  var letters = ['A', 'B', 'C', 'D'];
  var options = letters.map(function (l) { return q.options[l]; });
  var correctIndex = letters.indexOf(q.answer);
  var hintIdiom = null;
  if (q.matched_idioms && q.matched_idioms.length) {
    hintIdiom = q.matched_idioms[0];
  }
  return {
    type: 'exam',
    stem: q.stem,
    stemLabel: '',
    options: options,
    correctIndex: correctIndex,
    explanation: (q.explanation || '').replace(/^（\d+\.?/, '（').trim() || '（教材未提供詳解）',
    hint: hintIdiom ? ('提示：這一題與成語「' + hintIdiom + '」有關，可以先想想它的意思。') : '提示：請仔細閱讀題幹，先刪去明顯不合文意的選項。',
    subjectIdiom: hintIdiom || q.stem.slice(0, 6)
  };
}

/**
 * 組一份測驗
 * categories: string[]  選取的類別（空陣列＝全部）
 * count: number 題數（5~20）
 * seed: number（選填）給定同一個 seed，會產生一模一樣的題目順序與內容，
 *        課堂模式用來讓全班拿到同一份測驗
 */
function assembleQuiz(categories, count, seed) {
  var rng = (seed !== undefined && seed !== null && seed !== '') ? makeSeededRandom(Number(seed)) : Math.random;

  var idiomPool = filterIdiomsByCategory(categories);
  var examPool = filterExamByCategory(categories);

  if (idiomPool.length < 8) {
    // 類別題庫太少，自動補上全部成語庫，避免無法出題
    idiomPool = IDIOM_DB.slice();
  }

  var examTarget = Math.min(Math.round(count * 0.4), examPool.length);
  var chosenExam = sample(examPool, examTarget, rng);

  var remaining = count - chosenExam.length;
  var idiomShuffled = shuffle(idiomPool, rng);
  var used = [];
  var generated = [];
  var idx = 0;
  while (generated.length < remaining && idx < idiomShuffled.length) {
    var subject = idiomShuffled[idx++];
    if (used.indexOf(subject.i) !== -1) continue;
    used.push(subject.i);
    var q = (generated.length % 2 === 0)
      ? makeDefToIdiomQuestion(idiomPool, subject, used, rng)
      : makeIdiomToDefQuestion(idiomPool, subject, used, rng);
    generated.push(q);
  }
  // pool 不夠時，允許重複補足（極端情況）
  while (generated.length < remaining && idiomPool.length > 0) {
    var subject2 = idiomShuffled[Math.floor(rng() * idiomShuffled.length)];
    var q2 = makeDefToIdiomQuestion(idiomPool, subject2, used, rng);
    generated.push(q2);
  }

  var examQuestions = chosenExam.map(makeExamQuestion);
  var all = shuffle(generated.concat(examQuestions), rng);
  return all.slice(0, count);
}


</script>
<script>
document.getElementById('btn-login').onclick = login;
document.getElementById('in-pass').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') login();
});

function login() {
  var pass = document.getElementById('in-pass').value.trim();
  var configured = (CONFIG.TEACHER_PASSCODE || '').trim();
  if (!configured || configured.indexOf('請改成') === 0) {
    document.getElementById('login-msg').textContent = '尚未在 config.js 設定教師密碼。';
    return;
  }
  if (pass !== configured) {
    document.getElementById('login-msg').textContent = '密碼錯誤，請再試一次。';
    return;
  }
  document.getElementById('screen-login').style.display = 'none';
  document.getElementById('screen-main').style.display = 'block';
  init();
}

var ROSTER_KEY = 'classroomRoster_v1';

function renderChips(containerId) {
  var box = document.getElementById(containerId);
  box.innerHTML = '';
  CATEGORY_LIST.forEach(function (cat) {
    var chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = cat;
    chip.onclick = function () { chip.classList.toggle('selected'); };
    box.appendChild(chip);
  });
}

function getSelectedCats(containerId) {
  var chips = document.querySelectorAll('#' + containerId + ' .chip.selected');
  return Array.prototype.map.call(chips, function (c) { return c.textContent; });
}

function loadRoster() {
  try {
    var raw = localStorage.getItem(ROSTER_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}

function saveRosterFromTextarea() {
  var text = document.getElementById('roster-text').value;
  var names = text.split(/[\n,、，]/).map(function (s) { return s.trim(); }).filter(Boolean);
  try { localStorage.setItem(ROSTER_KEY, JSON.stringify(names)); } catch (e) {}
  document.getElementById('roster-count').textContent = '目前名單：' + names.length + ' 人（已儲存）';
  return names;
}

function init() {
  renderChips('draw-category-chips');
  renderChips('quiz-category-chips');

  var roster = loadRoster();
  document.getElementById('roster-text').value = roster.join('、');
  document.getElementById('roster-count').textContent = '目前名單：' + roster.length + ' 人';

  document.getElementById('btn-save-roster').onclick = saveRosterFromTextarea;

  document.getElementById('btn-draw-question').onclick = drawQuestion;
  document.getElementById('btn-draw-student').onclick = drawStudent;
  document.getElementById('btn-generate-link').onclick = generateLink;
  document.getElementById('btn-copy-link').onclick = copyLink;
}

function escapeHtml(s) {
  var div = document.createElement('div');
  div.textContent = s == null ? '' : s;
  return div.innerHTML;
}

var currentDrawQuestion = null;

function drawQuestion() {
  var cats = getSelectedCats('draw-category-chips');
  var q = assembleQuiz(cats, 1)[0];
  currentDrawQuestion = q;

  document.getElementById('question-stage').style.display = 'block';
  document.getElementById('draw-stem-label').textContent = q.stemLabel || '';
  document.getElementById('draw-stem').textContent = q.stem;

  var LETTERS = ['A', 'B', 'C', 'D'];
  var optBox = document.getElementById('draw-options');
  optBox.innerHTML = '';
  q.options.forEach(function (opt, i) {
    var div = document.createElement('div');
    div.className = 'opt';
    div.style.cursor = 'default';
    div.innerHTML = '<span class="letter">' + LETTERS[i] + '</span>' + escapeHtml(opt);
    div.setAttribute('data-idx', i);
    optBox.appendChild(div);
  });

  document.getElementById('draw-explanation').style.display = 'none';
  document.getElementById('btn-reveal-answer').style.display = 'inline-block';
  document.getElementById('btn-reveal-answer').onclick = revealAnswer;
}

function revealAnswer() {
  if (!currentDrawQuestion) return;
  var opts = document.querySelectorAll('#draw-options .opt');
  Array.prototype.forEach.call(opts, function (el) {
    var idx = parseInt(el.getAttribute('data-idx'), 10);
    if (idx === currentDrawQuestion.correctIndex) el.classList.add('correct');
  });
  var expl = document.getElementById('draw-explanation');
  expl.style.display = 'block';
  expl.innerHTML = '解析：' + escapeHtml(currentDrawQuestion.explanation);
  document.getElementById('btn-reveal-answer').style.display = 'none';
}

var drawRollTimer = null;

function drawStudent() {
  var roster = loadRoster();
  if (!roster.length) {
    alert('請先在上面輸入班級名單並儲存。');
    return;
  }
  document.getElementById('student-stage').style.display = 'block';
  var nameEl = document.getElementById('draw-name');
  nameEl.classList.add('rolling');
  if (drawRollTimer) clearInterval(drawRollTimer);
  var ticks = 0;
  var maxTicks = 14;
  drawRollTimer = setInterval(function () {
    nameEl.textContent = roster[Math.floor(Math.random() * roster.length)];
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(drawRollTimer);
      drawRollTimer = null;
      nameEl.classList.remove('rolling');
      nameEl.textContent = roster[Math.floor(Math.random() * roster.length)];
    }
  }, 70);
}

function generateLink() {
  var cats = getSelectedCats('quiz-category-chips');
  var countVal = parseInt(document.getElementById('quiz-count').value, 10);
  if (isNaN(countVal)) countVal = 10;
  countVal = Math.max(5, Math.min(20, countVal));
  document.getElementById('quiz-count').value = countVal;

  var seed = Date.now() % 2147483647;
  var base = location.href.replace(/classroom\.html.*$/, 'index.html');
  var url = base + '?seed=' + seed +
    (cats.length ? ('&cats=' + encodeURIComponent(cats.join(','))) : '') +
    '&count=' + countVal;

  document.getElementById('link-box').style.display = 'flex';
  document.getElementById('link-output').value = url;
  document.getElementById('copy-msg').textContent = '';
}

function copyLink() {
  var input = document.getElementById('link-output');
  input.select();
  input.setSelectionRange(0, 99999);
  var msg = document.getElementById('copy-msg');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(input.value).then(function () {
      msg.textContent = '已複製連結，貼給學生就可以了！';
    }).catch(function () {
      msg.textContent = '複製失敗，請手動選取複製上面的連結。';
    });
  } else {
    try {
      document.execCommand('copy');
      msg.textContent = '已複製連結，貼給學生就可以了！';
    } catch (e) {
      msg.textContent = '複製失敗，請手動選取複製上面的連結。';
    }
  }
}
</script>
</body>
</html>
